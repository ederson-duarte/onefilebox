    <script>
      /*
       * ==================================================
       * PROJECT_STORAGE:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - abrir IndexedDB
       * - salvar projetos
       * - carregar projetos
       * - listar projetos
       * - remover projetos
       * - salvar última tela
       * - criar estrutura do projeto
       * - exportar projeto para JSON
       * - importar projeto de JSON
       *
       * ==================================================
       */

      const ProjectStorage = {
        databaseName: "OneFileBox",

        /*
         * Versão atual do IndexedDB.
         */

        databaseVersion: 4,

        storeName: "projects",

        dataStoreName: "data",

        /*
         * ==================================================
         * ABRIR DATABASE
         * ==================================================
         */

        async open() {
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(
              this.databaseName,
              this.databaseVersion,
            );

            request.onupgradeneeded = (event) => {
              const database = event.target.result;

              /*
               * ==================================================
               * PROJETOS
               * ==================================================
               */

              if (!database.objectStoreNames.contains(this.storeName)) {
                database.createObjectStore(this.storeName, {
                  keyPath: "name",
                });
              }

              /*
               * ==================================================
               * DADOS
               * ==================================================
               */

              if (!database.objectStoreNames.contains(this.dataStoreName)) {
                const dataStore = database.createObjectStore(
                  this.dataStoreName,
                  {
                    keyPath: "id",
                    autoIncrement: true,
                  },
                );

                /*
                 * Índice por projeto.
                 */

                dataStore.createIndex("projectName", "projectName", {
                  unique: false,
                });

                /*
                 * Índice por tabela.
                 */

                dataStore.createIndex("tableName", "tableName", {
                  unique: false,
                });

                /*
                 * Índice composto.
                 */

                dataStore.createIndex(
                  "projectTable",
                  ["projectName", "tableName"],
                  {
                    unique: false,
                  },
                );
              } else {
                /*
                 * ==================================================
                 * GARANTE ÍNDICES EXISTENTES
                 * ==================================================
                 */

                const transaction = event.target.transaction;

                if (transaction) {
                  const dataStore = transaction.objectStore(this.dataStoreName);

                  if (!dataStore.indexNames.contains("projectName")) {
                    dataStore.createIndex("projectName", "projectName", {
                      unique: false,
                    });
                  }

                  if (!dataStore.indexNames.contains("tableName")) {
                    dataStore.createIndex("tableName", "tableName", {
                      unique: false,
                    });
                  }

                  if (!dataStore.indexNames.contains("projectTable")) {
                    dataStore.createIndex(
                      "projectTable",
                      ["projectName", "tableName"],
                      {
                        unique: false,
                      },
                    );
                  }
                }
              }
            };

            /*
             * ==================================================
             * SUCESSO
             * ==================================================
             */

            request.onsuccess = () => {
              const database = request.result;

              /*
               * ==================================================
               * VERIFICA STORE DE PROJETOS
               * ==================================================
               */

              if (!database.objectStoreNames.contains(this.storeName)) {
                database.close();

                reject(
                  new Error(
                    `IndexedDB: objectStore "${this.storeName}" não existe.`,
                  ),
                );

                return;
              }

              /*
               * ==================================================
               * VERIFICA STORE DE DADOS
               * ==================================================
               */

              if (!database.objectStoreNames.contains(this.dataStoreName)) {
                database.close();

                reject(
                  new Error(
                    `IndexedDB: objectStore "${this.dataStoreName}" não existe.`,
                  ),
                );

                return;
              }

              resolve(database);
            };

            /*
             * ==================================================
             * ERRO
             * ==================================================
             */

            request.onerror = () => {
              reject(request.error);
            };

            /*
             * ==================================================
             * BLOQUEADO
             * ==================================================
             */

            request.onblocked = () => {
              reject(
                new Error(
                  "IndexedDB está bloqueado. Feche outras abas do OneFileBox e tente novamente.",
                ),
              );
            };
          });
        },

        /*
         * ==================================================
         * SALVAR PROJETO
         * ==================================================
         */

        async save(name) {
          name = String(name || "").trim();

          if (!name) {
            throw new Error("O nome do projeto é obrigatório.");
          }

          const project = this.createProject(name);

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readwrite",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.put(project);

            request.onsuccess = () => {
              console.log("OneFileBox: projeto salvo no IndexedDB.", project);

              resolve(project);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * SALVAR SOMENTE A ÚLTIMA TELA
         * ==================================================
         */

        async saveLastScreen(projectName, screenId) {
          projectName = String(projectName || "").trim();

          screenId = String(screenId || "").trim();

          if (!projectName || !screenId) {
            return;
          }

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readwrite",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.get(projectName);

            request.onsuccess = () => {
              const project = request.result;

              if (!project) {
                reject(new Error("Projeto não encontrado."));

                return;
              }

              project.lastScreenId = screenId;

              store.put(project);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();

              resolve();
            };

            transaction.onerror = () => {
              database.close();

              reject(transaction.error);
            };

            transaction.onabort = () => {
              database.close();

              reject(transaction.error || new Error("Transação abortada."));
            };
          });
        },

        /*
         * ==================================================
         * CARREGAR PROJETO
         * ==================================================
         */

        async load(name) {
          name = String(name || "").trim();

          if (!name) {
            throw new Error("O nome do projeto é obrigatório.");
          }

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readonly",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.get(name);

            request.onsuccess = () => {
              const project = request.result || null;

              resolve(ProjectComponents.normalizeProject(project));
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * LISTAR PROJETOS
         * ==================================================
         */

        async list() {
          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readonly",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.getAll();

            request.onsuccess = () => {
              const projects = request.result.map((project) =>
                ProjectComponents.normalizeProject(project),
              );

              resolve(projects);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * REMOVER
         * ==================================================
         */

        async remove(name) {
          name = String(name || "").trim();

          if (!name) {
            throw new Error("O nome do projeto é obrigatório.");
          }

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readwrite",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.delete(name);

            request.onsuccess = () => {
              resolve();
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * CRIAR PROJETO
         * ==================================================
         */

        createProject(name) {
          const currentProject = EditorState.currentProject;

          /*
           * ==================================================
           * COPIA TELAS EXISTENTES
           * ==================================================
           */

          let screens =
            currentProject && Array.isArray(currentProject.screens)
              ? currentProject.screens.map((screen) => ({
                  id: screen.id,

                  name: screen.name,

                  components: Array.isArray(screen.components)
                    ? screen.components.map((component) =>
                        ProjectComponents.cloneComponent(component),
                      )
                    : [],
                }))
              : [];

          /*
           * ==================================================
           * CRIA HOME SE NÃO EXISTIR
           * ==================================================
           */

          if (!screens.length) {
            screens = [
              {
                id: ProjectComponents.createScreenId(),

                name: "Home",

                components: [],
              },
            ];
          }

          /*
           * ==================================================
           * NORMALIZA TODAS AS TELAS
           * ==================================================
           */

          screens = screens.map((screen) =>
            ProjectComponents.sanitizeScreen(screen),
          );

          /*
           * ==================================================
           * TELA ATUAL
           * ==================================================
           */

          const currentScreenIndex = screens.findIndex(
            (screen) => screen.id === EditorState.currentScreenId,
          );

          const currentScreen =
            currentScreenIndex >= 0 ? currentScreenIndex : 0;

          /*
           * ==================================================
           * SERIALIZA GRID ATUAL
           * ==================================================
           *
           * O DOM atual é transformado novamente em dados.
           *
           * ==================================================
           */

          screens[currentScreen].components =
            ProjectComponents.serializeCurrentGrid();

          /*
           * ==================================================
           * NORMALIZA NOVAMENTE
           * ==================================================
           */

          screens[currentScreen] = ProjectComponents.sanitizeScreen(
            screens[currentScreen],
          );

          /*
           * ==================================================
           * ÚLTIMA TELA
           * ==================================================
           */

          let lastScreenId = EditorState.currentScreenId;

          const lastScreenExists = screens.some(
            (screen) => screen.id === lastScreenId,
          );

          if (!lastScreenId || !lastScreenExists) {
            lastScreenId = screens[currentScreen]?.id || null;
          }

          /*
           * ==================================================
           * RETORNO
           * ==================================================
           */

          return {
            name,

            version: 5,

            screens,

            lastScreenId,

            grid: {
              columns: 12,
            },

            savedAt: new Date().toISOString(),
          };
        },

        /*
         * ==================================================
         * CARREGAR PROJETO COMPLETO NO EDITOR
         * ==================================================
         */

        loadProject(project) {
          project = ProjectComponents.normalizeProject(project);

          if (!project) {
            throw new Error("Projeto não encontrado.");
          }

          if (!DOM.grid) {
            throw new Error(
              "Não é possível carregar o projeto: grid do editor não existe.",
            );
          }

          EditorState.currentProject = project;

          /*
           * ==================================================
           * PRIMEIRO TENTA LAST SCREEN
           * ==================================================
           */

          let screenId = project.lastScreenId || EditorState.currentScreenId;

          const exists = project.screens.some(
            (screen) => screen.id === screenId,
          );

          if (!exists) {
            screenId = project.screens[0]?.id || null;
          }

          EditorState.currentScreenId = screenId;

          EditorState.currentScreen =
            project.screens.find((screen) => screen.id === screenId) || null;

          renderScreenList();

          ProjectComponents.loadCurrentScreen();

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }
        },

        /*
         * ==================================================
         * OBTER DADOS DO PROJETO
         * ==================================================
         *
         * Recupera todos os registros existentes no
         * DataStorage pertencentes ao projeto.
         *
         * O ID interno do IndexedDB NÃO é exportado.
         *
         * Isso é importante porque o ID é gerado novamente
         * quando o backup for restaurado.
         *
         * ==================================================
         */

        async getProjectData(projectName) {
          projectName = String(projectName || "").trim();

          if (!projectName) {
            return [];
          }

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.dataStoreName,
              "readonly",
            );

            const store = transaction.objectStore(this.dataStoreName);

            const index = store.index("projectName");

            const request = index.getAll(projectName);

            request.onsuccess = () => {
              const records = request.result || [];

              /*
               * Não exporta o ID interno do IndexedDB.
               */

              const exportedRecords = records.map((record) => ({
                projectName: projectName,

                tableName: record.tableName,

                values:
                  record.values &&
                  typeof record.values === "object" &&
                  !Array.isArray(record.values)
                    ? { ...record.values }
                    : {},

                createdAt: record.createdAt || new Date().toISOString(),
              }));

              resolve(exportedRecords);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();

              reject(transaction.error);
            };

            transaction.onabort = () => {
              database.close();

              reject(transaction.error || new Error("Transação abortada."));
            };
          });
        },

        /*
         * ==================================================
         * EXPORTAR PROJETO
         * ==================================================
         *
         * Retorna um objeto pronto para JSON.stringify().
         *
         * O projeto atual é primeiro serializado novamente
         * a partir do DOM para garantir que alterações
         * recentes estejam presentes no backup.
         *
         * ==================================================
         */

        async exportProject(name = null) {
          const currentProject = EditorState.currentProject;

          const projectName = String(name || currentProject?.name || "").trim();

          if (!projectName) {
            throw new Error("Nenhum projeto está aberto.");
          }

          /*
           * ==================================================
           * GERA SNAPSHOT ATUAL
           * ==================================================
           *
           * Isso garante que o JSON tenha as alterações
           * feitas no editor mesmo que ainda não tenham
           * sido salvas manualmente no IndexedDB.
           *
           * ==================================================
           */

          const project = this.createProject(projectName);

          /*
           * ==================================================
           * DADOS DO PROJETO
           * ==================================================
           */

          const data = await this.getProjectData(projectName);

          /*
           * ==================================================
           * BACKUP
           * ==================================================
           */

          return {
            format: "onefilebox-project",

            formatVersion: 1,

            exportedAt: new Date().toISOString(),

            project,

            data,
          };
        },

        /*
         * ==================================================
         * IMPORTAR PROJETO
         * ==================================================
         *
         * Recebe um objeto já convertido de JSON.
         *
         * O projeto existente com o mesmo nome será
         * substituído.
         *
         * Os dados existentes desse projeto também serão
         * substituídos pelos dados presentes no backup.
         *
         * ==================================================
         */

        async importProject(backup) {
          if (!backup || typeof backup !== "object") {
            throw new Error("Arquivo de projeto inválido.");
          }

          if (backup.format !== "onefilebox-project") {
            throw new Error(
              "Este arquivo não é um projeto válido do OneFileBox.",
            );
          }

          if (!backup.project || typeof backup.project !== "object") {
            throw new Error("O arquivo não contém os dados do projeto.");
          }

          /*
           * ==================================================
           * NORMALIZA PROJETO
           * ==================================================
           */

          const project = ProjectComponents.normalizeProject(backup.project);

          if (!project) {
            throw new Error("Não foi possível reconstruir o projeto.");
          }

          const projectName = String(project.name || "").trim();

          if (!projectName) {
            throw new Error("O projeto importado não possui um nome válido.");
          }

          /*
           * ==================================================
           * NORMALIZA DADOS
           * ==================================================
           */

          const data = Array.isArray(backup.data) ? backup.data : [];

          const database = await this.open();

          return new Promise((resolve, reject) => {
            let transaction;

            try {
              transaction = database.transaction(
                [this.storeName, this.dataStoreName],
                "readwrite",
              );
            } catch (error) {
              database.close();

              reject(error);

              return;
            }

            const projectStore = transaction.objectStore(this.storeName);

            const dataStore = transaction.objectStore(this.dataStoreName);

            /*
             * ==================================================
             * REMOVE DADOS ANTIGOS DO PROJETO
             * ==================================================
             */

            const dataIndex = dataStore.index("projectName");

            const getOldDataRequest = dataIndex.getAllKeys(projectName);

            getOldDataRequest.onsuccess = () => {
              const oldKeys = getOldDataRequest.result || [];

              oldKeys.forEach((key) => {
                dataStore.delete(key);
              });

              /*
               * ==================================================
               * SALVA PROJETO
               * ==================================================
               */

              projectStore.put(project);

              /*
               * ==================================================
               * RESTAURA DADOS
               * ==================================================
               */

              data.forEach((record) => {
                if (!record || typeof record !== "object") {
                  return;
                }

                const tableName = String(record.tableName || "").trim();

                if (!tableName) {
                  return;
                }

                /*
                 * O projectName vem sempre do projeto importado.
                 *
                 * Isso evita que um backup seja restaurado
                 * acidentalmente em outro projeto.
                 */

                const values =
                  record.values &&
                  typeof record.values === "object" &&
                  !Array.isArray(record.values)
                    ? { ...record.values }
                    : {};

                dataStore.add({
                  projectName,

                  tableName,

                  values,

                  createdAt: record.createdAt || new Date().toISOString(),
                });
              });
            };

            getOldDataRequest.onerror = () => {
              reject(getOldDataRequest.error);
            };

            /*
             * ==================================================
             * TRANSAÇÃO COMPLETA
             * ==================================================
             */

            transaction.oncomplete = () => {
              database.close();

              resolve(project);
            };

            /*
             * ==================================================
             * ERRO
             * ==================================================
             */

            transaction.onerror = () => {
              database.close();

              reject(transaction.error);
            };

            /*
             * ==================================================
             * ABORT
             * ==================================================
             */

            transaction.onabort = () => {
              database.close();

              reject(transaction.error || new Error("Importação abortada."));
            };
          });
        },
      };

    <script>
      /*
       * ==================================================
       * PROJECT_JSON:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - exportar projeto para arquivo JSON
       * - importar projeto de arquivo JSON
       * - validar arquivo
       * - baixar backup
       * - restaurar projeto no IndexedDB
       *
       * ==================================================
       */

      const ProjectJSON = {
        /*
         * ==================================================
         * EXPORTAR
         * ==================================================
         */

        async export() {
          if (ENV.isProd()) {
            alert(
              "A exportação de projetos não está disponível no modo de produção.",
            );

            return;
          }

          const project = EditorState.currentProject;

          if (!project) {
            alert("Nenhum projeto está aberto.");

            return;
          }

          try {
            /*
             * ==================================================
             * GERA BACKUP COMPLETO
             * ==================================================
             */

            const backup = await ProjectStorage.exportProject(project.name);

            /*
             * ==================================================
             * JSON
             * ==================================================
             */

            const json = JSON.stringify(backup, null, 2);

            /*
             * ==================================================
             * ARQUIVO
             * ==================================================
             */

            const blob = new Blob([json], {
              type: "application/json",
            });

            /*
             * ==================================================
             * DOWNLOAD
             * ==================================================
             */

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;

            link.download = ProjectJSON.createFileName(project.name);

            document.body.appendChild(link);

            link.click();

            link.remove();

            URL.revokeObjectURL(url);

            console.log(
              `OneFileBox: projeto "${project.name}" exportado para JSON.`,
            );
          } catch (error) {
            console.error("OneFileBox: erro ao exportar projeto:", error);

            alert("Não foi possível exportar o projeto.");
          }
        },

        /*
         * ==================================================
         * IMPORTAR
         * ==================================================
         */

        async import() {
          if (ENV.isProd()) {
            alert(
              "A importação de projetos não está disponível no modo de produção.",
            );

            return;
          }

          /*
           * ==================================================
           * INPUT TEMPORÁRIO
           * ==================================================
           */

          const input = document.createElement("input");

          input.type = "file";

          input.accept = ".json,application/json";

          /*
           * ==================================================
           * SELEÇÃO
           * ==================================================
           */

          input.addEventListener(
            "change",
            async () => {
              const file = input.files?.[0];

              if (!file) {
                return;
              }

              try {
                /*
                 * ==================================================
                 * LÊ ARQUIVO
                 * ==================================================
                 */

                const text = await file.text();

                /*
                 * ==================================================
                 * JSON
                 * ==================================================
                 */

                let backup;

                try {
                  backup = JSON.parse(text);
                } catch {
                  throw new Error("O arquivo não contém um JSON válido.");
                }

                /*
                 * ==================================================
                 * VALIDA
                 * ==================================================
                 */

                ProjectJSON.validateBackup(backup);

                const projectName = backup.project.name;

                /*
                 * ==================================================
                 * CONFIRMAÇÃO
                 * ==================================================
                 *
                 * Importar substitui o projeto existente
                 * com o mesmo nome e seus dados.
                 *
                 * ==================================================
                 */

                const confirmed = confirm(
                  `Importar o projeto "${projectName}"?\n\n` +
                    `Se já existir um projeto com esse nome, ` +
                    `ele será substituído.`,
                );

                if (!confirmed) {
                  return;
                }

                /*
                 * ==================================================
                 * IMPORTA
                 * ==================================================
                 */

                const importedProject =
                  await ProjectStorage.importProject(backup);

                /*
                 * ==================================================
                 * CARREGA NO EDITOR
                 * ==================================================
                 */

                ProjectStorage.loadProject(importedProject);

                /*
                 * ==================================================
                 * ATUALIZA UI
                 * ==================================================
                 */

                if (typeof renderScreenList === "function") {
                  renderScreenList();
                }

                if (typeof updateEmptyMessage === "function") {
                  updateEmptyMessage();
                }

                /*
                 * ==================================================
                 * ATUALIZA LISTA DE PROJETOS
                 * ==================================================
                 */

                if (typeof loadProjects === "function") {
                  try {
                    await loadProjects();
                  } catch (error) {
                    console.warn(
                      "Não foi possível atualizar a lista de projetos:",
                      error,
                    );
                  }
                }

                alert(`Projeto "${projectName}" importado com sucesso.`);

                console.log(
                  `OneFileBox: projeto "${projectName}" restaurado do JSON.`,
                );
              } catch (error) {
                console.error("OneFileBox: erro ao importar projeto:", error);

                alert(error?.message || "Não foi possível importar o projeto.");
              }
            },
            {
              once: true,
            },
          );

          /*
           * ==================================================
           * ABRE SELETOR
           * ==================================================
           */

          input.click();
        },

        /*
         * ==================================================
         * VALIDAR BACKUP
         * ==================================================
         */

        validateBackup(backup) {
          if (!backup || typeof backup !== "object" || Array.isArray(backup)) {
            throw new Error("O arquivo de projeto é inválido.");
          }

          if (backup.format !== "onefilebox-project") {
            throw new Error(
              "Este arquivo não é um backup válido do OneFileBox.",
            );
          }

          if (Number(backup.formatVersion) !== 1) {
            throw new Error(
              "A versão deste arquivo de projeto não é compatível.",
            );
          }

          if (
            !backup.project ||
            typeof backup.project !== "object" ||
            Array.isArray(backup.project)
          ) {
            throw new Error("O backup não contém um projeto válido.");
          }

          if (!Array.isArray(backup.project.screens)) {
            throw new Error("O backup não contém telas válidas.");
          }

          if (backup.data !== undefined && !Array.isArray(backup.data)) {
            throw new Error("Os dados do backup são inválidos.");
          }

          const projectName = String(backup.project.name || "").trim();

          if (!projectName) {
            throw new Error("O projeto importado não possui nome.");
          }

          return true;
        },

        /*
         * ==================================================
         * NOME DO ARQUIVO
         * ==================================================
         */

        createFileName(projectName) {
          let name = String(projectName || "projeto").trim();

          /*
           * Remove caracteres problemáticos
           * para nomes de arquivos.
           */

          name = name
            .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
            .replace(/\s+/g, "-");

          if (!name) {
            name = "projeto";
          }

          return `${name}.onefilebox.json`;
        },
      };

      /*
       * ==================================================
       * FUNÇÕES GLOBAIS
       * ==================================================
       *
       * Permitem que outros módulos da aplicação
       * chamem a funcionalidade sem depender diretamente
       * do objeto ProjectJSON.
       *
       * ==================================================
       */

      async function exportProjectJSON() {
        return ProjectJSON.export();
      }

      async function importProjectJSON() {
        return ProjectJSON.import();
      }
    </script>

    <script>
      /*
       * ==================================================
       * DATA_STORAGE:JS
       * ==================================================
       *
       * Responsável exclusivamente por:
       *
       * - salvar registros das tabelas
       * - listar registros
       * - listar tabelas
       * - validar nomes de tabelas
       *
       * ==================================================
       */

      const DataStorage = {
        /*
         * ==================================================
         * VALIDAR NOME DA TABELA
         * ==================================================
         */

        normalizeTableName(tableName) {
          tableName = String(tableName || "").trim();

          if (!tableName) {
            throw new Error("O nome da tabela é obrigatório.");
          }

          if (!/^[a-zA-Z0-9_-]+$/.test(tableName)) {
            throw new Error(
              "O nome da tabela pode conter somente letras, números, _ e -.",
            );
          }

          return tableName;
        },

        /*
         * ==================================================
         * SALVAR REGISTRO
         * ==================================================
         */

        async insert(tableName, values) {
          console.log("OneFileBox: iniciando salvamento no IndexedDB...");

          tableName = this.normalizeTableName(tableName);

          if (!values || typeof values !== "object" || Array.isArray(values)) {
            throw new Error("Os dados do registro são inválidos.");
          }

          const project = EditorState.currentProject;

          const projectName = project?.name || "";

          if (!projectName) {
            throw new Error("Nenhum projeto está carregado.");
          }

          console.log("OneFileBox: projeto:", projectName);

          console.log("OneFileBox: tabela:", tableName);

          console.log("OneFileBox: valores:", values);

          const database = await ProjectStorage.open();

          console.log("OneFileBox: IndexedDB aberto.");

          return new Promise((resolve, reject) => {
            let transaction;

            try {
              transaction = database.transaction(
                ProjectStorage.dataStoreName,
                "readwrite",
              );
            } catch (error) {
              database.close();

              reject(error);

              return;
            }

            const store = transaction.objectStore(ProjectStorage.dataStoreName);

            /*
             * ==================================================
             * REGISTRO
             * ==================================================
             */

            const record = {
              projectName,

              tableName,

              values: {
                ...values,
              },

              createdAt: new Date().toISOString(),
            };

            console.log(
              "OneFileBox: enviando registro para o IndexedDB:",
              record,
            );

            const request = store.add(record);

            /*
             * ==================================================
             * REQUEST ACEITO
             * ==================================================
             */

            request.onsuccess = () => {
              record.id = request.result;

              console.log(
                "OneFileBox: registro aceito pelo IndexedDB. ID:",
                record.id,
              );
            };

            /*
             * ==================================================
             * ERRO REQUEST
             * ==================================================
             */

            request.onerror = () => {
              console.error(
                "OneFileBox: erro no request do IndexedDB:",
                request.error,
              );

              reject(request.error);
            };

            /*
             * ==================================================
             * TRANSAÇÃO COMPLETA
             * ==================================================
             */

            transaction.oncomplete = () => {
              database.close();

              console.log(
                "OneFileBox: registro SALVO COM SUCESSO no IndexedDB:",
                record,
              );

              resolve(record);
            };

            /*
             * ==================================================
             * ERRO TRANSAÇÃO
             * ==================================================
             */

            transaction.onerror = () => {
              database.close();

              console.error(
                "OneFileBox: erro na transação do IndexedDB:",
                transaction.error,
              );

              reject(transaction.error);
            };

            /*
             * ==================================================
             * TRANSAÇÃO ABORTADA
             * ==================================================
             */

            transaction.onabort = () => {
              database.close();

              const error =
                transaction.error || new Error("Transação abortada.");

              console.error("OneFileBox: transação abortada:", error);

              reject(error);
            };
          });
        },

        /*
         * ==================================================
         * LISTAR REGISTROS DA TABELA
         * ==================================================
         */

        async list(tableName) {
          tableName = this.normalizeTableName(tableName);

          const project = EditorState.currentProject;

          const projectName = project?.name || "";

          if (!projectName) {
            return [];
          }

          const database = await ProjectStorage.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              ProjectStorage.dataStoreName,
              "readonly",
            );

            const store = transaction.objectStore(ProjectStorage.dataStoreName);

            const index = store.index("projectTable");

            const request = index.getAll([projectName, tableName]);

            request.onsuccess = () => {
              resolve(request.result || []);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * LISTAR TODAS AS TABELAS DO PROJETO
         * ==================================================
         */

        async listTables() {
          const project = EditorState.currentProject;

          const projectName = project?.name || "";

          if (!projectName) {
            return [];
          }

          const database = await ProjectStorage.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              ProjectStorage.dataStoreName,
              "readonly",
            );

            const store = transaction.objectStore(ProjectStorage.dataStoreName);

            const index = store.index("projectName");

            const request = index.getAll(projectName);

            request.onsuccess = () => {
              const records = request.result || [];

              const tables = [
                ...new Set(records.map((record) => record.tableName)),
              ];

              resolve(tables);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },
      };
    </script>

    <script>
      /*
       * ==================================================
       * UI - BOTÕES
       * ==================================================
       *
       * Responsável pelos botões e interações
       * gerais da interface do editor.
       *
       * NÃO contém:
       * - renderização do runtime
       * - navegação de produção
       * - armazenamento de projetos
       * - criação de telas
       */

      /*
       * ==================================================
       * BOTÃO TESTAR
       * ==================================================
       */

      function updateTestButton() {
        const button = document.getElementById("testProjectButton");

        if (!button) {
          return;
        }

        button.textContent = ENV.isProd() ? "Voltar ao editor" : "Testar";
      }

      /*
       * ==================================================
       * ALTERNAR MODO
       * ==================================================
       */

      async function toggleProjectMode() {
        const button = document.getElementById("testProjectButton");

        if (button) {
          button.disabled = true;
        }

        try {
          if (ENV.isDev()) {
            await enterProductionMode();
          } else {
            exitProductionMode();
          }

          updateTestButton();
        } catch (error) {
          console.error("Erro ao alternar modo do projeto:", error);
        } finally {
          if (button) {
            button.disabled = false;
          }
        }
      }

      /*
       * ==================================================
       * EVENTO DO BOTÃO TESTAR
       * ==================================================
       */

      const testProjectButton = document.getElementById("testProjectButton");

      if (testProjectButton) {
        testProjectButton.addEventListener("click", toggleProjectMode);
      }

      updateTestButton();

      /*
       * ==================================================
       * SALVAR DADOS DO BOTÃO
       * ==================================================
       *
       * Pega:
       *
       * - a tabela configurada no Properties
       * - os Inputs associados ao botão
       * - os valores digitados nesses Inputs
       *
       * E salva tudo no IndexedDB através de:
       *
       * DataStorage.insert()
       *
       * ==================================================
       */

      async function saveButtonData(component) {
        if (!component) {
          return;
        }

        /*
         * ==================================================
         * TABELA
         * ==================================================
         *
         * A tabela é definida no Properties
         * e armazenada no:
         *
         * component.dataset.table
         */

        const tableName = String(component.dataset.table || "").trim();

        if (!tableName) {
          alert("Informe o nome da tabela nas propriedades do botão.");

          return;
        }

        /*
         * ==================================================
         * INPUTS ASSOCIADOS
         * ==================================================
         */

        let inputIds = [];

        try {
          inputIds = JSON.parse(component.dataset.inputs || "[]");
        } catch {
          inputIds = [];
        }

        /*
         * ==================================================
         * COLETAR VALORES
         * ==================================================
         */

        const values = {};

        inputIds.forEach((id) => {
          const inputComponent = DOM.grid.querySelector(
            `.canvas-component[data-id="${CSS.escape(id)}"]`,
          );

          if (!inputComponent) {
            return;
          }

          const input = inputComponent.querySelector("input");

          if (!input) {
            return;
          }

          const label = inputComponent.dataset.label || id;

          values[label] = input.value;
        });

        /*
         * ==================================================
         * DEBUG
         * ==================================================
         */

        console.log("OneFileBox: tabela:", tableName);

        console.log("OneFileBox: valores:", values);

        /*
         * ==================================================
         * SALVAR NO INDEXEDDB
         * ==================================================
         */

        if (
          typeof DataStorage === "undefined" ||
          typeof DataStorage.insert !== "function"
        ) {
          console.error(
            "OneFileBox: DataStorage.insert() não está disponível.",
          );

          alert("O armazenamento de dados não está disponível.");

          return;
        }

        try {
          const record = await DataStorage.insert(tableName, values);

          console.log("OneFileBox: dados do botão salvos com sucesso:", record);
        } catch (error) {
          console.error("OneFileBox: erro ao salvar dados do botão:", error);

          alert(
            `Não foi possível salvar os dados na tabela "${tableName}".\n\n${error.message || error}`,
          );
        }
      }

      /*
       * ==================================================
       * CLIQUE NOS BOTÕES DO EDITOR
       * ==================================================
       *
       * Aqui tratamos somente o comportamento
       * do botão enquanto estamos no editor.
       *
       * O comportamento de produção pertence
       * ao RUNTIME:EVENTS:JS.
       */

      if (DOM.grid) {
        DOM.grid.addEventListener("click", async (event) => {
          if (ENV.isProd()) {
            return;
          }

          const button = event.target.closest(
            '.canvas-component[data-component="button"] button',
          );

          if (!button) {
            return;
          }

          const component = button.closest(".canvas-component");

          if (!component) {
            return;
          }

          /*
           * Botões configurados para navegação
           * não são processados aqui.
           */

          const action =
            component.dataset.action || component.dataset.actionType || "none";

          if (action === "navigate") {
            return;
          }

          /*
           * ==================================================
           * SALVAR DADOS
           * ==================================================
           */

          await saveButtonData(component);
        });
      }
    </script>

    <script>
      /*
       * ==================================================
       * UI - PROJETOS
       * ==================================================
       *
       * Responsável exclusivamente por:
       *
       * - salvar projetos
       * - listar projetos
       * - carregar projetos
       * - trocar projeto pelo select
       * - manter o último projeto aberto
       *
       * NÃO contém:
       * - runtime
       * - criação de telas
       * - renderização de componentes
       * - lógica de drag and drop
       */

      /*
       * ==================================================
       * ÚLTIMO PROJETO ABERTO
       * ==================================================
       */

      const LAST_PROJECT_STORAGE_KEY = "OneFileBox:lastProject";

      function saveLastOpenedProject(name) {
        name = String(name || "").trim();

        if (!name) {
          return;
        }

        try {
          localStorage.setItem(LAST_PROJECT_STORAGE_KEY, name);
        } catch (error) {
          console.warn(
            "OneFileBox: não foi possível salvar o último projeto.",
            error,
          );
        }
      }

      function getLastOpenedProject() {
        try {
          return localStorage.getItem(LAST_PROJECT_STORAGE_KEY);
        } catch (error) {
          console.warn(
            "OneFileBox: não foi possível recuperar o último projeto.",
            error,
          );

          return null;
        }
      }

      /*
       * ==================================================
       * SALVAR PROJETO
       * ==================================================
       */

      async function saveProject() {
        if (ENV.isProd()) {
          return;
        }

        const currentName = EditorState.currentProject?.name || "";

        const name = prompt("Nome do projeto:", currentName);

        if (name === null) {
          return;
        }

        const projectName = name.trim();

        if (!projectName) {
          alert("Informe um nome para o projeto.");

          return;
        }

        try {
          /*
           * O Storage decide se deve criar
           * ou substituir o projeto.
           */

          const project = await ProjectStorage.save(projectName);

          EditorState.currentProject = project;

          /*
           * ==================================================
           * SALVA COMO ÚLTIMO PROJETO ABERTO
           * ==================================================
           */

          saveLastOpenedProject(projectName);

          /*
           * Recarrega a lista.
           */

          await loadProjects();

          /*
           * Mantém o projeto salvo selecionado.
           */

          if (DOM.projectList) {
            DOM.projectList.value = projectName;
          }

          /*
           * Atualiza as telas.
           */

          if (typeof renderScreenList === "function") {
            renderScreenList();
          }

          if (typeof renderCurrentScreen === "function") {
            renderCurrentScreen();
          }

          /*
           * Atualiza mensagem do canvas.
           */

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }

          alert(`Projeto "${projectName}" salvo com sucesso.`);
        } catch (error) {
          alert("Erro ao salvar:\n\n" + error.name + "\n\n" + error.message);
        }
      }

      /*
       * ==================================================
       * LISTAR PROJETOS
       * ==================================================
       */

      async function loadProjects() {
        if (ENV.isProd()) {
          return;
        }

        try {
          const projects = await ProjectStorage.list();

          /*
           * Ordena alfabeticamente.
           */

          projects.sort((a, b) => {
            return a.name.localeCompare(b.name);
          });

          if (!DOM.projectList) {
            return;
          }

          DOM.projectList.replaceChildren();

          /*
           * ==================================================
           * NENHUM PROJETO
           * ==================================================
           */

          if (!projects.length) {
            const option = document.createElement("option");

            option.value = "";

            option.textContent = "Nenhum projeto salvo";

            DOM.projectList.appendChild(option);

            EditorState.currentProject = null;

            EditorState.currentScreen = null;

            EditorState.currentScreenId = null;

            if (typeof renderScreenList === "function") {
              renderScreenList();
            }

            if (typeof renderCurrentScreen === "function") {
              renderCurrentScreen();
            }

            if (typeof updateEmptyMessage === "function") {
              updateEmptyMessage();
            }

            return;
          }

          /*
           * ==================================================
           * CRIAR OPTIONS
           * ==================================================
           */

          projects.forEach((project) => {
            const option = document.createElement("option");

            option.value = project.name;

            option.textContent = project.name;

            DOM.projectList.appendChild(option);
          });

          /*
           * ==================================================
           * DETERMINAR PROJETO A ABRIR
           * ==================================================
           *
           * Prioridade:
           *
           * 1. Projeto que já está aberto
           * 2. Último projeto salvo
           * 3. Primeiro da lista
           *
           * Isso é importante principalmente no
           * primeiro carregamento após F5.
           */

          let projectToOpen = null;

          /*
           * --------------------------------------------------
           * 1. PROJETO ATUAL
           * --------------------------------------------------
           */

          if (EditorState.currentProject?.name) {
            projectToOpen =
              projects.find((project) => {
                return project.name === EditorState.currentProject.name;
              }) || null;
          }

          /*
           * --------------------------------------------------
           * 2. ÚLTIMO PROJETO ABERTO
           * --------------------------------------------------
           */

          if (!projectToOpen) {
            const lastProjectName = getLastOpenedProject();

            if (lastProjectName) {
              projectToOpen =
                projects.find((project) => {
                  return project.name === lastProjectName;
                }) || null;
            }
          }

          /*
           * --------------------------------------------------
           * 3. PRIMEIRO PROJETO
           * --------------------------------------------------
           */

          if (!projectToOpen) {
            projectToOpen = projects[0];
          }

          /*
           * Define no dropdown.
           */

          DOM.projectList.value = projectToOpen.name;

          /*
           * ==================================================
           * VERIFICA SE PRECISA CARREGAR
           * ==================================================
           *
           * Se o projeto já está carregado, não precisamos
           * recarregá-lo.
           *
           * Porém, precisamos garantir que a última tela
           * seja restaurada.
           */

          if (EditorState.currentProject?.name === projectToOpen.name) {
            saveLastOpenedProject(projectToOpen.name);

            if (typeof loadCurrentScreen === "function") {
              loadCurrentScreen();
            }

            return;
          }

          /*
           * Carrega o projeto selecionado.
           */

          await loadSelectedProject();
        } catch (error) {
          console.error("Erro ao carregar projetos:", error);

          if (!DOM.projectList) {
            return;
          }

          DOM.projectList.replaceChildren();

          const option = document.createElement("option");

          option.value = "";

          option.textContent = "Erro ao carregar projetos";

          DOM.projectList.appendChild(option);

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }
        }
      }

      /*
       * ==================================================
       * CARREGAR PROJETO SELECIONADO
       * ==================================================
       */

      async function loadSelectedProject() {
        if (ENV.isProd()) {
          return;
        }

        if (!DOM.projectList) {
          return;
        }

        const name = DOM.projectList.value;

        if (!name) {
          return;
        }

        try {
          const project = await ProjectStorage.load(name);

          if (!project) {
            alert("Projeto não encontrado.");

            await loadProjects();

            return;
          }

          /*
           * ==================================================
           * SALVA ÚLTIMO PROJETO
           * ==================================================
           *
           * Isso acontece tanto quando o usuário troca
           * pelo dropdown quanto quando o projeto é aberto
           * automaticamente após F5.
           */

          saveLastOpenedProject(project.name);

          /*
           * ==================================================
           * RESTAURAR PROJETO
           * ==================================================
           */

          ProjectStorage.loadProject(project);

          EditorState.currentProject = project;

          /*
           * ==================================================
           * RESTAURAR ÚLTIMA TELA
           * ==================================================
           *
           * IMPORTANTE:
           *
           * O STORAGE pode ter carregado inicialmente
           * a primeira tela.
           *
           * Aqui chamamos explicitamente o
           * loadCurrentScreen() do SCREENS:JS.
           *
           * Ele verifica:
           *
           * 1. currentScreenId
           * 2. última tela salva
           * 3. primeira tela
           */

          if (typeof loadCurrentScreen === "function") {
            loadCurrentScreen();
          } else {
            console.warn(
              "OneFileBox: loadCurrentScreen() não está disponível.",
            );

            if (typeof renderScreenList === "function") {
              renderScreenList();
            }

            if (typeof renderCurrentScreen === "function") {
              renderCurrentScreen();
            }
          }

          /*
           * ==================================================
           * GARANTE QUE O DROPDOWN CONTINUE NO PROJETO
           * ==================================================
           */

          if (DOM.projectList) {
            DOM.projectList.value = project.name;
          }

          /*
           * Atualiza mensagem de canvas vazio.
           */

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }

          console.log(`Projeto "${name}" carregado.`);
        } catch (error) {
          console.error("Erro ao carregar projeto:", error);

          alert("Não foi possível carregar o projeto.");
        }
      }

      /*
       * ==================================================
       * TROCA DE PROJETO
       * ==================================================
       */

      if (DOM.projectList) {
        DOM.projectList.addEventListener("change", loadSelectedProject);
      }
    </script>
