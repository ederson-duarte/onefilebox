    <script>
      /*
       * ==================================================
       * UI - PROJETOS
       * ==================================================
       *
       * Responsável exclusivamente por:
       *
       * - salvar projetos
       * - listar projetos
       * - carregar projetos
       * - trocar projeto pelo select
       * - manter o último projeto aberto
       *
       * NÃO contém:
       * - runtime
       * - criação de telas
       * - renderização de componentes
       * - lógica de drag and drop
       */

      /*
       * ==================================================
       * ÚLTIMO PROJETO ABERTO
       * ==================================================
       */

      const LAST_PROJECT_STORAGE_KEY = "OneFileBox:lastProject";

      function saveLastOpenedProject(name) {
        name = String(name || "").trim();

        if (!name) {
          return;
        }

        try {
          localStorage.setItem(LAST_PROJECT_STORAGE_KEY, name);
        } catch (error) {
          console.warn(
            "OneFileBox: não foi possível salvar o último projeto.",
            error,
          );
        }
      }

      function getLastOpenedProject() {
        try {
          return localStorage.getItem(LAST_PROJECT_STORAGE_KEY);
        } catch (error) {
          console.warn(
            "OneFileBox: não foi possível recuperar o último projeto.",
            error,
          );

          return null;
        }
      }

      /*
       * ==================================================
       * SALVAR PROJETO
       * ==================================================
       */

      async function saveProject() {
        if (ENV.isProd()) {
          return;
        }

        const currentName = EditorState.currentProject?.name || "";

        const name = prompt("Nome do projeto:", currentName);

        if (name === null) {
          return;
        }

        const projectName = name.trim();

        if (!projectName) {
          alert("Informe um nome para o projeto.");

          return;
        }

        try {
          /*
           * O Storage decide se deve criar
           * ou substituir o projeto.
           */

          const project = await ProjectStorage.save(projectName);

          EditorState.currentProject = project;

          /*
           * ==================================================
           * SALVA COMO ÚLTIMO PROJETO ABERTO
           * ==================================================
           */

          saveLastOpenedProject(projectName);

          /*
           * Recarrega a lista.
           */

          await loadProjects();

          /*
           * Mantém o projeto salvo selecionado.
           */

          if (DOM.projectList) {
            DOM.projectList.value = projectName;
          }

          /*
           * Atualiza as telas.
           */

          if (typeof renderScreenList === "function") {
            renderScreenList();
          }

          if (typeof renderCurrentScreen === "function") {
            renderCurrentScreen();
          }

          /*
           * Atualiza mensagem do canvas.
           */

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }

          alert(`Projeto "${projectName}" salvo com sucesso.`);
        } catch (error) {
          console.error("Erro ao salvar projeto:", error);

          alert("Não foi possível salvar o projeto.");
        }
      }

      /*
       * ==================================================
       * LISTAR PROJETOS
       * ==================================================
       */

      async function loadProjects() {
        if (ENV.isProd()) {
          return;
        }

        try {
          const projects = await ProjectStorage.list();

          /*
           * Ordena alfabeticamente.
           */

          projects.sort((a, b) => {
            return a.name.localeCompare(b.name);
          });

          if (!DOM.projectList) {
            return;
          }

          DOM.projectList.replaceChildren();

          /*
           * ==================================================
           * NENHUM PROJETO
           * ==================================================
           */

          if (!projects.length) {
            const option = document.createElement("option");

            option.value = "";

            option.textContent = "Nenhum projeto salvo";

            DOM.projectList.appendChild(option);

            EditorState.currentProject = null;

            EditorState.currentScreen = null;

            EditorState.currentScreenId = null;

            if (typeof renderScreenList === "function") {
              renderScreenList();
            }

            if (typeof renderCurrentScreen === "function") {
              renderCurrentScreen();
            }

            if (typeof updateEmptyMessage === "function") {
              updateEmptyMessage();
            }

            return;
          }

          /*
           * ==================================================
           * CRIAR OPTIONS
           * ==================================================
           */

          projects.forEach((project) => {
            const option = document.createElement("option");

            option.value = project.name;

            option.textContent = project.name;

            DOM.projectList.appendChild(option);
          });

          /*
           * ==================================================
           * DETERMINAR PROJETO A ABRIR
           * ==================================================
           *
           * Prioridade:
           *
           * 1. Projeto que já está aberto
           * 2. Último projeto salvo
           * 3. Primeiro da lista
           *
           * Isso é importante principalmente no
           * primeiro carregamento após F5.
           */

          let projectToOpen = null;

          /*
           * --------------------------------------------------
           * 1. PROJETO ATUAL
           * --------------------------------------------------
           */

          if (EditorState.currentProject?.name) {
            projectToOpen =
              projects.find((project) => {
                return project.name === EditorState.currentProject.name;
              }) || null;
          }

          /*
           * --------------------------------------------------
           * 2. ÚLTIMO PROJETO ABERTO
           * --------------------------------------------------
           */

          if (!projectToOpen) {
            const lastProjectName = getLastOpenedProject();

            if (lastProjectName) {
              projectToOpen =
                projects.find((project) => {
                  return project.name === lastProjectName;
                }) || null;
            }
          }

          /*
           * --------------------------------------------------
           * 3. PRIMEIRO PROJETO
           * --------------------------------------------------
           */

          if (!projectToOpen) {
            projectToOpen = projects[0];
          }

          /*
           * Define no dropdown.
           */

          DOM.projectList.value = projectToOpen.name;

          /*
           * ==================================================
           * VERIFICA SE PRECISA CARREGAR
           * ==================================================
           *
           * Se o projeto já está carregado, não precisamos
           * recarregá-lo.
           *
           * Porém, precisamos garantir que a última tela
           * seja restaurada.
           */

          if (EditorState.currentProject?.name === projectToOpen.name) {
            saveLastOpenedProject(projectToOpen.name);

            if (typeof loadCurrentScreen === "function") {
              loadCurrentScreen();
            }

            return;
          }

          /*
           * Carrega o projeto selecionado.
           */

          await loadSelectedProject();
        } catch (error) {
          console.error("Erro ao carregar projetos:", error);

          if (!DOM.projectList) {
            return;
          }

          DOM.projectList.replaceChildren();

          const option = document.createElement("option");

          option.value = "";

          option.textContent = "Erro ao carregar projetos";

          DOM.projectList.appendChild(option);

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }
        }
      }

      /*
       * ==================================================
       * CARREGAR PROJETO SELECIONADO
       * ==================================================
       */

      async function loadSelectedProject() {
        if (ENV.isProd()) {
          return;
        }

        if (!DOM.projectList) {
          return;
        }

        const name = DOM.projectList.value;

        if (!name) {
          return;
        }

        try {
          const project = await ProjectStorage.load(name);

          if (!project) {
            alert("Projeto não encontrado.");

            await loadProjects();

            return;
          }

          /*
           * ==================================================
           * SALVA ÚLTIMO PROJETO
           * ==================================================
           *
           * Isso acontece tanto quando o usuário troca
           * pelo dropdown quanto quando o projeto é aberto
           * automaticamente após F5.
           */

          saveLastOpenedProject(project.name);

          /*
           * ==================================================
           * RESTAURAR PROJETO
           * ==================================================
           */

          ProjectStorage.loadProject(project);

          EditorState.currentProject = project;

          /*
           * ==================================================
           * RESTAURAR ÚLTIMA TELA
           * ==================================================
           *
           * IMPORTANTE:
           *
           * O STORAGE pode ter carregado inicialmente
           * a primeira tela.
           *
           * Aqui chamamos explicitamente o
           * loadCurrentScreen() do SCREENS:JS.
           *
           * Ele verifica:
           *
           * 1. currentScreenId
           * 2. última tela salva
           * 3. primeira tela
           */

          if (typeof loadCurrentScreen === "function") {
            loadCurrentScreen();
          } else {
            console.warn(
              "OneFileBox: loadCurrentScreen() não está disponível.",
            );

            if (typeof renderScreenList === "function") {
              renderScreenList();
            }

            if (typeof renderCurrentScreen === "function") {
              renderCurrentScreen();
            }
          }

          /*
           * ==================================================
           * GARANTE QUE O DROPDOWN CONTINUE NO PROJETO
           * ==================================================
           */

          if (DOM.projectList) {
            DOM.projectList.value = project.name;
          }

          /*
           * Atualiza mensagem de canvas vazio.
           */

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }

          console.log(`Projeto "${name}" carregado.`);
        } catch (error) {
          console.error("Erro ao carregar projeto:", error);

          alert("Não foi possível carregar o projeto.");
        }
      }

      /*
       * ==================================================
       * TROCA DE PROJETO
       * ==================================================
       */

      if (DOM.projectList) {
        DOM.projectList.addEventListener("change", loadSelectedProject);
      }
    </script>

    <script>
      /*
       * ==================================================
       * UI DO EDITOR
       * ==================================================
       *
       * Este módulo é somente o ponto de
       * inicialização da interface.
       *
       * A lógica foi dividida em:
       *
       * - UI:EMPTY:JS
       * - UI:BUTTONS:JS
       * - UI:PROJECTS:JS
       *
       * NÃO colocar lógica específica aqui.
       *
       * ==================================================
       */

      function initializeEditorUI() {
        /*
         * Atualiza o estado visual inicial

        if (typeof updateEmptyMessage === "function") {

        /*
         * O carregamento dos projetos é feito

        if (typeof loadProjects === "function") {

        /*

        if (typeof updateTestButton === "function") {
          updateTestButton();
        }
      }

      /*
       * ==================================================
       * INICIALIZAÇÃO
       * ==================================================
       */

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initializeEditorUI, {
          once: true,
        });
      } else {
        initializeEditorUI();
      }

    <script>
      /*
       * ==================================================
       * RUNTIME_CORE:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - elementos do runtime
       * - snapshot do projeto
       * - entrar em produção
       * - sair de produção
       * - alternar entre Dev e Runtime
       * - atalho F1
       * - visibilidade do editor
       *
       * NÃO possui:
       * - renderização de componentes
       * - navegação entre telas
       * - eventos de componentes
       * - inicialização automática
       *
       * ==================================================
       */

      /*
       * ==================================================
       * ELEMENTOS
       * ==================================================
       */

      function getProductionApp() {
        return document.getElementById("productionApp");
      }

      function getProductionGrid() {
        return document.getElementById("productionGrid");
      }

      /*
       * ==================================================
       * SNAPSHOT
       * ==================================================
       */

      function createProductionProjectSnapshot() {
        if (!DOM.grid) {
          return null;
        }

        const name =
          EditorState.currentProject?.name ||
          DOM.projectList?.value ||
          "Projeto";

        /*
         * ProjectStorage.createProject()
         * deve retornar uma cópia independente
         * do projeto atual.
         */
        return ProjectStorage.createProject(name);
      }

      /*
       * ==================================================
       * ENTRAR EM PRODUÇÃO
       * ==================================================
       */

      async function enterProductionMode() {
        if (ENV.isProd()) {
          return;
        }

        const productionApp = getProductionApp();

        const productionGrid = getProductionGrid();

        if (!productionApp || !productionGrid) {
          console.error(
            "OneFileBox: elementos do modo produção não encontrados.",
          );

          return;
        }

        /*
         * Cria o snapshot antes de esconder
         * o editor.
         */
        const snapshot = createProductionProjectSnapshot();

        if (!snapshot) {
          console.warn(
            "OneFileBox: não foi possível criar o snapshot do projeto.",
          );

          return;
        }

        EditorState.productionProject = snapshot;

        /*
         * Cancela qualquer drag ativo.
         */
        if (typeof cancelDrag === "function") {
          cancelDrag();
        }

        /*
         * Remove seleção do editor.
         */
        EditorState.selected = null;

        /*
         * Guarda a tela que estava aberta.
         */
        const startScreenId =
          EditorState.currentScreen?.id || EditorState.currentScreenId || null;

        /*
         * Troca para produção.
         */
        ENV.setMode("prod");

        /*
         * Esconde o editor.
         */
        setEditorVisibility(false);

        /*
         * Renderiza a mesma tela que estava
         * aberta no editor.
         */
        renderProductionProject(productionGrid, snapshot, startScreenId);

        /*
         * Mostra o runtime.
         */
        productionApp.style.display = "block";

        /*
         * Atualiza o texto do botão Testar.
         *
         * Quando a entrada foi feita pelo F1,
         * o clique do botão não passou pelo
         * UI:BUTTONS:JS, portanto precisamos
         * atualizar manualmente a interface.
         */
        if (typeof updateTestButton === "function") {
          updateTestButton();
        }
      }

      /*
       * ==================================================
       * SAIR DE PRODUÇÃO
       * ==================================================
       */

      function exitProductionMode() {
        if (ENV.isDev()) {
          return;
        }

        const productionApp = getProductionApp();

        if (productionApp) {
          productionApp.style.display = "none";
        }

        /*
         * Volta para desenvolvimento.
         */
        ENV.setMode("dev");

        /*
         * Mostra novamente o editor.
         */
        setEditorVisibility(true);

        /*
         * Restaura o snapshot.
         */
        if (EditorState.productionProject && DOM.grid) {
          const project = EditorState.productionProject;

          ProjectStorage.loadProject(project);

          EditorState.currentProject = project;

          /*
           * Descobre qual tela estava aberta
           * no runtime.
           */
          if (Array.isArray(project.screens)) {
            const screenId = DOM.grid.dataset.screenId;

            const screen = project.screens.find((item) => item.id === screenId);

            if (screen) {
              EditorState.currentScreen = screen;

              EditorState.currentScreenId = screen.id;
            }
          }

          /*
           * Atualiza lista de telas.
           */
          if (typeof renderScreenList === "function") {
            renderScreenList();
          }

          /*
           * Atualiza canvas.
           */
          if (typeof renderCurrentScreen === "function") {
            renderCurrentScreen();
          }

          /*
           * Atualiza mensagem de canvas vazio.
           */
          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }
        }

        EditorState.productionProject = null;

        /*
         * Atualiza o texto do botão Testar.
         *
         * Necessário principalmente quando a saída
         * do runtime acontece através da tecla F1.
         */
        if (typeof updateTestButton === "function") {
          updateTestButton();
        }
      }

      /*
       * ==================================================
       * ALTERNAR MODO
       * ==================================================
       *
       * Dev
       *  ↓
       * Prod
       *
       * Prod
       *  ↓
       * Dev
       *
       * Esta é a função central usada pelo F1.
       *
       * ==================================================
       */

      async function toggleRuntimeMode() {
        if (ENV.isDev()) {
          await enterProductionMode();

          return;
        }

        exitProductionMode();
      }

      /*
       * ==================================================
       * ATALHO F1
       * ==================================================
       *
       * F1 alterna entre:
       *
       * - Dev Mode
       * - Runtime/Prod Mode
       *
       * preventDefault() impede o navegador de
       * executar sua ação padrão para a tecla F1.
       *
       * ==================================================
       */

      document.addEventListener("keydown", async (event) => {
        if (event.key !== "F1") {
          return;
        }

        event.preventDefault();

        /*
         * Evita iniciar outra transição enquanto
         * uma entrada no runtime ainda estiver
         * sendo processada.
         */
        if (event.repeat) {
          return;
        }

        await toggleRuntimeMode();
      });

      /*
       * ==================================================
       * VISIBILIDADE DO EDITOR
       * ==================================================
       */

      function setEditorVisibility(visible) {
        const selectors = [
          ".components-panel",
          ".properties",
          "#componentsPanel",
          "#properties",
        ];

        selectors.forEach((selector) => {
          document.querySelectorAll(selector).forEach((element) => {
            element.style.display = visible ? "" : "none";
          });
        });
      }
    </script>

    <script>
      /*
       * ==================================================
       * RESPONSIVIDADE DA JANELA
       * ==================================================
       *
       * A grid principal continua sempre utilizando
       * as 12 colunas originais.
       *
       * A responsividade altera somente a quantidade
       * de colunas ocupadas pelos PANELS.
       *
       * O Panel também é centralizado automaticamente
       * quando sua largura muda.
       *
       * Exemplo de um Panel configurado com 4 colunas:
       *
       * > 860px  = 4 colunas
       * <= 860px = 5 colunas
       * <= 760px = 6 colunas
       * <= 660px = 8 colunas
       * <= 560px = 10 colunas
       * <= 460px = 12 colunas
       *
       * ==================================================
       */

      window.addEventListener("resize", () => {
        const grid = document.querySelector("#productionApp .production-grid");

        if (!grid) {
          return;
        }

        updateAllProductionPanels(grid);
      });

      /*
       * ==================================================
       * RUNTIME_RENDER:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - criar componentes de produção
       * - renderizar uma tela
       * - renderizar componentes
       * - renderizar filhos de Panels
       * - dimensionar Panels
       * - adaptar Panels à largura da tela
       * - centralizar Panels responsivos
       *
       * ==================================================
       */

      /*
       * ==================================================
       * RESPONSIVIDADE DO PANEL
       * ==================================================
       *
       * O valor original salvo pelo editor continua
       * armazenado em:
       *
       * panel.dataset.columns
       *
       * A responsividade altera apenas o valor visual
       * aplicado através de gridColumn.
       *
       * O Panel é sempre centralizado quando estiver
       * sendo redimensionado pelo runtime.
       *
       * ==================================================
       */

      function updateProductionPanelResponsiveColumns(panel) {
        if (!panel) {
          return;
        }

        if (panel.dataset.component !== "panel") {
          return;
        }

        /*
         * ==================================================
         * CONFIGURAÇÃO ORIGINAL
         * ==================================================
         *
         * O valor original continua preservado.
         *
         * ==================================================
         */

        const originalColumns = Number(panel.dataset.columns) || 1;

        /*
         * ==================================================
         * LARGURA ATUAL DA JANELA
         * ==================================================
         */

        const width = window.innerWidth;

        /*
         * ==================================================
         * COLUNAS VISUAIS
         * ==================================================
         *
         * Inicialmente usamos exatamente a quantidade
         * configurada pelo usuário.
         *
         * ==================================================
         */

        let columns = originalColumns;

        /*
         * ==================================================
         * ACIMA DE 860PX
         * ==================================================
         *
         * Mantém exatamente o tamanho configurado
         * no editor.
         *
         * Exemplo:
         *
         * Panel = 4 colunas
         *
         * ==================================================
         */

        if (width > 860) {
          columns = originalColumns;
        } else if (width <= 860 && width > 760) {

        /*
         * ==================================================
         * 860PX ATÉ 761PX
         * ==================================================
         *
         * Panel de 4 passa para 5.
         *
         * ==================================================
         */
          columns = Math.max(originalColumns, 5);
        } else if (width <= 760 && width > 660) {

        /*
         * ==================================================
         * 760PX ATÉ 661PX
         * ==================================================
         *
         * Panel de 4 passa para 6.
         *
         * ==================================================
         */
          columns = Math.max(originalColumns, 6);
        } else if (width <= 660 && width > 560) {

        /*
         * ==================================================
         * 660PX ATÉ 561PX
         * ==================================================
         *
         * Panel de 4 passa para 8.
         *
         * ==================================================
         */
          columns = Math.max(originalColumns, 8);
        } else if (width <= 560 && width > 460) {

        /*
         * ==================================================
         * 560PX ATÉ 461PX
         * ==================================================
         *
         * Panel de 4 passa para 10.
         *
         * ==================================================
         */
          columns = Math.max(originalColumns, 10);
        } else {

        /*
         * ==================================================
         * 460PX OU MENOS
         * ==================================================
         *
         * Panel ocupa todas as 12 colunas.
         *
         * ==================================================
         */
          columns = 12;
        }

        /*
         * ==================================================
         * LIMITE MÁXIMO
         * ==================================================
         *
         * A grid principal possui 12 colunas.
         *
         * ==================================================
         */

        columns = Math.min(columns, 12);

        /*
         * ==================================================
         * CENTRALIZAR PANEL
         * ==================================================
         *
         * A grid possui 12 colunas.
         *
         * Calculamos automaticamente quantas colunas
         * sobram nas laterais.
         *
         * Exemplos:
         *
         * 4 colunas:
         *
         * (12 - 4) / 2 = 4
         *
         * coluna inicial = 5
         *
         *
         * 6 colunas:
         *
         * (12 - 6) / 2 = 3
         *
         * coluna inicial = 4
         *
         *
         * 8 colunas:
         *
         * (12 - 8) / 2 = 2
         *
         * coluna inicial = 3
         *
         *
         * 10 colunas:
         *
         * (12 - 10) / 2 = 1
         *
         * coluna inicial = 2
         *
         *
         * 12 colunas:
         *
         * (12 - 12) / 2 = 0
         *
         * coluna inicial = 1
         *
         * ==================================================
         */

        const safeColumn = Math.floor((12 - columns) / 2) + 1;

        /*
         * ==================================================
         * APLICAR GRID
         * ==================================================
         */

        panel.style.gridColumn = `${safeColumn} / span ${columns}`;

        /*
         * ==================================================
         * ARMAZENAR VALORES DE RUNTIME
         * ==================================================
         *
         * Não alteramos data.columns.
         *
         * data.columns continua representando
         * a configuração original salva pelo editor.
         *
         * ==================================================
         */

        panel.dataset.productionColumns = columns;

        panel.dataset.productionColumn = safeColumn;
      }

      /*
       * ==================================================
       * DIMENSIONAR PAINEL
       * ==================================================
       */

      function updateProductionPanelSize(panel) {
        if (!panel) {
          return;
        }

        if (panel.dataset.component !== "panel") {
          return;
        }

        const content = panel.querySelector(":scope > .panel-content");

        if (!content) {
          return;
        }

        /*
         * ==================================================
         * RESET
         * ==================================================
         *
         * Permite que o browser recalcule
         * a altura naturalmente.
         *
         * ==================================================
         */

        content.style.height = "auto";

        /*
         * ==================================================
         * FORÇAR RECÁLCULO DO LAYOUT
         * ==================================================
         *
         * O scrollHeight força o browser a recalcular
         * o tamanho interno depois que o Panel muda
         * de largura.
         *
         * ==================================================
         */

        const contentHeight = Math.max(120, content.scrollHeight);

        /*
         * ==================================================
         * APLICAR ALTURA
         * ==================================================
         */

        content.style.height = `${contentHeight}px`;

        /*
         * ==================================================
         * ATUALIZAR GRID PRINCIPAL
         * ==================================================
         */

        updateProductionPanelGridSpan(panel);
      }

      /*
       * ==================================================
       * RESERVAR LINHAS NO GRID PRINCIPAL
       * ==================================================
       */

      function updateProductionPanelGridSpan(panel) {
        if (!panel) {
          return;
        }

        if (panel.dataset.component !== "panel") {
          return;
        }

        /*
         * ==================================================
         * GRID PRINCIPAL
         * ==================================================
         */

        const grid = panel.parentElement;

        if (!grid || !grid.classList.contains("production-grid")) {
          return;
        }

        /*
         * ==================================================
         * MEDIR ALTURA REAL
         * ==================================================
         */

        const panelHeight = panel.getBoundingClientRect().height;

        /*
         * ==================================================
         * ESTILOS DO GRID
         * ==================================================
         */

        const gridStyles = getComputedStyle(grid);

        /*
         * ==================================================
         * ESPAÇO ENTRE LINHAS
         * ==================================================
         */

        const rowGap = parseFloat(gridStyles.rowGap) || 12;

        /*
         * ==================================================
         * ALTURA DA LINHA
         * ==================================================
         *
         * O Grid principal utiliza:
         *
         * grid-auto-rows:
         * minmax(90px, max-content)
         *
         * ==================================================
         */

        const rowHeight = 90;

        /*
         * ==================================================
         * CALCULAR QUANTAS LINHAS
         * ==================================================
         */

        let rows = 1;

        while (rows * rowHeight + (rows - 1) * rowGap < panelHeight) {
          rows++;

          /*
           * ==================================================
           * PROTEÇÃO
           * ==================================================
           */

          if (rows > 100) {
            break;
          }
        }

        /*
         * ==================================================
         * APLICAR
         * ==================================================
         */

        panel.style.gridRow = `${panel.dataset.row} / span ${rows}`;

        panel.dataset.productionRows = rows;
      }

      /*
       * ==================================================
       * ATUALIZAR TODOS OS PANELS
       * ==================================================
       */

      function updateAllProductionPanels(grid) {
        if (!grid) {
          return;
        }

        /*
         * ==================================================
         * BUSCAR PANELS
         * ==================================================
         *
         * Apenas Panels diretamente dentro da
         * production-grid.
         *
         * ==================================================
         */

        const panels = grid.querySelectorAll(
          ':scope > .production-component[data-component="panel"]',
        );

        /*
         * ==================================================
         * ATUALIZAR CADA PANEL
         * ==================================================
         */

        panels.forEach((panel) => {
          /*
           * Primeiro ajustamos a largura
           * e centralizamos.
           */

          updateProductionPanelResponsiveColumns(panel);

          /*
           * Depois recalculamos a altura.
           */

          updateProductionPanelSize(panel);
        });
      }

      /*
       * ==================================================
       * CRIAR COMPONENTE DE PRODUÇÃO
       * ==================================================
       */

      function createProductionComponent(data) {
        if (!data || !data.type) {
          return null;
        }

        /*
         * ==================================================
         * ELEMENTO
         * ==================================================
         */

        const element = document.createElement("div");

        element.className = "canvas-component production-component";

        /*
         * ==================================================
         * TIPO
         * ==================================================
         */

        element.dataset.component = data.type;

        /*
         * ==================================================
         * ID
         * ==================================================
         */

        element.dataset.id = data.id || "";

        /*
         * ==================================================
         * GRID
         * ==================================================
         *
         * Esses são os valores originais salvos
         * pelo editor.
         *
         * ==================================================
         */

        element.dataset.row = Number(data.row) || 1;

        element.dataset.column = Number(data.column) || 1;

        element.dataset.columns = Number(data.columns) || 1;

        /*
         * ==================================================
         * PROPRIEDADES
         * ==================================================
         */

        element.dataset.label = data.label || "";

        element.dataset.placeholder = data.placeholder || "";

        /*
         * ==================================================
         * TEXTO DO BOTÃO
         * ==================================================
         */

        if (data.type === "button") {
          element.dataset.buttonText =
            data.buttonText !== undefined && data.buttonText !== null
              ? String(data.buttonText)
              : "Botão";
        }

        /*
         * ==================================================
         * INPUTS
         * ==================================================
         */

        element.dataset.inputs = JSON.stringify(
          Array.isArray(data.inputs) ? data.inputs : [],
        );

        /*
         * ==================================================
         * TABELA
         * ==================================================
         */

        element.dataset.table =
          data.table !== undefined && data.table !== null
            ? String(data.table)
            : "";

        /*
         * ==================================================
         * AÇÃO
         * ==================================================
         */

        element.dataset.action = data.action || data.actionType || "none";

        /*
         * ==================================================
         * TELA DE DESTINO
         * ==================================================
         */

        element.dataset.actionScreen =
          data.actionScreen || data.targetScreenId || "";

        /*
         * ==================================================
         * POSIÇÃO ORIGINAL NO GRID
         * ==================================================
         *
         * Inicialmente aplicamos exatamente a posição
         * salva pelo editor.
         *
         * Se for Panel, posteriormente o runtime
         * calcula a posição responsiva centralizada.
         *
         * ==================================================
         */

        element.style.gridColumn = `${element.dataset.column} / span ${element.dataset.columns}`;

        element.style.gridRow = element.dataset.row;

        /*
         * ==================================================
         * HTML INTERNO
         * ==================================================
         */

        element.innerHTML = renderComponentHTML(data.type, element.dataset);

        /*
         * ==================================================
         * PANEL
         * ==================================================
         */

        if (data.type === "panel") {
          const content = element.querySelector(":scope > .panel-content");

          /*
           * ==================================================
           * FILHOS DO PANEL
           * ==================================================
           */

          if (content && Array.isArray(data.children)) {
            data.children.forEach((childData) => {
              if (!childData || !childData.type) {
                return;
              }

              const child = createProductionComponent(childData);

              if (!child) {
                return;
              }

              content.appendChild(child);
            });
          }

          /*
           * ==================================================
           * IMPORTANTE
           * ==================================================
           *
           * Não definimos aqui:
           *
           * repeat(12, ...)
           *
           * A quantidade de colunas internas do Panel
           * é controlada pelo CSS.
           *
           * ==================================================
           */

          /*
           * ==================================================
           * PRODUÇÃO
           * ==================================================
           */

          element.draggable = false;

          /*
           * ==================================================
           * RESPONSIVIDADE INICIAL
           * ==================================================
           *
           * Já aplica o tamanho correto e centralizado
           * antes do Panel ser colocado no Grid.
           *
           * ==================================================
           */

          updateProductionPanelResponsiveColumns(element);

          /*
           * ==================================================
           * DIMENSIONAR PANEL
           * ==================================================
           */

          updateProductionPanelSize(element);
        }

        /*
         * ==================================================
         * PRODUÇÃO
         * ==================================================
         */

        element.draggable = false;

        /*
         * ==================================================
         * RETORNAR
         * ==================================================
         */

        return element;
      }

      /*
       * ==================================================
       * RENDERIZAR PROJETO
       * ==================================================
       */

      function renderProductionProject(grid, project, screenId = null) {
        if (!grid) {
          return;
        }

        /*
         * ==================================================
         * ESTADO
         * ==================================================
         */

        window.ProductionState = {
          project,
          screenId,
        };

        /*
         * ==================================================
         * LIMPAR RUNTIME ANTERIOR
         * ==================================================
         */

        grid.replaceChildren();

        /*
         * ==================================================
         * PROJETO INVÁLIDO
         * ==================================================
         */

        if (!project || !Array.isArray(project.screens)) {
          return;
        }

        /*
         * ==================================================
         * ENCONTRAR TELA
         * ==================================================
         */

        let selectedScreen = project.screens.find(
          (screen) => screen.id === screenId,
        );

        /*
         * ==================================================
         * FALLBACK
         * ==================================================
         */

        if (!selectedScreen) {
          selectedScreen = project.screens[0];
        }

        if (!selectedScreen) {
          return;
        }

        /*
         * ==================================================
         * TELA ATUAL
         * ==================================================
         */

        grid.dataset.screenId = selectedScreen.id;

        /*
         * ==================================================
         * COMPONENTES DA TELA
         * ==================================================
         */

        const components = Array.isArray(selectedScreen.components)
          ? selectedScreen.components
          : [];

        /*
         * ==================================================
         * CRIAR COMPONENTES
         * ==================================================
         */

        components.forEach((data) => {
          if (!data || !data.type) {
            return;
          }

          const element = createProductionComponent(data);

          if (!element) {
            return;
          }

          grid.appendChild(element);
        });

        /*
         * ==================================================
         * RECALCULAR PANELS
         * ==================================================
         *
         * Neste momento todos os elementos já estão
         * dentro da Grid.
         *
         * ==================================================
         */

        updateAllProductionPanels(grid);
      }
    </script>

    <!-- @MODULE: RUNTIME_RENDER:JS:END -->

    <!-- ==================================================
   @MODULE: RUNTIME_NAVIGATION:JS:START
================================================== -->

    <script>
      /*
       * ==================================================
       * RUNTIME_NAVIGATION:JS
       * ==================================================
       *
       * Responsável exclusivamente por:
       *
       * - localizar telas
       * - navegar entre telas
       *
       * ==================================================
       */

      function navigateProductionToScreen(screenId) {
        /*
         * Só funciona em produção.
         */
        if (!ENV.isProd()) {
          return;
        }

        const project = EditorState.productionProject;

        const productionGrid = getProductionGrid();

        if (!project || !productionGrid) {
          return;
        }

        /*
         * O projeto precisa possuir telas.
         */
        if (!Array.isArray(project.screens)) {
          return;
        }

        /*
         * Localiza a tela.
         */
        const screen = project.screens.find((item) => item.id === screenId);

        if (!screen) {
          console.warn(`OneFileBox: tela "${screenId}" não encontrada.`);

          return;
        }

        /*
         * Renderiza a tela encontrada.
         */
        renderProductionProject(productionGrid, project, screenId);
      }
    </script>

    <!-- @MODULE: RUNTIME_NAVIGATION:JS:END -->

    <!-- ==================================================
   @MODULE: RUNTIME_EVENTS:JS:START
================================================== -->

    <script>
      /*
       * ==================================================
       * RUNTIME_EVENTS:JS
       * ==================================================
       *
       * Responsável exclusivamente por:
       *
       * - eventos dos componentes
       * - clique em botões
       * - leitura dos inputs
       * - salvamento de registros
       * - execução das ações
       * - Enter nos Inputs ligados a botões
       *
       * ==================================================
       */

      /*
       * ==================================================
       * LER INPUTS DO BOTÃO
       * ==================================================
       */

      function getProductionButtonValues(component) {
        let inputIds = [];

        /*
         * Recupera IDs dos inputs.
         */

        try {
          inputIds = JSON.parse(component.dataset.inputs || "[]");
        } catch {
          inputIds = [];
        }

        if (!Array.isArray(inputIds)) {
          inputIds = [];
        }

        const values = {};

        /*
         * ==================================================
         * PERCORRE INPUTS ASSOCIADOS
         * ==================================================
         */

        inputIds.forEach((id) => {
          const inputComponent = document.querySelector(
            `#productionGrid .production-component[data-id="${CSS.escape(id)}"]`,
          );

          if (!inputComponent) {
            console.warn("OneFileBox: Input não encontrado no runtime:", id);

            return;
          }

          const input = inputComponent.querySelector("input");

          if (!input) {
            console.warn("OneFileBox: componente não possui input:", id);

            return;
          }

          const label = inputComponent.dataset.label || id;

          values[label] = input.value;
        });

        console.log("OneFileBox: valores coletados dos Inputs:", values);

        return values;
      }

      /*
       * ==================================================
       * OBTER TABELA DO BOTÃO
       * ==================================================
       */

      function getProductionButtonTable(component) {
        return String(component.dataset.table || "").trim();
      }

      /*
       * ==================================================
       * SALVAR DADOS DO BOTÃO
       * ==================================================
       */

      async function saveProductionButtonValues(component) {
        console.log("OneFileBox: botão de cadastro acionado.");

        const tableName = getProductionButtonTable(component);

        /*
         * ==================================================
         * TABELA OBRIGATÓRIA
         * ==================================================
         */

        if (!tableName) {
          console.warn(
            "OneFileBox: o botão não possui uma tabela configurada.",
          );

          alert("Configure o nome da tabela nas propriedades do botão.");

          return null;
        }

        console.log("OneFileBox: tabela configurada:", tableName);

        /*
         * ==================================================
         * LER INPUTS
         * ==================================================
         */

        const values = getProductionButtonValues(component);

        /*
         * ==================================================
         * NENHUM INPUT
         * ==================================================
         */

        if (!Object.keys(values).length) {
          console.warn(
            "OneFileBox: nenhum Input foi selecionado para este botão.",
          );

          alert("Selecione pelo menos um Input nas propriedades do botão.");

          return null;
        }

        /*
         * ==================================================
         * SALVAR
         * ==================================================
         */

        try {
          console.log("OneFileBox: chamando DataStorage.insert()...");

          const record = await DataStorage.insert(tableName, values);

          console.log("OneFileBox: REGISTRO SALVO NO INDEXEDDB:", record);

          return record;
        } catch (error) {
          console.error("OneFileBox: erro ao salvar registro:", error);

          alert(error?.message || "Não foi possível salvar os dados.");

          return null;
        }
      }

      /*
       * ==================================================
       * CLIQUE EM BOTÃO
       * ==================================================
       */

      async function handleProductionButtonClick(event) {
        /*
         * Ignora completamente no editor.
         */

        if (!ENV.isProd()) {
          return;
        }

        /*
         * Procura um botão dentro
         * de um componente de produção.
         */

        const button = event.target.closest(
          '.production-component[data-component="button"] button',
        );

        if (!button) {
          return;
        }

        const component = button.closest(".production-component");

        if (!component) {
          return;
        }

        console.log("OneFileBox: clique no botão:", component);

        /*
         * ==================================================
         * INPUTS / TABELA
         * ==================================================
         *
         * Se o botão possuir tabela,
         * cria um novo registro.
         *
         * ==================================================
         */

        const tableName = getProductionButtonTable(component);

        if (tableName) {
          await saveProductionButtonValues(component);
        }

        /*
         * ==================================================
         * AÇÃO
         * ==================================================
         */

        const action = component.dataset.action || "none";

        /*
         * Sem ação.
         */

        if (action === "none") {
          return;
        }

        /*
         * ==================================================
         * NAVEGAÇÃO
         * ==================================================
         */

        if (action === "navigate") {
          const screenId = component.dataset.actionScreen;

          if (!screenId) {
            return;
          }

          navigateProductionToScreen(screenId);
        }
      }

      /*
       * ==================================================
       * ENTER NOS INPUTS
       * ==================================================
       *
       * Permite pressionar Enter dentro de um Input
       * para executar automaticamente o botão ligado
       * a esse Input.
       *
       * Exemplo:
       *
       * Input:
       * data-id="input-123"
       *
       * Botão:
       * data-inputs='["input-123"]'
       *
       * Ao pressionar Enter dentro do Input:
       *
       * Input
       *   ↓
       * botão ligado
       *   ↓
       * click()
       *   ↓
       * handleProductionButtonClick()
       *   ↓
       * DataStorage.insert()
       *
       * ==================================================
       */

      function handleProductionInputEnter(event) {
        /*
         * ==================================================
         * SOMENTE PRODUÇÃO
         * ==================================================
         */

        if (!ENV.isProd()) {
          return;
        }

        /*
         * ==================================================
         * SOMENTE ENTER
         * ==================================================
         */

        if (event.key !== "Enter") {
          return;
        }

        /*
         * ==================================================
         * SOMENTE INPUT DE TEXTO
         * ==================================================
         */

        if (event.target.tagName !== "INPUT") {
          return;
        }

        /*
         * ==================================================
         * IGNORA MODIFICADORES
         * ==================================================
         *
         * Permite que combinações como:
         *
         * Ctrl + Enter
         * Shift + Enter
         *
         * continuem disponíveis para outros comportamentos.
         *
         * ==================================================
         */

        if (event.ctrlKey || event.shiftKey || event.altKey || event.metaKey) {
          return;
        }

        /*
         * ==================================================
         * LOCALIZA COMPONENTE DO INPUT
         * ==================================================
         */

        const inputComponent = event.target.closest(
          "#productionGrid .production-component[data-id]",
        );

        if (!inputComponent) {
          return;
        }

        const inputId = inputComponent.dataset.id;

        if (!inputId) {
          return;
        }

        /*
         * ==================================================
         * PROCURA BOTÃO LIGADO AO INPUT
         * ==================================================
         */

        const buttons = document.querySelectorAll(
          '#productionGrid .production-component[data-component="button"]',
        );

        let connectedButton = null;

        buttons.forEach((buttonComponent) => {
          if (connectedButton) {
            return;
          }

          let inputIds = [];

          try {
            inputIds = JSON.parse(buttonComponent.dataset.inputs || "[]");
          } catch {
            inputIds = [];
          }

          if (!Array.isArray(inputIds)) {
            return;
          }

          if (inputIds.includes(inputId)) {
            connectedButton = buttonComponent;
          }
        });

        /*
         * ==================================================
         * NENHUM BOTÃO ENCONTRADO
         * ==================================================
         */

        if (!connectedButton) {
          console.warn("OneFileBox: nenhum botão ligado ao Input:", inputId);

          return;
        }

        /*
         * ==================================================
         * EVITA COMPORTAMENTO PADRÃO
         * ==================================================
         */

        event.preventDefault();

        /*
         * ==================================================
         * DISPARA O CLIQUE REAL
         * ==================================================
         *
         * Não chamamos saveProductionButtonValues()
         * diretamente.
         *
         * Usamos click() para passar pelo mesmo fluxo
         * utilizado pelo clique do mouse.
         *
         * ==================================================
         */

        const button = connectedButton.querySelector("button");

        if (!button) {
          console.warn(
            "OneFileBox: botão conectado não possui elemento <button>.",
          );

          return;
        }

        console.log(
          "OneFileBox: Enter detectado. Disparando botão ligado ao Input:",
          inputId,
        );

        button.click();
      }

      /*
       * ==================================================
       * LISTENER GLOBAL - ENTER
       * ==================================================
       */

      document.addEventListener("keydown", handleProductionInputEnter);

      /*
       * ==================================================
       * LISTENER GLOBAL - CLIQUE
       * ==================================================
       *
       * Existe apenas UM listener para o runtime.
       *
       * ==================================================
       */

      document.addEventListener("click", handleProductionButtonClick);
    </script>

    <!-- @MODULE: RUNTIME_EVENTS:JS:END -->

   @MODULE: RUNTIME_BOOT:JS:START
================================================== -->

    <script>
      /*
       * ==================================================
       * RUNTIME_BOOT:JS
       * ==================================================
       *
       * Responsável exclusivamente por:
       *
       * - inicialização automática
       * - carregar o projeto em produção
       *
       * ==================================================
       */

      async function startProductionRuntime() {
        /*
         * Nunca inicializa o runtime
         * enquanto estiver no editor.
         */
        if (!ENV.isProd()) {
          return;
        }

        try {
          /*
           * Lista projetos salvos.
           */
          const projects = await ProjectStorage.list();

          /*
           * Nenhum projeto.
           */
          if (!projects.length) {
            console.warn("OneFileBox: nenhum projeto encontrado.");

            return;
          }

          /*
           * Mantém o comportamento atual:
           * projeto ordenado pelo nome.
           */
          projects.sort((a, b) => {
            return a.name.localeCompare(b.name);
          });

          /*
           * Primeiro projeto.
           */
          const project = projects[0];

          /*
           * Elementos do runtime.
           */
          const productionGrid = getProductionGrid();

          const productionApp = getProductionApp();

          if (!productionGrid || !productionApp) {
            console.error(
              "OneFileBox: elementos do modo produção não encontrados.",
            );

            return;
          }

          /*
           * Guarda o projeto em memória.
           */
          EditorState.productionProject = project;

          /*
           * Renderiza o projeto.
           */
          renderProductionProject(productionGrid, project);

          /*
           * Mostra o runtime.
           */
          productionApp.style.display = "block";

          /*
           * Esconde o editor.
           */
          setEditorVisibility(false);

          console.log(`Projeto "${project.name}" carregado.`);
        } catch (error) {
          console.error("Erro ao iniciar runtime de produção:", error);
        }
      }

      /*
       * ==================================================
       * INICIALIZAÇÃO
       * ==================================================
       *
       * Se o DOM ainda estiver carregando,
       * espera DOMContentLoaded.
       *
       * Caso contrário, inicializa imediatamente.
       *
       * ==================================================
       */

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startProductionRuntime);
      } else {
        startProductionRuntime();
      }
    </script>

    <!-- @MODULE: RUNTIME_BOOT:JS:END -->
