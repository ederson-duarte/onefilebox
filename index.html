    <script>
      /*
       * ==================================================
       * RUNTIME_CORE:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - elementos do runtime
       * - sincronização do Editor DOM -> memória
       * - snapshot do projeto
       * - entrar em produção
       * - sair de produção
       * - alternar entre Dev e Runtime
       * - atalho F1
       * - visibilidade do editor
       *
       * NÃO possui:
       * - renderização de componentes
       * - navegação entre telas
       * - eventos de componentes
       * - inicialização automática
       * - armazenamento no IndexedDB
       *
       * ==================================================
       */

      /*
       * ==================================================
       * ELEMENTOS
       * ==================================================
       */

      function getProductionApp() {
        return document.getElementById("productionApp");
      }

      function getProductionGrid() {
        return document.getElementById("productionGrid");
      }

      /*
       * ==================================================
       * SINCRONIZAR EDITOR -> MEMÓRIA
       * ==================================================
       *
       * O Editor trabalha diretamente com o DOM.
       *
       * Portanto, quando um componente é criado ou
       * alterado, o DOM pode estar mais atualizado
       * do que:
       *
       * EditorState.currentProject
       *
       * Antes de entrar no Runtime precisamos transformar
       * o DOM atual novamente em dados do projeto.
       *
       * IMPORTANTE:
       *
       * Isso NÃO salva no IndexedDB.
       *
       * Apenas mantém o projeto em memória atualizado
       * para que o Runtime possa receber exatamente
       * o estado atual do Editor.
       *
       * Fluxo:
       *
       * DOM do Editor
       *      ↓
       * serializeCurrentGrid()
       *      ↓
       * currentScreen.components
       *      ↓
       * createProductionProjectSnapshot()
       *      ↓
       * Runtime
       *
       * ==================================================
       */

      function syncCurrentEditorToProject() {
        const project = EditorState.currentProject;

        if (!project) {
          console.warn(
            "OneFileBox: não existe projeto atual para sincronizar.",
          );

          return false;
        }

        if (!DOM.grid) {
          console.warn(
            "OneFileBox: grid do editor não existe para sincronização.",
          );

          return false;
        }

        if (
          typeof ProjectComponents === "undefined" ||
          typeof ProjectComponents.serializeCurrentGrid !== "function"
        ) {
          console.error(
            "OneFileBox: ProjectComponents.serializeCurrentGrid() não está disponível.",
          );

          return false;
        }

        /*
         * ==================================================
         * ENCONTRAR TELA ATUAL
         * ==================================================
         *
         * Usa primeiro currentScreenId.
         *
         * Caso necessário, utiliza a referência
         * EditorState.currentScreen como fallback.
         *
         * ==================================================
         */

        if (!Array.isArray(project.screens)) {
          project.screens = [];
        }

        let currentScreen = null;

        if (EditorState.currentScreenId) {
          currentScreen = project.screens.find((screen) => {
            return screen.id === EditorState.currentScreenId;
          });
        }

        if (
          !currentScreen &&
          EditorState.currentScreen &&
          EditorState.currentScreen.id
        ) {
          currentScreen = project.screens.find((screen) => {
            return screen.id === EditorState.currentScreen.id;
          });
        }

        /*
         * ==================================================
         * FALLBACK PARA O GRID
         * ==================================================
         *
         * Caso o estado da tela ainda não esteja
         * corretamente definido, tenta utilizar
         * o screenId armazenado no próprio grid.
         *
         * ==================================================
         */

        if (!currentScreen && DOM.grid.dataset.screenId) {
          currentScreen = project.screens.find((screen) => {
            return screen.id === DOM.grid.dataset.screenId;
          });
        }

        if (!currentScreen) {
          console.warn(
            "OneFileBox: não foi possível encontrar a tela atual para sincronização.",
          );

          return false;
        }

        /*
         * ==================================================
         * SERIALIZAR DOM ATUAL
         * ==================================================
         *
         * Aqui acontece a parte importante.
         *
         * Tudo que existe atualmente no Editor DOM:
         *
         * - Input
         * - Dropdown
         * - Button
         * - Text
         * - Panel
         * - filhos de Panel
         * - propriedades
         *
         * é convertido novamente para dados.
         *
         * ==================================================
         */

        const components = ProjectComponents.serializeCurrentGrid();

        /*
         * ==================================================
         * ATUALIZAR MEMÓRIA
         * ==================================================
         */

        currentScreen.components = components;

        /*
         * ==================================================
         * GARANTIR REFERÊNCIAS DO ESTADO
         * ==================================================
         */

        EditorState.currentScreen = currentScreen;

        EditorState.currentScreenId = currentScreen.id;

        /*
         * ==================================================
         * DEBUG
         * ==================================================
         */

        console.log(
          "OneFileBox: Editor sincronizado com o projeto em memória.",
          {
            screenId: currentScreen.id,
            components: components.length,
          },
        );

        return true;
      }

      /*
       * ==================================================
       * SNAPSHOT
       * ==================================================
       *
       * Cria uma cópia COMPLETA e independente
       * do projeto atual.
       *
       * IMPORTANTE:
       *
       * Antes de criar o snapshot, o DOM do Editor
       * é sincronizado com EditorState.currentProject.
       *
       * Dessa forma o snapshot representa o estado
       * atual do Editor, mesmo que o projeto ainda
       * não tenha sido salvo no IndexedDB.
       *
       * ==================================================
       */

      function createProductionProjectSnapshot() {
        if (!EditorState.currentProject) {
          console.warn(
            "OneFileBox: não existe projeto atual para criar o snapshot.",
          );

          return null;
        }

        /*
         * ==================================================
         * SINCRONIZA EDITOR -> MEMÓRIA
         * ==================================================
         *
         * Isso é necessário porque as alterações feitas
         * no Editor acontecem primeiro no DOM.
         *
         * O Runtime deve receber o estado atual do DOM,
         * e não somente o último estado salvo em memória.
         *
         * ==================================================
         */

        const synchronized = syncCurrentEditorToProject();

        if (!synchronized) {
          console.warn(
            "OneFileBox: não foi possível sincronizar o Editor antes de criar o snapshot.",
          );

          return null;
        }

        try {
          /*
           * ==================================================
           * CÓPIA PROFUNDA
           * ==================================================
           *
           * structuredClone() cria uma cópia
           * completamente independente.
           *
           * Isso é importante porque o Runtime
           * não deve modificar diretamente
           * o projeto do Editor.
           *
           * ==================================================
           */

          if (typeof structuredClone === "function") {
            return structuredClone(EditorState.currentProject);
          }

          /*
           * ==================================================
           * FALLBACK
           * ==================================================
           *
           * Caso o navegador não possua structuredClone,
           * utiliza JSON para criar uma cópia profunda.
           *
           * O projeto do OneFileBox é composto por
           * dados serializáveis, portanto esse fallback
           * é adequado para sua estrutura atual.
           *
           * ==================================================
           */

          return JSON.parse(JSON.stringify(EditorState.currentProject));
        } catch (error) {
          console.error(
            "OneFileBox: erro ao criar snapshot do projeto:",
            error,
          );

          return null;
        }
      }

      /*
       * ==================================================
       * ENTRAR EM PRODUÇÃO
       * ==================================================
       */

      async function enterProductionMode() {
        if (ENV.isProd()) {
          return;
        }

        const productionApp = getProductionApp();

        const productionGrid = getProductionGrid();

        if (!productionApp || !productionGrid) {
          console.error(
            "OneFileBox: elementos do modo produção não encontrados.",
          );

          return;
        }

        /*
         * ==================================================
         * GUARDA A TELA QUE ESTAVA ABERTA
         * ==================================================
         *
         * Fazemos isso antes da troca para produção.
         *
         * ==================================================
         */

        const startScreenId =
          EditorState.currentScreen?.id || EditorState.currentScreenId || null;

        /*
         * ==================================================
         * SNAPSHOT
         * ==================================================
         *
         * createProductionProjectSnapshot()
         * sincroniza o DOM do Editor com a memória
         * antes de copiar o projeto.
         *
         * Portanto componentes criados ou alterados
         * imediatamente antes de pressionar F1
         * também estarão presentes no Runtime.
         *
         * ==================================================
         */

        const snapshot = createProductionProjectSnapshot();

        if (!snapshot) {
          console.warn(
            "OneFileBox: não foi possível criar o snapshot do projeto.",
          );

          return;
        }

        EditorState.productionProject = snapshot;

        /*
         * Cancela qualquer drag ativo.
         */
        if (typeof cancelDrag === "function") {
          cancelDrag();
        }

        /*
         * Remove seleção do editor.
         */
        EditorState.selected = null;

        /*
         * ==================================================
         * TROCA PARA PRODUÇÃO
         * ==================================================
         */

        ENV.setMode("prod");

        /*
         * Esconde o editor.
         */
        setEditorVisibility(false);

        /*
         * ==================================================
         * RENDERIZA O SNAPSHOT
         * ==================================================
         *
         * O Runtime recebe exclusivamente o snapshot.
         *
         * ==================================================
         */

        renderProductionProject(productionGrid, snapshot, startScreenId);

        /*
         * Mostra o runtime.
         */
        productionApp.style.display = "block";

        /*
         * Atualiza o texto do botão Testar.
         *
         * Quando a entrada foi feita pelo F1,
         * o clique do botão não passou pelo
         * UI:BUTTONS:JS, portanto precisamos
         * atualizar manualmente a interface.
         */

        if (typeof updateTestButton === "function") {
          updateTestButton();
        }
      }

      /*
       * ==================================================
       * SAIR DE PRODUÇÃO
       * ==================================================
       */

      function exitProductionMode() {
        if (ENV.isDev()) {
          return;
        }

        const productionApp = getProductionApp();

        if (productionApp) {
          productionApp.style.display = "none";
        }

        /*
         * ==================================================
         * VOLTA PARA DESENVOLVIMENTO
         * ==================================================
         */

        ENV.setMode("dev");

        /*
         * Mostra novamente o editor.
         */
        setEditorVisibility(true);

        /*
         * ==================================================
         * RESTAURA O SNAPSHOT
         * ==================================================
         *
         * O snapshot representa o estado do Editor
         * no momento em que entramos no Runtime.
         *
         * Portanto o retorno ao Editor restaura
         * exatamente aquele estado em memória.
         *
         * ==================================================
         */

        if (EditorState.productionProject && DOM.grid) {
          const project = EditorState.productionProject;

          ProjectStorage.loadProject(project);

          EditorState.currentProject = project;

          /*
           * ==================================================
           * DESCOBRIR TELA ATUAL
           * ==================================================
           */

          if (Array.isArray(project.screens)) {
            const screenId = DOM.grid.dataset.screenId;

            const screen = project.screens.find((item) => {
              return item.id === screenId;
            });

            if (screen) {
              EditorState.currentScreen = screen;

              EditorState.currentScreenId = screen.id;
            }
          }

          /*
           * ==================================================
           * ATUALIZAR LISTA DE TELAS
           * ==================================================
           */

          if (typeof renderScreenList === "function") {
            renderScreenList();
          }

          /*
           * ==================================================
           * ATUALIZAR CANVAS
           * ==================================================
           */

          if (typeof renderCurrentScreen === "function") {
            renderCurrentScreen();
          }

         * compatibilidade com projetos antigos.
         *
         * ==================================================
         */

        if (validationType === "personname" || validationType === "name") {
          if (!isValidProductionPersonName(trimmedValue)) {
            const message = customMessage || "Nome de pessoa inválido.";

            showProductionInputError(inputComponent, message);

            return {
              valid: false,
              message,
            };
          }
        }

        /*
         * ==================================================
         * EMAIL
         * ==================================================
         */

        if (validationType === "email") {
          if (!isValidProductionEmail(trimmedValue)) {
            const message = customMessage || "Digite um email válido.";

            showProductionInputError(inputComponent, message);

            return {
              valid: false,
              message,
            };
          }
        }

        /*
         * ==================================================
         * MÍNIMO
         * ==================================================
         */

        if (minLength > 0 && trimmedValue.length < minLength) {
          const message =
            customMessage ||
            `Este campo deve possuir pelo menos ${minLength} caracteres.`;

          showProductionInputError(inputComponent, message);

          return {
            valid: false,
            message,
          };
        }

        /*
         * ==================================================
         * MÁXIMO
         * ==================================================
         */

        if (maxLength > 0 && trimmedValue.length > maxLength) {
          const message =
            customMessage ||
            `Este campo deve possuir no máximo ${maxLength} caracteres.`;

          showProductionInputError(inputComponent, message);

          return {
            valid: false,
            message,
          };
        }

        /*
         * ==================================================
         * VÁLIDO
         * ==================================================
         */

        return {
          valid: true,
        };
      }

      /*
       * ==================================================
       * VALIDAR INPUT NO BLUR
       * ==================================================
       *
       * Quando o usuário sai do campo,
       * executamos a validação.
       *
       * Isso permite mostrar imediatamente
       * o erro abaixo do Input sem precisar
       * clicar no botão.
       *
       * ==================================================
       */

      function handleProductionInputBlur(event) {
        if (!ENV.isProd()) {
          return;
        }

        const input = event.target;

        if (!input || input.tagName !== "INPUT") {
          return;
        }

        const inputComponent = input.closest(
          '#productionGrid .production-component[data-component="input"]',
        );

        if (!inputComponent) {
          return;
        }

        validateProductionInput(inputComponent);
      }

      /*
       * ==================================================
       * VALIDAR INPUT DURANTE A DIGITAÇÃO
       * ==================================================
       *
       * Só executa enquanto o campo já estiver
       * marcado como inválido.
       *
       * Assim não mostramos mensagens enquanto
       * o usuário ainda está começando a digitar.
       *
       * ==================================================
       */

      function handleProductionInputInput(event) {
        if (!ENV.isProd()) {
          return;
        }

        const input = event.target;

        if (!input || input.tagName !== "INPUT") {
          return;
        }

        const inputComponent = input.closest(
          '#productionGrid .production-component[data-component="input"]',
        );

        if (!inputComponent) {
          return;
        }

        if (input.getAttribute("aria-invalid") !== "true") {
          return;
        }

        validateProductionInput(inputComponent);
      }

      /*
       * ==================================================
       * VALIDAR INPUTS DO BOTÃO
       * ==================================================
       *
       * Valida somente os Inputs associados
       * ao botão pressionado.
       *
       * ==================================================
       */

      function validateProductionButtonInputs(component) {
        let inputIds = [];

        try {
          inputIds = JSON.parse(component.dataset.inputs || "[]");
        } catch {
          inputIds = [];
        }

        if (!Array.isArray(inputIds)) {
          inputIds = [];
        }

        let valid = true;

        let firstInvalidInput = null;

        inputIds.forEach((id) => {
          const inputComponent = document.querySelector(
            `#productionGrid .production-component[data-id="${CSS.escape(id)}"]`,
          );

          if (!inputComponent) {
            console.warn(
              "OneFileBox: Input não encontrado durante validação:",
              id,
            );

            return;
          }

          const result = validateProductionInput(inputComponent);

          if (!result.valid) {
            valid = false;

            if (!firstInvalidInput) {
              firstInvalidInput = inputComponent;
            }
          }
        });

        /*
         * ==================================================
         * FOCAR PRIMEIRO INPUT INVÁLIDO
         * ==================================================
         */

        if (firstInvalidInput) {
          const input = firstInvalidInput.querySelector("input");

          if (input) {
            input.focus();

            /*
             * Faz o Input ficar visível
             * quando estiver dentro de um
             * Panel com overflow.
             */

            try {
              input.scrollIntoView({
                behavior: "smooth",
                block: "center",
              });
            } catch {
              /*
               * Alguns ambientes podem não
               * suportar essas opções.
               */
            }
          }
        }

        return valid;
      }

      /*
       * ==================================================
       * LER INPUTS DO BOTÃO
       * ==================================================
       */

      function getProductionButtonValues(component) {
        let inputIds = [];

        /*
         * Recupera IDs dos inputs.
         */

        try {
          inputIds = JSON.parse(component.dataset.inputs || "[]");
        } catch {
          inputIds = [];
        }

        if (!Array.isArray(inputIds)) {
          inputIds = [];
        }

        const values = {};

        /*
         * ==================================================
         * PERCORRE INPUTS ASSOCIADOS
         * ==================================================
         */

        inputIds.forEach((id) => {
          const inputComponent = document.querySelector(
            `#productionGrid .production-component[data-id="${CSS.escape(id)}"]`,
          );

          if (!inputComponent) {
            console.warn("OneFileBox: Input não encontrado no runtime:", id);

            return;
          }

          const input = inputComponent.querySelector("input");

          if (!input) {
            console.warn("OneFileBox: componente não possui input:", id);

            return;
          }

          const label = inputComponent.dataset.label || id;

          values[label] = input.value;
        });

        console.log("OneFileBox: valores coletados dos Inputs:", values);

        return values;
      }

      /*
       * ==================================================
       * OBTER TABELA DO BOTÃO
       * ==================================================
       */

      function getProductionButtonTable(component) {
        return String(component.dataset.table || "").trim();
      }

      /*
       * ==================================================
       * SALVAR DADOS DO BOTÃO
       * ==================================================
       */

      async function saveProductionButtonValues(component) {
        console.log("OneFileBox: botão de cadastro acionado.");

        const tableName = getProductionButtonTable(component);

        /*
         * ==================================================
         * TABELA OBRIGATÓRIA
         * ==================================================
         */

        if (!tableName) {
          console.warn(
            "OneFileBox: o botão não possui uma tabela configurada.",
          );

          alert("Configure o nome da tabela nas propriedades do botão.");

          return null;
        }

        console.log("OneFileBox: tabela configurada:", tableName);

        /*
         * ==================================================
         * VALIDAR INPUTS
         * ==================================================
         */

        const inputsAreValid = validateProductionButtonInputs(component);

        if (!inputsAreValid) {
          console.warn(
            "OneFileBox: envio bloqueado porque existem Inputs inválidos.",
          );

          return null;
        }

        /*
         * ==================================================
         * LER INPUTS
         * ==================================================
         */

        const values = getProductionButtonValues(component);

        /*
         * ==================================================
         * NENHUM INPUT
         * ==================================================
         */

        if (!Object.keys(values).length) {
          console.warn(
            "OneFileBox: nenhum Input foi selecionado para este botão.",
          );

          alert("Selecione pelo menos um Input nas propriedades do botão.");

          return null;
        }

        /*
         * ==================================================
         * SALVAR
         * ==================================================
         */

        try {
          console.log("OneFileBox: chamando DataStorage.insert()...");

          const record = await DataStorage.insert(tableName, values);

          console.log("OneFileBox: REGISTRO SALVO NO INDEXEDDB:", record);

          return record;
        } catch (error) {
          console.error("OneFileBox: erro ao salvar registro:", error);

          alert(error?.message || "Não foi possível salvar os dados.");

          return null;
        }
      }

      /*
       * ==================================================
       * LIMPAR INPUTS DO BOTÃO
       * ==================================================
       *
       * Limpa somente os Inputs associados ao botão.
       *
       * IMPORTANTE:
       *
       * Esta função é chamada somente depois que
       * DataStorage.insert() confirmou o salvamento.
       *
       * ==================================================
       */

      function clearProductionButtonInputs(component) {
        if (!component) {
          return;
        }

        let inputIds = [];

        try {
          inputIds = JSON.parse(component.dataset.inputs || "[]");
        } catch {
          inputIds = [];
        }

        if (!Array.isArray(inputIds)) {
          inputIds = [];
        }

        inputIds.forEach((id) => {
          const inputComponent = document.querySelector(
            `#productionGrid .production-component[data-id="${CSS.escape(id)}"]`,
          );

          if (!inputComponent) {
            return;
          }

          const input = inputComponent.querySelector("input");

          if (!input) {
            return;
          }

          /*
           * Limpa o valor do campo.
           */
          input.value = "";

          /*
           * Remove eventual estado de erro.
           */
          clearProductionInputError(inputComponent);
        });
      }

      async function executeProductionButton(button) {
        const component = button.closest(".production-component");

        if (!component) {
          return;
        }

        console.log("OneFileBox: clique no botão:", component);

        const tableName = getProductionButtonTable(component);

        if (tableName) {
          const record = await saveProductionButtonValues(component);

          /*
           * ==================================================
           * SALVAMENTO NÃO REALIZADO
           * ==================================================
           *
           * Mantém os valores dos Inputs.
           *
           * ==================================================
           */

          if (record === null) {
            return;
          }

          /*
           * ==================================================
           * SALVAMENTO CONFIRMADO
           * ==================================================
           *
           * Somente agora os Inputs são limpos.
           *
           * ==================================================
           */

          clearProductionButtonInputs(component);
        }

        const action = component.dataset.action || "none";

        if (action === "none") {
          return;
        }

        if (action === "navigate") {
          const screenId = component.dataset.actionScreen;

          if (!screenId) {
            return;
          }

          navigateProductionToScreen(screenId);
        }
      }

      /*
       * ==================================================
       * CLIQUE EM BOTÃO
       * ==================================================
       */

      async function handleProductionButtonClick(event) {
        /*
         * Ignora completamente no editor.
         */

        if (!ENV.isProd()) {
          return;
        }

        /*
         * Procura um botão dentro
         * de um componente de produção.
         */

        const button = event.target.closest(
          '.production-component[data-component="button"] button',
        );

        if (!button) {
          return;
        }

        await executeProductionButton(button);
      }

      /*
       * ==================================================
       * ENTER NOS INPUTS
       * ==================================================
       *
       * Permite pressionar Enter dentro de um Input
       * para executar automaticamente o botão ligado
       * a esse Input.
       *
       * O botão passa pelo mesmo fluxo do clique.
       *
       * Portanto a validação também é executada.
       *
       * ==================================================
       */

      async function handleProductionInputEnter(event) {
        /*
         * ==================================================
         * SOMENTE PRODUÇÃO
         * ==================================================
         */

        if (!ENV.isProd()) {
          return;
        }

        /*
         * ==================================================
         * SOMENTE ENTER
         * ==================================================
         */

        if (event.key !== "Enter") {
          return;
        }

        /*
         * ==================================================
         * SOMENTE INPUT DE TEXTO
         * ==================================================
         */

        if (event.target.tagName !== "INPUT") {
          return;
        }

        /*
         * ==================================================
         * IGNORA MODIFICADORES
         * ==================================================
         */

        if (event.ctrlKey || event.shiftKey || event.altKey || event.metaKey) {
          return;
        }

        /*
         * ==================================================
         * LOCALIZA COMPONENTE DO INPUT
         * ==================================================
         */

        const inputComponent = event.target.closest(
          "#productionGrid .production-component[data-id]",
        );

        if (!inputComponent) {
          return;
        }

        const inputId = inputComponent.dataset.id;

        if (!inputId) {
          return;
        }

        /*
         * ==================================================
         * PROCURA BOTÃO LIGADO AO INPUT
         * ==================================================
         */

        const buttons = document.querySelectorAll(
          '#productionGrid .production-component[data-component="button"]',
        );

        let connectedButton = null;

        buttons.forEach((buttonComponent) => {
          if (connectedButton) {
            return;
          }

          let inputIds = [];

          try {
            inputIds = JSON.parse(buttonComponent.dataset.inputs || "[]");
          } catch {
            inputIds = [];
          }

          if (!Array.isArray(inputIds)) {
            return;
          }

          if (inputIds.includes(inputId)) {
            connectedButton = buttonComponent;
          }
        });

        /*
         * ==================================================
         * NENHUM BOTÃO ENCONTRADO
         * ==================================================
         */

        if (!connectedButton) {
          console.warn("OneFileBox: nenhum botão ligado ao Input:", inputId);

          return;
        }

        /*
         * ==================================================
         * EVITA COMPORTAMENTO PADRÃO
         * ==================================================
         */

        event.preventDefault();

        /*
         * ==================================================
         * DISPARA O CLIQUE REAL
         * ==================================================
         */

        const button = connectedButton.querySelector("button");

        if (!button) {
          console.warn(
            "OneFileBox: botão conectado não possui elemento <button>.",
          );

          return;
        }

        console.log(
          "OneFileBox: Enter detectado. Disparando botão ligado ao Input:",
          inputId,
        );

        await executeProductionButton(button);
      }

      /*
       * ==================================================
       * LISTENER GLOBAL - BLUR
       * ==================================================
       *
       * Valida o Input quando o usuário sai dele.
       *
       * blur não possui bubbling, por isso usamos
       * captura (true).
       *
       * ==================================================
       */

      document.addEventListener("blur", handleProductionInputBlur, true);

      /*
       * ==================================================
       * LISTENER GLOBAL - INPUT
       * ==================================================
       *
       * Quando um Input já possui erro, a validação
       * é refeita conforme o usuário corrige o valor.
       *
       * ==================================================
       */

      document.addEventListener("input", handleProductionInputInput);

      /*
       * ==================================================
       * LISTENER GLOBAL - ENTER
       * ==================================================
       */

      document.addEventListener("keydown", handleProductionInputEnter);

      /*
       * ==================================================
       * LISTENER GLOBAL - CLIQUE
       * ==================================================
       *
       * Existe apenas UM listener para o runtime.
       *
       * ==================================================
       */

      document.addEventListener("pointerdown", handleProductionButtonClick);
    </script>

    <!-- @MODULE: RUNTIME_EVENTS:JS:END -->

    <!-- ==================================================
   @MODULE: RUNTIME_BOOT:JS:START
================================================== -->

    <script>
      /*
       * ==================================================
       * RUNTIME_BOOT:JS
       * ==================================================
       *
       * Responsável exclusivamente por:
       *
       * - inicialização automática
       * - carregar o projeto em produção
       *
       * ==================================================
       */

      async function startProductionRuntime() {
        /*
         * Nunca inicializa o runtime
         * enquanto estiver no editor.
         */
        if (!ENV.isProd()) {
          return;
        }

        try {
          /*
           * Lista projetos salvos.
           */
          const projects = await ProjectStorage.list();

          /*
           * Nenhum projeto.
           */
          if (!projects.length) {
            console.warn("OneFileBox: nenhum projeto encontrado.");

            return;
          }

          /*
           * Mantém o comportamento atual:
           * projeto ordenado pelo nome.
           */
          projects.sort((a, b) => {
            return a.name.localeCompare(b.name);
          });

          /*
           * Primeiro projeto.
           */
          const project = projects[0];

          /*
           * Elementos do runtime.
           */
          const productionGrid = getProductionGrid();

          const productionApp = getProductionApp();

          if (!productionGrid || !productionApp) {
            console.error(
              "OneFileBox: elementos do modo produção não encontrados.",
            );

            return;
          }

          /*
           * Guarda o projeto em memória.
           */
          EditorState.productionProject = project;

          /*
           * Renderiza o projeto.
           */
          renderProductionProject(productionGrid, project);

          /*
           * Mostra o runtime.
           */
          productionApp.style.display = "block";

          /*
           * Esconde o editor.
           */
          setEditorVisibility(false);

          console.log(`Projeto "${project.name}" carregado.`);
        } catch (error) {
          console.error("Erro ao iniciar runtime de produção:", error);
        }
      }

      /*
       * ==================================================
       * INICIALIZAÇÃO
       * ==================================================
       *
       * Se o DOM ainda estiver carregando,
       * espera DOMContentLoaded.
       *
       * Caso contrário, inicializa imediatamente.
       *
       * ==================================================
       */

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startProductionRuntime);
      } else {
        startProductionRuntime();
      }
    </script>

    <!-- @MODULE: RUNTIME_BOOT:JS:END -->
