<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>One File Box</title>

    <style>
      /* ==================================================
       @MODULE: COMPONENTS_PANEL:CSS:START
    ================================================== */

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;

        font-family: Arial, sans-serif;

        background: #f5f5f5;
        color: rgb(222, 226, 230);

        overflow: hidden;
      }

      .app {
        display: flex;

        flex-direction: row;

        width: 100%;
        height: 100vh;

        min-width: 0;
        min-height: 0;
      }

      /*
       * ==================================================
       * MOBILE
       * ==================================================
       */

      @media (max-width: 768px) {
        body {
          height: 100vh;

          overflow: hidden;
        }

        .app {
          flex-direction: column;

          width: 100%;
          height: 100vh;

          min-width: 0;
          min-height: 0;

          overflow: hidden;
        }
      }

      .components-panel {
        width: 260px;

        flex-shrink: 0;

        display: flex;
        flex-direction: column;

        background: #1e1e1e;
        color: white;

        border-right: 1px solid #333;

        overflow: hidden;
      }

      .components-header {
        padding: 10px;

        font-size: 12px;
        font-weight: bold;

        border-bottom: 1px solid #333;
      }

      .components-list {
        padding: 12px;

        display: grid;
        grid-template-columns: 1fr 1fr;

        gap: 8px;
      }

      .component {
        padding: 10px;

        background: #2a2a2a;

        border: 1px solid #3a3a3a;

        cursor: grab;

        user-select: none;

        -webkit-user-select: none;

        font-size: 14px;
      }

      .component:hover {
        background: #333;
      }

      .component:active {
        cursor: grabbing;
      }

      /*
       * ==================================================
       * MOBILE
       * ==================================================
       */

      @media (max-width: 768px) {
        .components-panel {
          position: static;

          width: 100%;

          /*
           * A altura do painel é fixa.
           *
           * O Workspace não pode alterar
           * o tamanho do painel durante o drag.
           */

          height: 40vh;

          min-height: 280px;

          max-height: 420px;

          flex: 0 0 40vh;

          min-width: 0;

          border-right: 0;
          border-bottom: 1px solid #333;

          overflow: hidden;

          box-sizing: border-box;
        }

        .components-header {
          position: relative;

          flex: 0 0 auto;

          height: 38px;

          min-height: 38px;

          max-height: 38px;

          padding: 10px 12px;

          background: #1e1e1e;

          font-size: 12px;

          line-height: 18px;

          border-bottom: 1px solid #333;

          box-sizing: border-box;
        }

        /*
         * ==================================================
         * LISTA MOBILE
         * ==================================================
         *
         * A lista recebe exatamente o espaço
         * restante do painel.
         *
         * Ela não pode crescer nem diminuir
         * durante o drag.
         */

        .components-list {
          flex: 0 0 auto;

          width: 100%;

          /*
           * Calcula a altura disponível depois
           * do header.
           */

          padding: 10px;

          display: flex;

          flex-direction: row;

          align-items: center;

          justify-content: flex-start;

          gap: 8px;

          overflow-x: auto;

          overflow-y: hidden;

          /*
           * O navegador pode fazer pan somente
           * horizontalmente.
           */

          touch-action: pan-x;

          overscroll-behavior-x: contain;

          -webkit-overflow-scrolling: touch;

          scrollbar-width: thin;

          box-sizing: border-box;
        }

        /*
         * ==================================================
         * COMPONENTE MOBILE
         * ==================================================
         *
         * Tamanho independente da altura da lista.
         *
         * Isso impede que os botões/componentes
         * sejam esticados.
         */

        .component {
          flex: 0 0 auto;

          width: 95px;

          display: flex;

          align-items: center;

          justify-content: center;

          font-size: 13px;

          text-align: center;

          border-radius: 5px;

          cursor: grab;

          user-select: none;

          -webkit-user-select: none;

          -webkit-touch-callout: none;

          /*
           * Permite pan horizontal.
           *
           * O DRAG_DROP continua tratando
           * o drag do componente.
           */

          touch-action: pan-x;

          box-sizing: border-box;
        }

        .component:hover {
          background: #2a2a2a;
        }

        .component:active {
          background: #333;

          cursor: grabbing;
        }
      }

      /*
       * ==================================================
       * MOBILE PEQUENO
       * ==================================================
       */

      @media (max-width: 400px) {
        .components-panel {
          height: 44vh;

          min-height: 280px;

          max-height: 430px;

          flex: 0 0 44vh;
        }

        .components-header {
          height: 36px;

          min-height: 36px;

          max-height: 36px;

          padding: 9px 10px;

          line-height: 18px;
        }

        .components-list {
          padding: 8px;

          gap: 6px;
        }

        .component {
          width: 85px;

          min-width: 85px;

          height: 30px;

          font-size: 12px;

          touch-action: pan-x;
        }
      }

      /* @MODULE: COMPONENTS_PANEL:CSS:END */

      /* ==================================================
       @MODULE: PROPERTIES:CSS:START
    ================================================== */
      .properties {
        margin-top: auto;

        padding: 10px;

        border-top: 1px solid #333;

        overflow-y: auto;
      }

      .properties-title {
        margin-bottom: 15px;
        font-size: 12px;
        font-weight: bold;
      }

      /*
       * ==================================================
       * TELAS
       * ==================================================
       */

      .screens {
        margin-bottom: 15px;
      }

      .screens-title {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 8px;

        font-size: 12px;
        font-weight: bold;

        color: white;
      }

      .screens-list {
        display: flex;
        flex-direction: column;

        gap: 3px;

        margin-bottom: 8px;
      }

      .screen-item {
        display: flex;
        align-items: center;
        justify-content: space-between;

        width: 100%;

        padding: 7px 8px;

        border: 0;
        border-radius: 4px;

        background: transparent;

        color: #bbb;

        font-size: 12px;

        text-align: left;

        cursor: pointer;
      }

      .screen-item:hover {
        background: #2a2a2a;
        color: white;
      }

      .screen-item.active {
        background: #333;
        color: white;
      }

      .screen-item-name {
        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
      }

      .screen-item-delete {
        flex-shrink: 0;

        width: 20px;
        height: 20px;

        padding: 0;

        border: 0;

        background: transparent;

        color: #888;

        font-size: 14px;

        cursor: pointer;
      }

      .screen-item-delete:hover {
        color: #ff5555;
      }

      .create-screen-button {
        width: 100%;

        padding: 7px 8px;

        border: 1px solid #444;
        border-radius: 5px;

        background: #2a2a2a;

        color: #ccc;

        font-size: 12px;

        cursor: pointer;
      }

      .create-screen-button:hover {
        background: #333;

        color: white;
      }

      .screen-separator {
        height: 1px;

        margin: 12px 0;

        background: #333;
      }

      /*
       * ==================================================
       * PROPRIEDADES
       * ==================================================
       */

      .no-selection {
        color: #888;

        font-size: 12px;

        line-height: 1.5;
      }

      .property {
        margin-bottom: 12px;
      }

      .property label {
        display: block;

        margin-bottom: 5px;

        font-size: 12px;

        color: #bbb;
      }

      .property input,
      .property select {
        width: 100%;

        padding: 8px;

        border: 1px solid #444;
        border-radius: 5px;

        background: #2a2a2a;

        color: white;

        outline: none;

        box-sizing: border-box;
      }

      /*
       * ==================================================
       * AÇÃO DO BOTÃO
       * ==================================================
       */

      .button-action-property {
        margin-top: 15px;
      }

      .button-action-fields {
        display: none;
      }

      .button-action-fields.visible {
        display: block;
      }

      /*
       * ==================================================
       * RESPONSIVIDADE MOBILE
       * ==================================================
       */

      @media (max-width: 768px) {
        .properties {
          margin-top: 0;

          padding: 10px 12px;

          border-top: 1px solid #333;

          overflow-x: hidden;
          overflow-y: auto;

          box-sizing: border-box;
        }

        .properties-title {
          margin-bottom: 10px;

          font-size: 12px;
        }

        .screens {
          margin-bottom: 10px;
        }

        .screens-list {
          display: flex;

          flex-direction: row;

          gap: 6px;

          margin-bottom: 8px;

          overflow-x: auto;
          overflow-y: hidden;
        }

        .screen-item {
          flex: 0 0 auto;

          width: auto;

          min-width: 100px;

          padding: 9px 10px;

          font-size: 12px;
        }

        .create-screen-button {
          padding: 9px 10px;

          min-height: 40px;

          font-size: 13px;
        }

        .screen-separator {
          margin: 10px 0;
        }

        .property {
          margin-bottom: 10px;
        }

        .property label {
          margin-bottom: 5px;

          font-size: 12px;
        }

        .property input,
        .property select {
          min-height: 40px;

          padding: 9px 10px;

          font-size: 14px;
        }

        .property input[type="checkbox"] {
          width: auto;

          min-height: 0;
        }
      }

      /*
       * ==================================================
       * MOBILE MUITO PEQUENO
       * ==================================================
       */

      @media (max-width: 400px) {
        .properties {
          padding: 8px 10px;
        }

        .property input,
        .property select {
          min-height: 38px;

          font-size: 13px;
        }

        .screen-item {
          min-width: 90px;

          padding: 8px;
        }
      }

      /* @MODULE: PROPERTIES:CSS:END */

      /* ==================================================
       @MODULE: WORKSPACE:CSS:START
    ================================================== */

      .workspace {
        flex: 1;

        min-width: 0;

        display: flex;
        flex-direction: column;
      }

      .toolbar {
        height: 56px;

        flex-shrink: 0;

        display: flex;
        align-items: center;

        padding: 0 16px;

        border-bottom: 1px solid #000;
        background: #202428;
      }

      .toolbar-title {
        font-weight: bold;
      }

      .canvas {
        flex: 1;

        overflow: auto;

        background: #2b3035;

        /*
         * ==================================================
         * TOUCH
         * ==================================================
         *
         * O canvas continua permitindo rolagem normalmente.
         *
         * O bloqueio do touch durante o drag é feito
         * diretamente no elemento arrastável através
         * de .canvas-component { touch-action: none; }.
         *
         * NÃO dependemos de alterar touch-action depois
         * que o gesto começou.
         *
         * ==================================================
         */

        touch-action: pan-x pan-y;

        overscroll-behavior: contain;
      }

      /*
       * Mantido para compatibilidade com o estado
       * visual utilizado pelo DRAG_DROP:JS.
       *
       * O touch-action do componente já estará definido
       * desde o início do gesto.
       */

      .canvas.mobile-dragging-canvas {
        touch-action: none;

        overscroll-behavior: none;
      }

      .canvas-content {
        position: relative;

        background: #2b3035;

        min-height: 100%;

        min-width: max-content;

        padding: 30px;

        box-sizing: border-box;
      }

      .empty-message {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        text-align: center;

        pointer-events: none;
      }

      .canvas-grid {
        display: grid;

        grid-template-columns: repeat(12, minmax(0, 1fr));

        grid-auto-rows: 90px;

        gap: 12px;

        width: 100%;

        min-width: 720px;

        min-height: 90px;

        box-sizing: border-box;
      }

      /*
       * ==================================================
       * RESPONSIVIDADE MOBILE
       * ==================================================
       *
       * O desktop não é alterado.
       *
       * No mobile:
       *
       * - o workspace ocupa a largura inteira;
       * - a toolbar pode quebrar linha;
       * - o canvas deixa de exigir 720px;
       * - o grid passa a acompanhar a largura da tela.
       *
       * ==================================================
       */

      @media (max-width: 768px) {
        .workspace {
          width: 100%;

          min-width: 0;

          box-sizing: border-box;
        }

        .toolbar {
          min-height: 56px;

          height: auto;

          flex-wrap: wrap;

          gap: 8px;

          padding: 8px 10px;

          box-sizing: border-box;
        }

        .toolbar-title {
          flex: 1 1 100%;

          font-size: 14px;
        }

        .toolbar button {
          min-height: 40px;

          padding: 8px 12px;

          border: 1px solid #444;

          border-radius: 5px;

          background: #2a2a2a;

          color: white;

          cursor: pointer;

          touch-action: manipulation;
        }

        .toolbar .projects {
          flex: 1 1 auto;

          min-width: 0;

          display: flex;

          align-items: center;

          gap: 6px;
        }

        .toolbar .projects label {
          flex-shrink: 0;

          font-size: 12px;

          color: #bbb;
        }

        .toolbar .projects select {
          min-width: 0;

          width: 100%;

          min-height: 40px;

          padding: 7px 8px;

          border: 1px solid #444;

          border-radius: 5px;

          background: #2a2a2a;

          color: white;

          box-sizing: border-box;

          touch-action: manipulation;
        }

        .canvas {
          width: 100%;

          min-width: 0;

          overflow: auto;

          box-sizing: border-box;

          /*
           * Permite scroll quando o gesto começa
           * fora de um componente arrastável.
           */
          touch-action: pan-x pan-y;
        }

        .canvas-content {
          width: 100%;

          min-width: 0;

          padding: 16px;

          box-sizing: border-box;
        }

        .canvas-grid {
          width: 100%;

          min-width: 0;

          grid-template-columns: repeat(12, minmax(0, 1fr));

          grid-auto-rows: 70px;

          gap: 8px;
        }

        .empty-message {
          width: calc(100% - 32px);

          max-width: 280px;

          font-size: 13px;
        }
      }

      /*
       * ==================================================
       * MOBILE PEQUENO
       * ==================================================
       */

      @media (max-width: 400px) {
        .toolbar {
          padding: 7px 8px;

          gap: 6px;
        }

        .toolbar-title {
          font-size: 13px;
        }

        .toolbar button {
          min-height: 38px;

          padding: 7px 10px;

          font-size: 12px;
        }

        .toolbar .projects label {
          display: none;
        }

        .toolbar .projects select {
          min-height: 38px;

          font-size: 12px;
        }

        .canvas-content {
          padding: 10px;
        }

        .canvas-grid {
          grid-auto-rows: 60px;

          gap: 6px;
        }
      }

      /* @MODULE: WORKSPACE:CSS:END */

      /* ==================================================
       @MODULE: CANVAS_COMPONENTS:CSS:START
    ================================================== */

      .canvas-component {
        min-width: 0;
        min-height: 0;

        padding: 2px;

        border: 2px solid transparent;

        background: #202428;

        cursor: grab;

        overflow: hidden;

        box-sizing: border-box;

        /*
         * ==================================================
         * TOUCH / POINTER EVENTS
         * ==================================================
         *
         * Muito importante para dispositivos móveis.
         *
         * O navegador precisa saber ANTES do movimento
         * que este elemento pode ser arrastado.
         *
         * Não devemos depender de adicionar uma classe
         * depois que o gesto começou.
         *
         * ==================================================
         */

        touch-action: none;

        user-select: none;

        -webkit-user-select: none;

        -webkit-touch-callout: none;
      }

      .canvas-component:active {
        cursor: grabbing;
      }

      .canvas-component:hover {
        border-color: black;
      }

      .canvas-component.dragging {
        opacity: 0.25;
      }

      .canvas-component.mobile-dragging {
        cursor: grabbing;

        opacity: 0.25;

        touch-action: none;
      }

      .canvas-component label {
        display: block;

        margin-bottom: 5px;
        color: rgb(222, 226, 230);
      }

      .canvas-component input,
      .canvas-component select {
        width: 100%;

        min-width: 0;

        padding: 6px 12px;

        border: 1px solid #495057;

        font-size: 14px;

        box-sizing: border-box;

        background: rgb(33, 37, 41);

        color: rgb(222, 226, 230);

        border-radius: 6px;
      }

      .canvas-component input:focus {
        color: #dee2e6;
        background-color: #212529;
        border-color: rgb(52.5490196078%, 71.568627451%, 99.6078431373%);
        outline: 0;
        box-shadow:
          inset 0 1px 2px rgba(0, 0, 0, 0.075),
          0 0 0 0.25rem rgba(13, 110, 253, 0.25);
      }

      .canvas-component button {
        padding: 10px 18px;

        border: 0;

        border-radius: 7px;

        cursor: pointer;

        width: 100%;

        background: #2563eb;

        color: white;

        font-weight: bold;

        box-sizing: border-box;

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);

        transition:
          background 0.2s ease,
          transform 0.15s ease,
          box-shadow 0.2s ease;
      }

      .canvas-component button:hover {
        background: #1d4ed8;

        transform: translateY(-1px);

        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      }

      .canvas-component button:active {
        transform: translateY(0);

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .editable-label {
        cursor: text;

        border-radius: 3px;

        padding: 2px 4px;
      }

      .editable-label:hover {
        background: #4c4545;
      }

      .label-editor {
        width: 100%;

        margin-bottom: 5px;

        padding: 4px;

        border: 1px solid #4285f4;

        border-radius: 4px;

        font: inherit;

        outline: none;

        box-sizing: border-box;

        touch-action: auto;

        user-select: text;

        -webkit-user-select: text;
      }

      /*
       * ==================================================
       * PAINEL
       * ==================================================
       */

      .canvas-component[data-component="panel"] {
        display: flex;

        flex-direction: column;

        width: 100%;

        min-width: 0;
        max-width: 100%;

        height: max-content;

        min-height: 120px;

        padding: 12px;

        background: #202428;

        box-sizing: border-box;

        contain: inline-size;

        border-top: 3px solid #0d6efd;

        box-shadow:
          0 0 1px rgba(222, 226, 230, 0.125),
          0 1px 3px rgba(222, 226, 230, 0.2);

        border-radius: 0.375rem;
      }

      .canvas-component.selected {
        border: 2px solid black;
      }

      /*
       * ==================================================
       * CONTEÚDO DO PAINEL
       * ==================================================
       */

      .panel-content {
        display: grid;

        grid-template-columns: repeat(12, minmax(0, 1fr));

        grid-auto-rows: minmax(40px, max-content);

        grid-auto-flow: row;

        width: 100%;

        min-width: 0;

        max-width: 100%;

        flex: 0 0 auto;

        min-height: 0;

        padding: 0;

        background: #202428;

        height: max-content;

        align-content: start;

        box-sizing: border-box;

        overflow: hidden;
      }

      /*
       * ==================================================
       * COMPONENTES DENTRO DO PAINEL
       * ==================================================
       */

      .canvas-component[data-component="panel"]
        > .panel-content
        > .canvas-component {
        width: 100%;

        min-width: 0;

        max-width: 100%;

        margin: 0;

        height: max-content;

        min-height: 0;

        align-self: start;

        box-sizing: border-box;
      }

      /*
       * ==================================================
       * INPUTS E SELECTS DENTRO DO PAINEL
       * ==================================================
       */

      .canvas-component[data-component="panel"]
        > .panel-content
        > .canvas-component
        input,
      .canvas-component[data-component="panel"]
        > .panel-content
        > .canvas-component
        select {
        display: block;

        width: 100%;

        min-width: 0;

        max-width: 100%;

        box-sizing: border-box;
      }

      /*
       * ==================================================
       * BOTÕES DENTRO DO PAINEL
       * ==================================================
       */

      .canvas-component[data-component="panel"]
        > .panel-content
        > .canvas-component
        button {
        width: 100%;

        max-width: 100%;

        box-sizing: border-box;
      }

      /*
       * ==================================================
       * PAINEL SELECIONADO
       * ==================================================
       */

      .canvas-component[data-component="panel"].selected > .panel-content {
        border-color: #4285f4;
      }

      /*
       * ==================================================
       * PAINEL VAZIO
       * ==================================================
       */

      .canvas-component[data-component="panel"] > .panel-content:empty {
        min-height: 80px;
      }

      /*
       * ==================================================
       * ELEMENTOS INTERATIVOS
       * ==================================================
       *
       * Inputs, selects e buttons precisam continuar
       * recebendo interação normal.
       *
       * O próprio JS também ignora esses elementos
       * no pointerdown.
       *
       * ==================================================
       */

      .canvas-component input,
      .canvas-component select,
      .canvas-component textarea,
      .canvas-component button {
        touch-action: auto;

        -webkit-touch-callout: default;
      }

      .canvas-component input,
      .canvas-component select,
      .canvas-component textarea {
        user-select: auto;

        -webkit-user-select: auto;
      }

      /*
       * ==================================================
       * RESPONSIVIDADE MOBILE
       * ==================================================
       */

      @media (max-width: 768px) {
        .canvas-component input,
        .canvas-component select {
          min-height: 40px;

          padding: 8px 10px;

          font-size: 14px;
        }

        .canvas-component button {
          min-height: 40px;

          padding: 9px 12px;

          font-size: 14px;
        }

        .canvas-component[data-component="panel"] {
          min-height: 100px;

          padding: 8px;
        }

        .panel-content {
          grid-auto-rows: minmax(40px, max-content);

          gap: 6px;
        }

        /*
         * O touch-action já está definido fora
         * do media query para funcionar desde o
         * início do gesto.
         */

        .canvas-component {
          cursor: grab;

          touch-action: none;

          user-select: none;

          -webkit-user-select: none;

    <script>
      const ENV = {
        mode: "dev",

        isDev() {
          return this.mode === "dev";
        },

        isProd() {
          return this.mode === "prod";
        },

        setMode(mode) {
          if (mode !== "dev" && mode !== "prod") {
            throw new Error(`Modo inválido: ${mode}`);
          }

          this.mode = mode;
        },
      };

      /*
       * ==================================================
       * GERAR UUID
       * ==================================================
       *
       * Usa crypto.randomUUID() quando disponível.
       *
       * Em navegadores que não possuem essa função,
       * utiliza um fallback compatível.
       *
       * ==================================================
       */

      function generateUUID() {
        if (
          typeof crypto !== "undefined" &&
          typeof crypto.randomUUID === "function"
        ) {
          return crypto.randomUUID();
        }

        /*
         * ==================================================
         * FALLBACK
         * ==================================================
         */

        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
          /[xy]/g,
          (character) => {
            const random = Math.floor(Math.random() * 16);

            const value = character === "x" ? random : (random & 0x3) | 0x8;

            return value.toString(16);
          },
        );
      }
    </script>

    <script>
      /*
       * ==================================================
       * COMPONENTS:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - renderizar o HTML interno dos componentes
       * - criar componentes
       * - reconstruir componentes
       * - atualizar componentes sem perder os filhos
       *
       * IMPORTANTE:
       *
       * createComponent() cria somente o componente.
       *
       * A reconstrução dos filhos de Panels é feita
       * pelos módulos responsáveis por carregar dados:
       *
       * - SCREENS:JS
       * - STORAGE:JS
       *
       * Isso evita que os filhos sejam criados duas vezes.
       *
       * ==================================================
       */

      function renderComponentHTML(type, data = {}) {
        if (type === "input") {
          /*
           * ==================================================
           * PLACEHOLDER
           * ==================================================
           */

          const placeholder =
            data.placeholder !== undefined && data.placeholder !== null
              ? String(data.placeholder)
              : "";

          /*
           * ==================================================
           * LABEL
           * ==================================================
           */

          const label =
            data.label !== undefined && data.label !== null
              ? String(data.label)
              : "Input";

          return `
    <label class="editable-label">
      ${label}
    </label>

    <input
      type="text"
      data-input-id="${data.id || ""}"
      placeholder="${placeholder}"
    >
  `;
        }

        if (type === "dropdown") {
          return `
    <label class="editable-label">
      ${data.label || "Dropdown"}
    </label>

    <select>
      <option>Opção 1</option>
      <option>Opção 2</option>
      <option>Opção 3</option>
    </select>
  `;
        }

        if (type === "button") {
          const buttonText =
            data.buttonText !== undefined && data.buttonText !== null
              ? String(data.buttonText)
              : "Botão";

          return `
    <button type="button">
      ${buttonText}
    </button>
  `;
        }

        if (type === "panel") {
          return `
    <div class="panel-content"></div>
  `;
        }

        return `
  <p>
    Texto
  </p>
`;
      }

      /*
       * ==================================================
       * APLICAR POSIÇÃO
       * ==================================================
       */

      function applyComponentPosition(element) {
        if (!element) {
          return;
        }

        const row = Number(element.dataset.row) || 1;

        const column = Number(element.dataset.column) || 1;

        const columns = Number(element.dataset.columns) || 3;

        element.style.gridRow = row;

        element.style.gridColumn = `${column} / span ${columns}`;
      }

      /*
       * ==================================================
       * CRIAR COMPONENTE
       * ==================================================
       *
       * IMPORTANTE:
       *
       * Esta função precisa permanecer GLOBAL.
       *
       * O SCREENS:JS utiliza:
       *
       * createComponent(data.type, data)
       *
       * Portanto NÃO colocar esta função dentro
       * de outro escopo, objeto ou callback.
       *
       * ==================================================
       */

      function createComponent(type, data = {}) {
        const element = document.createElement("div");

        element.className = "canvas-component";

        element.draggable = true;

        element.dataset.component = type;

        /*
         * ==================================================
         * GRID
         * ==================================================
         */

        element.dataset.row = Number(data.row) || 1;

        element.dataset.column = Number(data.column) || 1;

        element.dataset.columns = Number(data.columns) || 3;

        /*
         * ==================================================
         * INPUT / DROPDOWN
         * ==================================================
         */

        if (type === "input" || type === "dropdown") {
          element.dataset.label =
            data.label || (type === "input" ? "Input" : "Dropdown");

          /*
           * ==================================================
           * PLACEHOLDER
           * ==================================================
           */

          element.dataset.placeholder =
            data.placeholder !== undefined && data.placeholder !== null
              ? String(data.placeholder)
              : "";
        }

        /*
         * ==================================================
         * INPUT
         * ==================================================
         */

        if (type === "input") {
          element.dataset.id = data.id || generateUUID();

          /*
           * ==================================================
           * VALIDAÇÃO
           * ==================================================
           *
           * Valores antigos que ainda não possuem essas
           * propriedades continuam funcionando normalmente.
           *
           * ==================================================
           */

          element.dataset.required =
            data.required === true || data.required === "true"
              ? "true"
              : "false";

          /*
           * ==================================================
           * TIPO DE VALIDAÇÃO
           * ==================================================
           *
           * Valores possíveis:
           *
           * none
           * personName
           * email
           *
           * Componentes antigos recebem "none".
           *
           * ==================================================
           */

          element.dataset.validationType =
            data.validationType || data.inputValidationType || "none";

          /*
           * ==================================================
           * MÍNIMO
           * ==================================================
           */

          element.dataset.minLength =
            Number.isFinite(Number(data.minLength)) &&
            Number(data.minLength) > 0
              ? String(Math.floor(Number(data.minLength)))
              : "0";

          /*
           * ==================================================
           * MÁXIMO
           * ==================================================
           */

          element.dataset.maxLength =
            Number.isFinite(Number(data.maxLength)) &&
            Number(data.maxLength) > 0
              ? String(Math.floor(Number(data.maxLength)))
              : "0";

          /*
           * ==================================================
           * MENSAGEM DE VALIDAÇÃO
           * ==================================================
           */

          element.dataset.validationMessage =
            data.validationMessage !== undefined &&
            data.validationMessage !== null
              ? String(data.validationMessage)
              : "";
        }

        /*
         * ==================================================
         * BUTTON
         * ==================================================
         */

        if (type === "button") {
          element.dataset.buttonText =
            data.buttonText !== undefined && data.buttonText !== null
              ? String(data.buttonText)
              : "Botão";

          element.dataset.inputs = JSON.stringify(
            Array.isArray(data.inputs) ? data.inputs : [],
          );

          element.dataset.action = data.action || "none";

          element.dataset.actionScreen = data.actionScreen || "";

          /*
           * ==================================================
           * TABELA
           * ==================================================
           *
           * Mantém a tabela salva no botão.
           *
           * ==================================================
           */

          element.dataset.table =
            data.table !== undefined && data.table !== null
              ? String(data.table)
              : "";
        }

        /*
         * ==================================================
         * PANEL
         * ==================================================
         */

        if (type === "panel") {
          element.dataset.label = data.label || "Painel";
        }

        /*
         * ==================================================
         * CRIA HTML
         * ==================================================
         *
         * Somente a estrutura própria do componente.
         *
         * Os filhos do Panel NÃO são criados aqui.
         *
         * ==================================================
         */

        element.innerHTML = renderComponentHTML(type, element.dataset);

        /*
         * ==================================================
         * APLICA POSIÇÃO
         * ==================================================
         */

        applyComponentPosition(element);

        return element;
      }

      /*
       * ==================================================
       * ATUALIZAR COMPONENTE
       * ==================================================
       *
       * IMPORTANTE:
       *
       * Nunca destrói os filhos de um Panel.
       *
       * O HTML externo é reconstruído e os filhos
       * existentes são recolocados no novo .panel-content.
       *
       * ==================================================
       */

      function updateComponent(element) {
        if (!element) {
          return;
        }

        const isPanel = element.dataset.component === "panel";

        /*
         * ==================================================
         * GUARDA OS FILHOS ATUAIS
         * ==================================================
         */

        const children = isPanel
          ? [
              ...(element.querySelector(":scope > .panel-content")?.children ||
                []),
            ]
          : [];

        /*
         * ==================================================
         * RECONSTRÓI SOMENTE A ESTRUTURA VISUAL
         * ==================================================
         */

        element.innerHTML = renderComponentHTML(
          element.dataset.component,
          element.dataset,
        );

        /*
         * ==================================================
         * RESTAURA POSIÇÃO
         * ==================================================
         */

        applyComponentPosition(element);

        /*
         * ==================================================
         * RECOLOCA OS FILHOS DO PANEL
         * ==================================================
         */

        if (isPanel) {
          const content = element.querySelector(":scope > .panel-content");

          if (content) {
            children.forEach((child) => {
              content.appendChild(child);
            });
          }
        }
      }
    </script>

    <!-- @MODULE: COMPONENTS:JS:END -->

    <!-- ==================================================
     @MODULE: GRID:JS:START
================================================== -->

    <script>
      /*
       * ==================================================
       * GRID:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - verificar ocupação de componentes
       * - calcular posição do mouse
       * - validar posição de componentes
       *
       * Funciona tanto no:
       *
       * - DOM.grid
       * - .panel-content
       *
       * ==================================================
       */

      /*
       * ==================================================
       * VERIFICAR OCUPAÇÃO
       * ==================================================
       */

      function isOccupied(
        row,
        column,
        span,
        ignore = null,
        container = DOM.grid,
      ) {
        if (!container) {
          return false;
        }

        return [...container.children].some((element) => {
          /*
           * Preview não conta como ocupação.
           */

          if (element === EditorState.preview || element === ignore) {
            return false;
          }

          /*
           * Somente componentes contam.
           */

          if (!element.classList.contains("canvas-component")) {
            return false;
          }

          const elementRow = Number(element.dataset.row);

          const elementColumn = Number(element.dataset.column);

          const elementSpan = Number(element.dataset.columns);

          if (elementRow !== row) {
            return false;
          }

          return (
            column < elementColumn + elementSpan &&
            column + span > elementColumn
          );
        });
      }

      /*
       * ==================================================

    <script>
      /*
       * ==================================================
       * SCREENS:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - criar telas
       * - selecionar telas
       * - excluir telas
       * - listar telas
       * - carregar a tela atual
       * - manter EditorState.currentScreen
       * - manter EditorState.currentScreenId
       * - persistir a última tela aberta
       * - persistir criação de novas telas
       * - compatibilidade com projetos antigos
       * - reconstruir componentes filhos de Panels
       *
       * ==================================================
       */

      const ScreenManager = {
        /*
         * ==================================================
         * CRIAR
         * ==================================================
         */

        async create(name = "Nova Tela") {
          const project = EditorState.currentProject;

          if (!project) {
            alert("Nenhum projeto está aberto.");
            return null;
          }

          if (!Array.isArray(project.screens)) {
            project.screens = [];
          }

          const screenName = String(name).trim() || "Nova Tela";

          const exists = project.screens.some((screen) => {
            return (
              String(screen.name).toLowerCase() === screenName.toLowerCase()
            );
          });

          if (exists) {
            alert(`Já existe uma tela chamada "${screenName}".`);

            return null;
          }

          /*
           * ==================================================
           * CRIA A NOVA TELA
           * ==================================================
           */

          const screen = {
            id: generateUUID(),

            name: screenName,

            components: [],
          };

          project.screens.push(screen);

          /*
           * ==================================================
           * TORNA A NOVA TELA A ATUAL
           * ==================================================
           */

          EditorState.currentScreen = screen;

          EditorState.currentScreenId = screen.id;

          /*
           * ==================================================
           * ATUALIZA INTERFACE
           * ==================================================
           */

          renderScreenList();

          renderCurrentScreen();

          /*
           * ==================================================
           * SALVA AUTOMATICAMENTE
           * ==================================================
           *
           * A nova tela precisa ser persistida imediatamente.
           *
           * Além disso, como ela se tornou a tela atual,
           * o ProjectStorage.save() também registra:
           *
           * EditorState.currentScreenId
           *
           * Dessa forma, ao dar F5, a nova tela continuará
           * sendo a tela aberta.
           *
           * ==================================================
           */

          if (!ENV.isProd() && typeof ProjectStorage !== "undefined") {
            const projectName = project.name;

            if (projectName) {
              try {
                const savedProject = await ProjectStorage.save(projectName);

                /*
                 * Mantém o projeto salvo como projeto atual.
                 */

                EditorState.currentProject = savedProject;

                /*
                 * Recupera a referência da nova tela
                 * dentro do projeto que acabou de ser salvo.
                 */

                const savedScreen = savedProject.screens?.find(
                  (savedScreen) => savedScreen.id === screen.id,
                );

                if (savedScreen) {
                  EditorState.currentScreen = savedScreen;

                  EditorState.currentScreenId = savedScreen.id;
                }

                /*
                 * Atualiza novamente a lista para garantir
                 * que o estado visual corresponda ao projeto
                 * persistido.
                 */

                renderScreenList();

                console.log(
                  `Projeto "${projectName}" salvo após criar a tela "${screenName}".`,
                );
              } catch (error) {
                console.error("Erro ao salvar projeto após criar tela:", error);

                alert(
                  "A tela foi criada, mas não foi possível salvar o projeto.",
                );
              }
            }
          }

          return screen;
        },

        /*
         * ==================================================
         * SELECT
         * ==================================================
         *
         * Seleciona uma tela e persiste essa escolha.
         *
         * Cada projeto mantém sua própria última tela aberta
         * porque a informação fica armazenada dentro do próprio
         * registro do projeto no IndexedDB.
         *
         * ==================================================
         */

        async select(id) {
          const project = EditorState.currentProject;

          if (!project || !Array.isArray(project.screens)) {
            return;
          }

          const screen = project.screens.find((item) => {
            return item.id === id;
          });

          if (!screen) {
            return;
          }

          /*
           * ==================================================
           * ATUALIZA ESTADO
           * ==================================================
           */

          EditorState.currentScreen = screen;

          EditorState.currentScreenId = screen.id;

          /*
           * ==================================================
           * ATUALIZA INTERFACE
           * ==================================================

           * ==================================================

                  EditorState.currentScreen = savedScreen;
                }

                  `Última tela aberta do projeto "${projectName}" salva.`,

            EditorState.currentScreen = nextScreen;

            EditorState.currentScreenId = nextScreen.id;

          renderScreenList();

          renderCurrentScreen();

           * SALVA AUTOMATICAMENTE
           * ==================================================

          if (!ENV.isProd() && typeof ProjectStorage !== "undefined") {
            const projectName = project.name;

            if (projectName) {
              try {
                const savedProject = await ProjectStorage.save(projectName);

                EditorState.currentProject = savedProject;

                /*
                 * Recupera a tela atual salva.
                 */

                const savedScreen = savedProject.screens?.find(
                  (savedScreen) =>
                    savedScreen.id === EditorState.currentScreenId,
                );

                if (savedScreen) {
                  EditorState.currentScreen = savedScreen;
                }

                console.log(
                  `Projeto "${projectName}" salvo após excluir a tela.`,
                );
              } catch (error) {
                console.error(
                  "Erro ao salvar projeto após excluir tela:",
                  error,
                );

                alert(
                  "A tela foi excluída, mas não foi possível salvar o projeto.",

            }

        /*
         * ==================================================
         * RENDER LIST

         */

        renderList() {
          if (!DOM.screenList) {
            return;
          }

          const project = EditorState.currentProject;

          DOM.screenList.replaceChildren();

          if (!project || !Array.isArray(project.screens)) {
            return;
          }

          project.screens.forEach((screen) => {
            const item = document.createElement("div");

            item.className = "screen-item";

            item.dataset.screenId = screen.id;

            if (EditorState.currentScreenId === screen.id) {
              item.classList.add("active");
            }

            /*
             * ==================================================
             * NOME
             * ==================================================
             */

            const name = document.createElement("span");

            name.className = "screen-name";

            name.textContent = screen.name;

             * EXCLUIR
             * ==================================================
             */

            const deleteButton = document.createElement("button");

            deleteButton.type = "button";

            deleteButton.className = "screen-delete";

            deleteButton.title = "Excluir tela";

              event.stopPropagation();

              ScreenManager.delete(screen.id);

            /*
             * ==================================================
             * ITEM
             * ==================================================

            item.appendChild(name);

        /*

          component.dataset.row = Number(data.row) || 1;

          component.dataset.column = Number(data.column) || 1;

          component.dataset.columns = Number(data.columns) || 1;

          /*

           * INPUT / DROPDOWN
           * ==================================================

          if (data.type === "input" || data.type === "dropdown") {

      /*
       * ==================================================

       * Essa função é importante porque o STORAGE:JS
       * chama loadCurrentScreen() depois de carregar
       * um projeto.
       *
       * ==================================================
       */

      function loadCurrentScreen() {
        const project = EditorState.currentProject;

        /*
         * ==================================================
         * NENHUM PROJETO
         * ==================================================
         */

        if (!project) {
          EditorState.currentScreen = null;

          EditorState.currentScreenId = null;

          renderScreenList();

          renderCurrentScreen();

          return;
        }

        /*
         * ==================================================
         * COMPATIBILIDADE COM PROJETOS ANTIGOS
         * ==================================================
         */

        if (!Array.isArray(project.screens)) {
          project.screens = [];
        }

        /*
         * Projeto antigo pode possuir:
         *
         * project.components
         *
         * em vez de:
         *
         * project.screens
         */

        if (!project.screens.length) {
          const screen = {
            id: generateUUID(),

            name: "Tela Inicial",

            components: [],
          };

          if (Array.isArray(project.components)) {
            screen.components = project.components;

            delete project.components;
          }

          project.screens.push(screen);
        }

        /*
         * ==================================================
         * PROCURA PELA TELA ATUAL
         * ==================================================
         */

        let screen = null;

        /*
         * Primeiro pela ID.
         */

        if (EditorState.currentScreenId) {
          screen = project.screens.find((item) => {
            return item.id === EditorState.currentScreenId;
          });
        }

        /*
         * Depois pela referência.
         */

        if (
          !screen &&
          EditorState.currentScreen &&
          EditorState.currentScreen.id
        ) {
          screen = project.screens.find((item) => {
            return item.id === EditorState.currentScreen.id;
          });
        }

        /*
         * ==================================================
         * FALLBACK
         * ==================================================
         *
         * Se a última tela não existe mais,
         * usa a primeira tela.
         * Isso é importante principalmente quando
         * a última tela foi excluída.
         */

        if (!screen) {
          screen = project.screens[0];
        }

        /*
         * ==================================================
         * ATUALIZA ESTADO GLOBAL
         * ==================================================
         */

        EditorState.currentScreen = screen;

        EditorState.currentScreenId = screen.id;

        /*
         * ==================================================
         * RENDERIZA
         * ==================================================
         */

        renderScreenList();

        renderCurrentScreen();
      }

      /*
       * ==================================================
       * NOVA TELA
       * ==================================================
       */

      async function createNewScreen() {
        if (ENV.isProd()) {
          return;
        }

        if (!EditorState.currentProject) {
          alert("Nenhum projeto está aberto.");

          return;
        }

        const name = prompt("Nome da nova tela:", "Nova Tela");

        if (name === null) {
          return;
        }

        const screenName = name.trim();

        if (!screenName) {
          alert("Informe um nome para a tela.");

          return;
        }

        await ScreenManager.create(screenName);
      }

      /*
       * ==================================================
       * FUNÇÕES GLOBAIS
       * ==================================================
       */

      function renderScreenList() {
        ScreenManager.renderList();
      }

      function renderCurrentScreen() {
        ScreenManager.renderCurrent();
      }

      function selectScreen(id) {
        ScreenManager.select(id);
      }

      function deleteScreen(id) {
        ScreenManager.delete(id);
      }

      /*
       * ==================================================
       * BOTÃO NOVA TELA
       * ==================================================
       */

      if (DOM.newScreenButton) {
        DOM.newScreenButton.addEventListener("click", createNewScreen);
      }

    <script>

       * ==================================================
       *
       * Responsável por:
       *
       * - serializar componentes

       * - normalizar telas
       * - normalizar projetos
       * - reconstruir componentes
       * - carregar a tela atual
       *
       * ==================================================
       */

      const ProjectComponents = {
        /*
         * ==================================================
         * SERIALIZAR GRID ATUAL
         * ==================================================
         */

        serializeCurrentGrid() {
          if (!DOM.grid) {
            return [];
          }

          return [...DOM.grid.children]
            .filter((element) => element !== EditorState.preview)
            .filter((element) => element.classList.contains("canvas-component"))
            .map((element) => this.serializeComponent(element))
            .filter(Boolean);
        },

        /*
         * ==================================================
         * SERIALIZAR COMPONENTE
         * ==================================================
         */

        serializeComponent(element) {
          if (!element) {
            return null;
          }

          const type = element.dataset.component || null;

          const component = {
            type,

            id: element.dataset.id || null,

            row: Number(element.dataset.row) || 1,

            column: Number(element.dataset.column) || 1,

            columns: Number(element.dataset.columns) || 1,

            label: element.dataset.label || "",

            placeholder:
              element.dataset.placeholder !== undefined &&
              element.dataset.placeholder !== null
                ? String(element.dataset.placeholder)
                : "",

            buttonText:
              element.dataset.buttonText !== undefined &&
              element.dataset.buttonText !== null
                ? String(element.dataset.buttonText)
                : element.dataset.component === "button"
                  ? "Botão"
                  : "",

            inputs: this.parseInputs(element.dataset.inputs),

            table:
              element.dataset.table !== undefined &&
              element.dataset.table !== null
                ? String(element.dataset.table)
                : "",

            action: element.dataset.action || "none",

            actionScreen: element.dataset.actionScreen || "",
          };

          /*
           * ==================================================
           * VALIDAÇÕES DO INPUT
           * ==================================================
           *
           * Todas as propriedades de validação são
           * serializadas aqui.
           *
           * ==================================================
           */

          if (type === "input") {
            /*
             * ==================================================
             * OBRIGATÓRIO
             * ==================================================
             */

            component.required = element.dataset.required === "true";

            /*
             * ==================================================
             * TIPO DE VALIDAÇÃO
             * ==================================================
             *
             * Valores:
             *
             * none
             * personName
             * email
             *
             * ==================================================
             */

            component.validationType =
              element.dataset.validationType ||
              element.dataset.inputValidationType ||
              "none";

            /*
             * ==================================================
             * MÍNIMO
             * ==================================================
             */

            component.minLength =
              Number.isFinite(Number(element.dataset.minLength)) &&
              Number(element.dataset.minLength) > 0
                ? Math.floor(Number(element.dataset.minLength))
                : 0;

            /*
             * ==================================================
             * MÁXIMO
             * ==================================================
             */

            component.maxLength =
              Number.isFinite(Number(element.dataset.maxLength)) &&
              Number(element.dataset.maxLength) > 0
                ? Math.floor(Number(element.dataset.maxLength))
                : 0;

            /*
             * ==================================================
             * MENSAGEM DE VALIDAÇÃO
             * ==================================================
             */

            component.validationMessage =
              element.dataset.validationMessage !== undefined &&
              element.dataset.validationMessage !== null
                ? String(element.dataset.validationMessage)
                : "";
          }

          /*
           * ==================================================
           * FILHOS DO PANEL
           * ==================================================
           */

          if (type === "panel") {
            const content = element.querySelector(":scope > .panel-content");

              ? [...content.children]
                  .filter((child) => child !== EditorState.preview)
                  .filter((child) =>

                  .map((child) => this.serializeComponent(child))
                  .filter(Boolean)
              : [];
          }

          return component;
        },

        /*
         * ==================================================
         * NORMALIZAR TELA
         * ==================================================

        sanitizeScreen(screen) {
          if (!screen) {

          }

          const components = Array.isArray(screen.components)

          /*
           * ==================================================
           * IDS DOS FILHOS DOS PANELS
           * ==================================================

          const collectChildIds = (component) => {
            if (!component) {

            }

            if (Array.isArray(component.children)) {
              component.children.forEach((child) => {
                if (child?.id) {
                  childIds.add(child.id);
                }

                collectChildIds(child);
              });
            }
          };

          components.forEach(collectChildIds);

          /*
           * ==================================================
           * IDS JÁ UTILIZADOS
           * ==================================================
           */

          const usedIds = new Set();

          /*
           * ==================================================
           * SANITIZAR COMPONENTES
           * ==================================================
           */

          const sanitizeComponents = (items, isRoot = false) => {
            const result = [];

            items.forEach((component) => {
              if (!component || !component.type) {
                return;
              }

              /*
               * Filho de Panel não pode aparecer
               * novamente na raiz.
               */

              if (isRoot && component.id && childIds.has(component.id)) {
                return;
              }

              /*
               * Evita IDs duplicados.

              if (component.id && usedIds.has(component.id)) {
                return;

              if (component.id) {
                usedIds.add(component.id);

              const clean = this.cloneComponent(component);

              if (Array.isArray(clean.children)) {

            /*

          /*
           * ==================================================
           * BOTÃO
           * ==================================================
           */

          if (component.type === "button") {

              component.buttonText !== undefined &&
              component.buttonText !== null
                ? String(component.buttonText)
                : "Botão";

            /*
             * Mantém a tabela do botão.

            cloned.table =

            /*

            cloned.inputs = Array.isArray(component.inputs)

          /*

           * FILHOS
           * ==================================================

          if (Array.isArray(component.children)) {

          applyComponentPosition(component);

           * ==================================================
           * FILHOS DO PANEL
           * ==================================================
           */

          if (data.type === "panel" && Array.isArray(data.children)) {
            const content = component.querySelector(":scope > .panel-content");

            if (content) {
              data.children.forEach((childData) => {
                const child = this.createComponentFromData(childData);

                if (!child) {
                  return;
                }

                content.appendChild(child);
              });
            }
          }

          return component;
        },

        /*
         * ==================================================
         * CARREGAR TELA ATUAL
         * ==================================================
         */

        loadCurrentScreen() {
          if (!DOM.grid) {
            return;
          }

          const project = EditorState.currentProject;

          if (!project || !Array.isArray(project.screens)) {
            return;
          }

          const screen = project.screens.find(
            (item) => item.id === EditorState.currentScreenId,
          );

          if (!screen) {
            return;
          }

          EditorState.currentScreen = screen;

          /*
           * ==================================================
           * REMOVE COMPONENTES DO GRID
           * ==================================================
           */

          DOM.grid
            .querySelectorAll(":scope > .canvas-component")
            .forEach((element) => element.remove());

          /*
           * ==================================================
           * LIMPA SELEÇÃO
           * ==================================================
           */

          if (DOM.propertyForm) {
            DOM.propertyForm.style.display = "none";
          }

          if (DOM.noSelection) {
            DOM.noSelection.style.display = "block";
          }

          EditorState.selected = null;

          /*
           * ==================================================
           * RECONSTRÓI COMPONENTES
           * ==================================================
           */

          screen.components.forEach((data) => {
            const component = this.createComponentFromData(data);

            if (!component) {
              return;
            }

            DOM.grid.appendChild(component);
          });

          /*
           * ==================================================
           * ATUALIZA LISTA DE TELAS
           * ==================================================
           */

          renderScreenList();

          /*
           * ==================================================
           * MENSAGEM DE GRID VAZIO
           * ==================================================
           */

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }
        },

        /*
         * ==================================================
         * ID DE TELA
         * ==================================================
         */

        createScreenId() {
          return "screen-" + generateUUID();
        },
      };
    </script>
