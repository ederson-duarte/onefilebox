<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>One File Box</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;

        font-family: Arial, sans-serif;

        background: #f5f5f5;
        color: #222;
      }

      .app {
        display: flex;
        height: 100vh;
      }

      /* ==================================================
       @MODULE: COMPONENTS_PANEL:CSS:START
    ================================================== */

      .components-panel {
        width: 260px;
        flex-shrink: 0;

        display: flex;
        flex-direction: column;

        background: #1e1e1e;
        color: white;

        border-right: 1px solid #333;

        overflow: hidden;
      }

      .components-header {
        padding: 10px;
        font-size: 12px;
        font-weight: bold;
        border-bottom: 1px solid #333;
      }

      .components-list {
        padding: 12px;

        display: grid;
        grid-template-columns: 1fr 1fr;

        gap: 8px;
      }

      .component {
        padding: 10px;

        background: #2a2a2a;

        border: 1px solid #3a3a3a;

        cursor: grab;

        user-select: none;

        font-size: 14px;
      }

      .component:hover {
        background: #333;
      }

      .component:active {
        cursor: grabbing;
      }

      /* @MODULE: COMPONENTS_PANEL:CSS:END */
      /* ==================================================
       @MODULE: PROPERTIES:CSS:START
    ================================================== */
      .properties {
        margin-top: auto;

        padding: 10px;

        border-top: 1px solid #333;

        overflow-y: auto;
      }

      .properties-title {
        margin-bottom: 15px;
        font-size: 12px;
        font-weight: bold;
      }

      /*
 * ==================================================
 * TELAS
 * ==================================================
 */

      .screens {
        margin-bottom: 15px;
      }

      .screens-title {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 8px;

        font-size: 12px;
        font-weight: bold;

        color: white;
      }

      .screens-list {
        display: flex;
        flex-direction: column;

        gap: 3px;

        margin-bottom: 8px;
      }

      .screen-item {
        display: flex;
        align-items: center;
        justify-content: space-between;

        width: 100%;

        padding: 7px 8px;

        border: 0;
        border-radius: 4px;

        background: transparent;

        color: #bbb;

        font-size: 12px;

        text-align: left;

        cursor: pointer;
      }

      .screen-item:hover {
        background: #2a2a2a;
        color: white;
      }

      .screen-item.active {
        background: #333;
        color: white;
      }

      .screen-item-name {
        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
      }

      .screen-item-delete {
        flex-shrink: 0;

        width: 20px;
        height: 20px;

        padding: 0;

        border: 0;

        background: transparent;

        color: #888;

        font-size: 14px;

        cursor: pointer;
      }

      .screen-item-delete:hover {
        color: #ff5555;
      }

      .create-screen-button {
        width: 100%;

        padding: 7px 8px;

        border: 1px solid #444;
        border-radius: 5px;

        background: #2a2a2a;

        color: #ccc;

        font-size: 12px;

        cursor: pointer;
      }

      .create-screen-button:hover {
        background: #333;

        color: white;
      }

      .screen-separator {
        height: 1px;

        margin: 12px 0;

        background: #333;
      }

      /*
 * ==================================================
 * PROPRIEDADES
 * ==================================================
 */

      .no-selection {
        color: #888;

        font-size: 12px;

        line-height: 1.5;
      }

      .property {
        margin-bottom: 12px;
      }

      .property label {
        display: block;

        margin-bottom: 5px;

        font-size: 12px;

        color: #bbb;
      }

      .property input,
      .property select {
        width: 100%;

        padding: 8px;

        border: 1px solid #444;
        border-radius: 5px;

        background: #2a2a2a;

        color: white;

        outline: none;
      }

      .property input:focus,
      .property select:focus {
        border-color: #4285f4;
      }

      /*
 * ==================================================
 * AÇÃO DO BOTÃO
 * ==================================================
 */

      .button-action-property {
        margin-top: 15px;
      }

      .button-action-fields {
        display: none;
      }

      .button-action-fields.visible {
        display: block;
      }
      /* @MODULE: PROPERTIES:CSS:END */

      /* ==================================================
       @MODULE: WORKSPACE:CSS:START
    ================================================== */

      .workspace {
        flex: 1;

        min-width: 0;

        display: flex;
        flex-direction: column;
      }

      .toolbar {
        height: 56px;

        flex-shrink: 0;

        display: flex;
        align-items: center;

        padding: 0 16px;

        border-bottom: 1px solid #000;
        background: #a4754c;
      }

      .toolbar-title {
        font-weight: bold;
      }

      .canvas {
        flex: 1;
        overflow: auto;
        background: black;
      }

      .canvas-content {
        position: relative;

        background: #c78851;

        min-height: 100%;

        min-width: max-content;

        padding: 30px;

        box-sizing: border-box;
      }

      .empty-message {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        color: #000;

        text-align: center;

        pointer-events: none;
      }

      .canvas-grid {
        display: grid;

        grid-template-columns: repeat(12, minmax(0, 1fr));

        grid-auto-rows: 90px;

        gap: 12px;

        width: 100%;

        min-width: 720px;

        min-height: 90px;

        box-sizing: border-box;
      }

      /* @MODULE: WORKSPACE:CSS:END */

      /* ==================================================
       @MODULE: CANVAS_COMPONENTS:CSS:START
    ================================================== */
      /*
 * ==================================================
 * CANVAS_COMPONENTS:CSS
 * ==================================================
 */

      .canvas-component {
        min-width: 0;

        padding: 2px;

        border: 2px solid transparent;

        background: #a4754c;

        cursor: grab;

        overflow: hidden;
      }

      .canvas-component:hover {
        border-color: black;
      }

      .canvas-component.selected {
        border-color: black;
      }

      .canvas-component.dragging {
        opacity: 0.25;
      }

      .canvas-component label {
        display: block;

        margin-bottom: 5px;
      }

      .canvas-component input,
      .canvas-component select {
        width: 100%;

        min-width: 0;

        padding: 5px;

        border: 1px solid #636363;

        font-size: 14px;

        box-sizing: border-box;
      }

      .canvas-component input:focus {
        border: 2px solid black;
        outline: none;
      }

      .canvas-component button {
        padding: 10px 18px;

        border: 0;

        border-radius: 5px;

        cursor: pointer;

        width: 100%;

        background: #1a1a1a;
        color: white;
        font-weight: bold;
      }

      .editable-label {
        cursor: text;

        border-radius: 3px;

        padding: 2px 4px;
      }

      .editable-label:hover {
        background: #e8e8e8;
      }

      .label-editor {
        width: 100%;

        margin-bottom: 5px;

        padding: 4px;

        border: 1px solid #4285f4;

        border-radius: 4px;

        font: inherit;

        outline: none;
      }

      /*
 * ==================================================
 * PAINEL
 * ==================================================
 */

      .canvas-component[data-component="panel"] {
        display: flex;

        flex-direction: column;

        min-height: 180px;

        padding: 12px;

        background: #a4754c;

        border: 1px solid black;

        /*
   * O painel pode crescer verticalmente
   * conforme seus filhos.
   */
        height: max-content;

        min-height: 180px;
      }

      /*
 * ==================================================
 * CONTEÚDO DO PAINEL
 * ==================================================
 */

      .panel-content {
        display: grid;

        grid-template-columns: repeat(12, minmax(0, 1fr));

        /*
   * Cada linha cresce conforme o maior
   * componente daquela linha.
   */
        grid-auto-rows: minmax(40px, auto);

        /*
   * Permite que novas linhas sejam criadas
   * indefinidamente.
   */
        grid-auto-flow: row;

        flex: 1;

        width: 100%;

        min-height: 120px;

        padding: 0px;

        background: #f8f8f8;

        /*
   * O conteúdo pode crescer verticalmente.
   */
        height: max-content;

        align-content: start;

        box-sizing: border-box;
      }

      /*
 * ==================================================
 * COMPONENTES DENTRO DO PAINEL
 * ==================================================
 */

      .canvas-component[data-component="panel"]
        > .panel-content
        > .canvas-component {
        width: auto;

        min-width: 0;

        margin: 0;

        /*
   * Permite que o conteúdo determine
   * a altura necessária.
   */
        height: max-content;

        align-self: start;
      }

      /*
 * ==================================================
 * COMPONENTES DENTRO DO PAINEL
 * ==================================================
 *
 * O componente filho continua usando
 * grid-column/grid-row definidos pelo editor.
 */

      .canvas-component[data-component="panel"]
        > .panel-content
        > .canvas-component
        input,
      .canvas-component[data-component="panel"]
        > .panel-content
        > .canvas-component
        select {
        width: 100%;

        min-width: 0;

        box-sizing: border-box;
      }

      /*
 * ==================================================
 * PAINEL SELECIONADO
 * ==================================================
 */

      .canvas-component[data-component="panel"].selected > .panel-content {
        border-color: #4285f4;
      } /* @MODULE: CANVAS_COMPONENTS:CSS:END */

      /* ==================================================
       @MODULE: DRAG_PREVIEW:CSS:START
    ================================================== */

      .component-preview {
        min-width: 0;

        padding: 12px;

        border: 2px dashed #4285f4;

        border-radius: 6px;

        background: #eef5ff;

        pointer-events: none;

        opacity: 0.8;

        overflow: hidden;
      }

      .component-preview label {
        display: block;

        margin-bottom: 5px;
      }

      .component-preview input,
      .component-preview select {
        width: 100%;

        padding: 10px;

        border: 1px solid #ccc;

        border-radius: 5px;

        font-size: 14px;
      }

      /* @MODULE: DRAG_PREVIEW:CSS:END */
    </style>
  </head>

  <body>
    <div class="app">
      <!-- ==================================================
         @MODULE: COMPONENTS_PANEL:HTML:START
    ================================================== -->

      <aside class="components-panel">
        <div class="components-header">Componentes</div>

        <div class="components-list">
          <div class="component" draggable="true" data-component="input">
            Input
          </div>

          <div class="component" draggable="true" data-component="dropdown">
            Dropdown
          </div>

          <div class="component" draggable="true" data-component="button">
            Button
          </div>

          <div class="component" draggable="true" data-component="text">
            Texto
          </div>

          <div class="component" draggable="true" data-component="panel">
            Painel
          </div>
        </div>

        <!-- @MODULE: COMPONENTS_PANEL:HTML:END -->

        <!-- ==================================================
           @MODULE: PROPERTIES:HTML:START
      ================================================== -->

        <div class="properties">
          <!-- ==================================================
       TELAS
       ================================================== -->

          <div class="screens">
            <div class="screens-title">
              <span>Telas</span>
            </div>

            <div class="screens-list" id="screensList"></div>

            <button
              type="button"
              class="create-screen-button"
              id="createScreenButton"
            >
              + Criar nova tela
            </button>
          </div>

          <div class="screen-separator"></div>

          <!-- ==================================================
       PROPRIEDADES
       ================================================== -->

          <div class="properties-title">Propriedades</div>

          <div class="no-selection" id="noSelection">
            Selecione um componente para editar suas propriedades.
          </div>

          <div id="propertyForm" style="display: none">
            <div class="property">
              <label>Colunas</label>

              <input id="propertyColumns" type="number" min="1" max="12" />
            </div>

            <div class="property" id="labelProperty">
              <label>Label</label>

              <input id="propertyLabel" type="text" />
            </div>

            <div class="property" id="placeholderProperty">
              <label>Placeholder</label>

              <input id="propertyPlaceholder" type="text" />
            </div>

            <!-- ==================================================
         TEXTO DO BOTÃO
         ================================================== -->

            <div class="property" id="buttonTextProperty">
              <label>Texto do botão</label>

              <input id="propertyButtonText" type="text" />
            </div>

            <!-- ==================================================
         INPUTS DO BOTÃO
         ================================================== -->

            <div class="property" id="buttonInputsProperty">
              <label>Inputs</label>

              <div id="buttonInputs"></div>
            </div>

            <!-- ==================================================
         TABELA DO BOTÃO
         ================================================== -->

            <div class="property" id="buttonTableProperty">
              <label>Tabela</label>

              <input
                id="propertyButtonTable"
                type="text"
                placeholder="Ex.: clientes"
                autocomplete="off"
              />
            </div>

            <!-- ==================================================
         AÇÃO DO BOTÃO
         ================================================== -->

            <div
              class="property button-action-property"
              id="buttonActionProperty"
            >
              <label>Ação</label>

              <select id="buttonAction">
                <option value="none">Nenhuma ação</option>

                <option value="navigate">Ir para tela</option>
              </select>
            </div>

            <div
              class="property button-action-fields"
              id="buttonNavigateProperty"
            >
              <label>Tela de destino</label>

              <select id="buttonNavigateScreen"></select>
            </div>
          </div>
        </div>

        <!-- @MODULE: PROPERTIES:HTML:END -->
      </aside>

      <!-- @MODULE: COMPONENTS_PANEL:HTML:END -->

      <!-- ==================================================
         @MODULE: WORKSPACE:HTML:START
    ================================================== -->

      <main class="workspace">
        <header class="toolbar">
          <span class="toolbar-title">One File Box</span>

          <div class="projects">
            <label for="projectList">Projetos</label>

            <select id="projectList">
              <option value="">Nenhum projeto salvo</option>
            </select>
          </div>

          <button type="button" onclick="saveProject()">Salvar</button>
          <button id="testProjectButton">Testar</button>
        </header>

        <section class="canvas">
          <div class="canvas-content" id="canvas">
            <div class="empty-message" id="emptyMessage">
              Arraste um componente para cá
            </div>

            <div class="canvas-grid" id="grid"></div>
          </div>
        </section>
      </main>
      <!-- @MODULE: WORKSPACE:HTML:END -->
    </div>

    <!-- ==================================================
   @MODULE: ENV:JS:START
================================================== -->

    <script>
      const ENV = {
        mode: "dev",

        isDev() {
          return this.mode === "dev";
        },

        isProd() {
          return this.mode === "prod";
        },

        setMode(mode) {
          if (mode !== "dev" && mode !== "prod") {
            throw new Error(`Modo inválido: ${mode}`);
          }

          this.mode = mode;
        },
      };
    </script>

    <!-- @MODULE: ENV:JS:END -->
    <!-- ==================================================
       @MODULE: STATE:JS:START
  ================================================== -->

    <script>
      const EditorState = {
        draggedType: null,

        draggedElement: null,

        preview: null,

        selected: null,

        originalPosition: null,

        /*
         * Container que receberá o componente
         * durante o drag.
         *
         * null = grid principal.
         *
         * Quando definido, será o .panel-content
         * do Painel de destino.
         */
        dropContainer: null,

        currentProject: null,

        /*
         * ID da tela atualmente aberta no editor.
         */
        currentScreenId: null,

        /*
         * Projeto que estava sendo editado
         * quando o usuário entrou no modo de teste.
         */
        productionProject: null,
      };
    </script>

    <!-- @MODULE: STATE:JS:END -->

    <!-- ==================================================
   @MODULE: DOM:JS:START
================================================== -->

    <script>
      const DOM = {
        /*
         * ==================================================
         * WORKSPACE
         * ==================================================
         */

        canvas: document.getElementById("canvas"),

        grid: document.getElementById("grid"),

        emptyMessage: document.getElementById("emptyMessage"),

        /*
         * ==================================================
         * PROPERTIES
         * ==================================================
         */

        propertyForm: document.getElementById("propertyForm"),

        noSelection: document.getElementById("noSelection"),

        propertyColumns: document.getElementById("propertyColumns"),

        propertyLabel: document.getElementById("propertyLabel"),

        propertyPlaceholder: document.getElementById("propertyPlaceholder"),

        labelProperty: document.getElementById("labelProperty"),

        placeholderProperty: document.getElementById("placeholderProperty"),

        /*
         * ==================================================
         * BUTTON TEXT
         * ==================================================
         */

        buttonTextProperty: document.getElementById("buttonTextProperty"),

        propertyButtonText: document.getElementById("propertyButtonText"),

        /*
         * ==================================================
         * BUTTON INPUTS
         * ==================================================
         */

        buttonInputsProperty: document.getElementById("buttonInputsProperty"),

        buttonInputs: document.getElementById("buttonInputs"),

        /*
         * ==================================================
         * BUTTON TABLE
         * ==================================================
         */

        buttonTableProperty: document.getElementById("buttonTableProperty"),

        propertyButtonTable: document.getElementById("propertyButtonTable"),

        /*
         * ==================================================
         * BUTTON ACTION
         * ==================================================
         */

        buttonActionProperty: document.getElementById("buttonActionProperty"),

        buttonAction: document.getElementById("buttonAction"),

        buttonNavigateProperty: document.getElementById(
          "buttonNavigateProperty",
        ),

        buttonNavigateScreen: document.getElementById("buttonNavigateScreen"),

        /*
         * ==================================================
         * SCREENS
         * ==================================================
         */

        screenList: document.getElementById("screensList"),

        newScreenButton: document.getElementById("createScreenButton"),

        /*
         * ==================================================
         * PROJECTS
         * ==================================================
         */

        projectList: document.getElementById("projectList"),
      };
    </script>

    <!-- @MODULE: DOM:JS:END -->

    <!-- ==================================================
       @MODULE: COMPONENTS:JS:START
  ================================================== -->

    <script>
      /*
       * ==================================================
       * COMPONENTS:JS
       * ==================================================
       *
       * Responsável por:
       *
       * - renderizar o HTML interno dos componentes
       * - criar componentes
       * - reconstruir componentes
       * - atualizar componentes sem perder os filhos
       *
       * IMPORTANTE:
       *
       * createComponent() cria somente o componente.
       *
       * A reconstrução dos filhos de Panels é feita
       * pelos módulos responsáveis por carregar dados:
       *
       * - SCREENS:JS
       * - STORAGE:JS
       *
       * Isso evita que os filhos sejam criados duas vezes.
       *
       * ==================================================
       */

      function renderComponentHTML(type, data = {}) {
        if (type === "input") {
          /*
           * ==================================================
           * PLACEHOLDER
           * ==================================================
           *
           * O padrão de um novo Input é vazio.
           *
           * Se existir um placeholder salvo,
           * ele é restaurado.
           */

          const placeholder =
            data.placeholder !== undefined && data.placeholder !== null
              ? String(data.placeholder)
              : "";

          return `
    <label class="editable-label">
      ${data.label || "Input"}
    </label>

    <input
      type="text"
      data-input-id="${data.id || ""}"
      placeholder="${placeholder}"
    >
  `;
        }

        if (type === "dropdown") {
          return `
    <label class="editable-label">
      ${data.label || "Dropdown"}
    </label>

    <select>
      <option>Opção 1</option>
      <option>Opção 2</option>
      <option>Opção 3</option>
    </select>
  `;
        }

        if (type === "button") {
          const buttonText =
            data.buttonText !== undefined && data.buttonText !== null
              ? String(data.buttonText)
              : "Botão";

          return `
    <button type="button">
      ${buttonText}
    </button>
  `;
        }

        if (type === "panel") {
          return `
    <div class="panel-content"></div>
  `;
        }

        return `
  <p>
    Texto
  </p>
`;
      }

      /*
       * ==================================================
       * APLICAR POSIÇÃO
       * ==================================================
       */

      function applyComponentPosition(element) {
        if (!element) {
          return;
        }

        const row = Number(element.dataset.row) || 1;

        const column = Number(element.dataset.column) || 1;

        const columns = Number(element.dataset.columns) || 3;

        element.style.gridRow = row;

        element.style.gridColumn = `${column} / span ${columns}`;
      }

      /*
       * ==================================================
       * CRIAR COMPONENTE
       * ==================================================
       *
       * IMPORTANTE:
       *
       * Esta função precisa permanecer GLOBAL.
       *
       * O SCREENS:JS utiliza:
       *
       * createComponent(data.type, data)
       *
       * Portanto NÃO colocar esta função dentro
       * de outro escopo, objeto ou callback.
       *
       * ==================================================
       */

      function createComponent(type, data = {}) {
        const element = document.createElement("div");

        element.className = "canvas-component";

        element.draggable = true;

        element.dataset.component = type;

        /*
         * ==================================================
         * GRID
         * ==================================================
         */

        element.dataset.row = Number(data.row) || 1;

        element.dataset.column = Number(data.column) || 1;

        element.dataset.columns = Number(data.columns) || 3;

        /*
         * ==================================================
         * INPUT / DROPDOWN
         * ==================================================
         */

        if (type === "input" || type === "dropdown") {
          element.dataset.label =
            data.label || (type === "input" ? "Input" : "Dropdown");

          /*
           * ==================================================
           * PLACEHOLDER
           * ==================================================
           */

          element.dataset.placeholder =
            data.placeholder !== undefined && data.placeholder !== null
              ? String(data.placeholder)
              : "";
        }

        /*
         * ==================================================
         * INPUT
         * ==================================================
         */

        if (type === "input") {
          element.dataset.id = data.id || crypto.randomUUID();
        }

        /*
         * ==================================================
         * BUTTON
         * ==================================================
         */

        if (type === "button") {
          element.dataset.buttonText =
            data.buttonText !== undefined && data.buttonText !== null
              ? String(data.buttonText)
              : "Botão";

          element.dataset.inputs = JSON.stringify(
            Array.isArray(data.inputs) ? data.inputs : [],
          );

          element.dataset.action = data.action || "none";

          element.dataset.actionScreen = data.actionScreen || "";

          /*
           * ==================================================
           * TABELA
           * ==================================================
           *
           * Mantém a tabela salva no botão.
           */

          element.dataset.table =
            data.table !== undefined && data.table !== null
              ? String(data.table)
              : "";
        }

        /*
         * ==================================================
         * PANEL
         * ==================================================
         */

        if (type === "panel") {
          element.dataset.label = data.label || "Painel";
        }

        /*
         * ==================================================
         * CRIA HTML
         * ==================================================
         *
         * Somente a estrutura própria do componente.
         *
         * Os filhos do Panel NÃO são criados aqui.
         *
         * ==================================================
         */

        element.innerHTML = renderComponentHTML(type, element.dataset);

        /*
         * ==================================================
         * APLICA POSIÇÃO
         * ==================================================
         */

        applyComponentPosition(element);

        return element;
      }

      /*
       * ==================================================
       * ATUALIZAR COMPONENTE
       * ==================================================
       *
       * IMPORTANTE:
       *
       * Nunca destrói os filhos de um Panel.
       *

            return (
              String(screen.name).toLowerCase() === screenName.toLowerCase()
            );
          });

            alert(`Já existe uma tela chamada "${screenName}".`);

          /*
           * ==================================================
           * ATUALIZA ESTADO
           * ==================================================

        if (EditorState.currentScreenId) {
          screen = project.screens.find((item) => {
            return item.id === EditorState.currentScreenId;

        /*
         * Depois pela referência.
         */

        if (
          !screen &&
          EditorState.currentScreen &&
          EditorState.currentScreen.id

          screen = project.screens.find((item) => {
            return item.id === EditorState.currentScreen.id;
          });
        }

        /*

         * FALLBACK
         * ==================================================
         *
         * Se a última tela não existe mais,
         * usa a primeira tela.
         * Isso é importante principalmente quando

         * ATUALIZA ESTADO GLOBAL

         */

        EditorState.currentScreen = screen;

        EditorState.currentScreenId = screen.id;

         * RENDERIZA
         * ==================================================
         */

               * ==================================================
               */

              if (!database.objectStoreNames.contains(this.storeName)) {
                database.createObjectStore(this.storeName, {
                  keyPath: "name",
                });
              }

              /*
               * ==================================================
               * DADOS DAS TABELAS
               * ==================================================
               *
               * Cada registro recebe ID automático.
               *
               * Exemplo:
               *
               * {
               *   id: 1,
               *   projectName: "MeuProjeto",
               *   tableName: "clientes",
               *   values: {
               *     Nome: "Ederson",
               *     Email: "eder@email.com"
               *   }
               * }
               *
               * ==================================================
               */

              if (!database.objectStoreNames.contains(this.dataStoreName)) {
                const dataStore = database.createObjectStore(
                  this.dataStoreName,
                  {
                    keyPath: "id",
                    autoIncrement: true,
                  },
                );

                /*
                 * Permite buscar registros
                 * posteriormente por projeto e tabela.
                 */

                dataStore.createIndex("projectName", "projectName", {
                  unique: false,
                });

                dataStore.createIndex("tableName", "tableName", {
                  unique: false,
                });

                dataStore.createIndex(
                  "projectTable",
                  ["projectName", "tableName"],
                  {
                    unique: false,
                  },
                );
              } else {
                /*
                 * ==================================================
                 * GARANTE ÍNDICES DA STORE EXISTENTE
                 * ==================================================
                 *
                 * Isso protege instalações antigas onde a store
                 * "data" já existia, mas algum índice ainda não.
                 * ==================================================
                 */

                const transaction = event.target.transaction;

                if (transaction) {
                  const dataStore = transaction.objectStore(this.dataStoreName);

                  if (!dataStore.indexNames.contains("projectName")) {
                    dataStore.createIndex("projectName", "projectName", {
                      unique: false,
                    });
                  }

                  if (!dataStore.indexNames.contains("tableName")) {
                    dataStore.createIndex("tableName", "tableName", {
                      unique: false,
                    });
                  }

                  if (!dataStore.indexNames.contains("projectTable")) {
                    dataStore.createIndex(
                      "projectTable",
                      ["projectName", "tableName"],
                      {
                        unique: false,
                      },
                    );
                  }
                }
              }
            };

            request.onsuccess = () => {
              const database = request.result;

              /*
               * ==================================================
               * VERIFICAÇÃO DE SEGURANÇA
               * ==================================================
               */

              if (!database.objectStoreNames.contains(this.storeName)) {
                database.close();

                reject(
                  new Error(
                    `IndexedDB: objectStore "${this.storeName}" não existe.`,
                  ),
                );

                return;
              }

              if (!database.objectStoreNames.contains(this.dataStoreName)) {
                database.close();

                reject(
                  new Error(
                    `IndexedDB: objectStore "${this.dataStoreName}" não existe.`,
                  ),
                );

                return;
              }

              resolve(database);
            };

            request.onerror = () => {
              reject(request.error);
            };

            request.onblocked = () => {
              reject(
                new Error(
                  "IndexedDB está bloqueado. Feche outras abas do OneFileBox e tente novamente.",
                ),
              );
            };
          });
        },

        /*
         * ==================================================
         * SALVAR PROJETO
         * ==================================================
         */

        async save(name) {
          name = String(name || "").trim();

          if (!name) {
            throw new Error("O nome do projeto é obrigatório.");
          }

          const project = this.createProject(name);

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readwrite",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.put(project);

            request.onsuccess = () => {
              console.log("OneFileBox: projeto salvo no IndexedDB.", project);

              resolve(project);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * SALVAR SOMENTE A ÚLTIMA TELA
         * ==================================================
         */

        async saveLastScreen(projectName, screenId) {
          projectName = String(projectName || "").trim();

          screenId = String(screenId || "").trim();

          if (!projectName || !screenId) {
            return;
          }

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readwrite",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.get(projectName);

            request.onsuccess = () => {
              const project = request.result;

              if (!project) {
                reject(new Error("Projeto não encontrado."));

                return;
              }

              project.lastScreenId = screenId;

              store.put(project);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();

              resolve();
            };

            transaction.onerror = () => {
              database.close();

              reject(transaction.error);
            };

            transaction.onabort = () => {
              database.close();

              reject(transaction.error || new Error("Transação abortada."));
            };
          });
        },

        /*
         * ==================================================
         * CARREGAR PROJETO
         * ==================================================
         */

        async load(name) {
          name = String(name || "").trim();

          if (!name) {
            throw new Error("O nome do projeto é obrigatório.");
          }

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readonly",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.get(name);

            request.onsuccess = () => {
              const project = request.result || null;

              resolve(this.normalizeProject(project));
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * LISTAR PROJETOS
         * ==================================================
         */

        async list() {
          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readonly",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.getAll();

            request.onsuccess = () => {
              const projects = request.result.map((project) =>
                this.normalizeProject(project),
              );

              resolve(projects);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * REMOVER
         * ==================================================
         */

        async remove(name) {
          name = String(name || "").trim();

          if (!name) {
            throw new Error("O nome do projeto é obrigatório.");
          }

          const database = await this.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              this.storeName,
              "readwrite",
            );

            const store = transaction.objectStore(this.storeName);

            const request = store.delete(name);

            request.onsuccess = () => {
              resolve();
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * CRIA PROJETO
         * ==================================================
         */

        createProject(name) {
          const currentProject = EditorState.currentProject;

          let screens =
            currentProject && Array.isArray(currentProject.screens)
              ? currentProject.screens.map((screen) => ({
                  id: screen.id,

                  name: screen.name,

                  components: Array.isArray(screen.components)
                    ? screen.components.map((component) =>
                        this.cloneComponent(component),
                      )
                    : [],
                }))
              : [];

          if (!screens.length) {
            screens = [
              {
                id: this.createScreenId(),

                name: "Home",

                components: [],
              },
            ];
          }

          /*
           * ==================================================
           * LIMPA E NORMALIZA TODAS AS TELAS
           * ==================================================
           */

          screens = screens.map((screen) => {
            return this.sanitizeScreen(screen);
          });

          /*
           * ==================================================
           * TELA ATUAL
           * ==================================================
           */

          const currentScreenIndex = screens.findIndex(
            (screen) => screen.id === EditorState.currentScreenId,
          );

          const currentScreen =
            currentScreenIndex >= 0 ? currentScreenIndex : 0;

          /*
           * ==================================================
           * SERIALIZA GRID ATUAL
           * ==================================================
           */

          screens[currentScreen].components = this.serializeCurrentGrid();

          /*
           * Normaliza novamente.
           */

          screens[currentScreen] = this.sanitizeScreen(screens[currentScreen]);

          /*
           * ==================================================
           * ÚLTIMA TELA
           * ==================================================
           */

          let lastScreenId = EditorState.currentScreenId;

          const lastScreenExists = screens.some(
            (screen) => screen.id === lastScreenId,
          );

          if (!lastScreenId || !lastScreenExists) {
            lastScreenId = screens[currentScreen]?.id || null;
          }

          return {
            name,

            version: 5,

            screens,

            lastScreenId,

            grid: {
              columns: 12,
            },

            savedAt: new Date().toISOString(),
          };
        },

        /*
         * ==================================================
         * SERIALIZA GRID ATUAL
         * ==================================================
         */

        serializeCurrentGrid() {
          if (!DOM.grid) {
            return [];
          }

          return [...DOM.grid.children]
            .filter((element) => element !== EditorState.preview)
            .filter((element) => element.classList.contains("canvas-component"))
            .map((element) => this.serializeComponent(element))
            .filter(Boolean);
        },

        /*
         * ==================================================
         * SERIALIZA COMPONENTE
         * ==================================================
         */

        serializeComponent(element) {
          if (!element) {
            return null;
          }

          const type = element.dataset.component || null;

          const component = {
            type,

            id: element.dataset.id || null,

            row: Number(element.dataset.row) || 1,

            column: Number(element.dataset.column) || 1,

            columns: Number(element.dataset.columns) || 1,

            label: element.dataset.label || "",

            placeholder:
              element.dataset.placeholder !== undefined &&
              element.dataset.placeholder !== null
                ? String(element.dataset.placeholder)
                : "",

            buttonText:
              element.dataset.buttonText !== undefined &&
              element.dataset.buttonText !== null
                ? String(element.dataset.buttonText)
                : element.dataset.component === "button"
                  ? "Botão"
                  : "",

            inputs: this.parseInputs(element.dataset.inputs),

            table:
              element.dataset.table !== undefined &&
              element.dataset.table !== null
                ? String(element.dataset.table)
                : "",

            action: element.dataset.action || "none",

            actionScreen: element.dataset.actionScreen || "",
          };

          /*
           * ==================================================
           * FILHOS DO PANEL
           * ==================================================
           */

          if (type === "panel") {
            const content = element.querySelector(":scope > .panel-content");

            component.children = content
              ? [...content.children]
                  .filter((child) => child !== EditorState.preview)
                  .filter((child) =>
                    child.classList.contains("canvas-component"),
                  )
                  .map((child) => this.serializeComponent(child))
                  .filter(Boolean)
              : [];
          }

          return component;
        },

        /*
         * ==================================================
         * NORMALIZAR TELA
         * ==================================================
         */

        sanitizeScreen(screen) {
          if (!screen) {
            return {
              id: this.createScreenId(),

              name: "Tela",

              components: [],
            };
          }

          const components = Array.isArray(screen.components)
            ? screen.components
            : [];

          /*
           * IDs que pertencem a filhos de Panels.
           */

          const childIds = new Set();

          const collectChildIds = (component) => {
            if (!component) {
              return;
            }

            if (Array.isArray(component.children)) {
              component.children.forEach((child) => {
                if (child?.id) {
                  childIds.add(child.id);
                }

                collectChildIds(child);
              });
            }
          };

          components.forEach(collectChildIds);

          /*
           * IDs já utilizados.
           */

          const usedIds = new Set();

          /*
           * Limpa recursivamente.
           */

          const sanitizeComponents = (items, isRoot = false) => {
            const result = [];

            items.forEach((component) => {
              if (!component || !component.type) {
                return;
              }

              if (isRoot && component.id && childIds.has(component.id)) {
                return;
              }

              if (component.id && usedIds.has(component.id)) {
                return;
              }

              if (component.id) {
                usedIds.add(component.id);
              }

              const clean = this.cloneComponent(component);

              if (Array.isArray(clean.children)) {
                clean.children = sanitizeComponents(clean.children, false);
              }

              result.push(clean);
            });

            return result;
          };

          return {
            ...screen,

            id: screen.id || this.createScreenId(),

            name: screen.name || "Tela",

            components: sanitizeComponents(components, true),
          };
        },

        /*
         * ==================================================
         * CLONAR COMPONENTE
         * ==================================================
         */

        cloneComponent(component) {
          if (!component) {
            return component;
          }

          const cloned = {
            ...component,

            placeholder:
              component.placeholder !== undefined &&
              component.placeholder !== null
                ? String(component.placeholder)
                : "",
          };

          /*
           * ==================================================
           * TEXTO DO BOTÃO
           * ==================================================
           */

          if (component.type === "button") {
            cloned.buttonText =
              component.buttonText !== undefined &&
              component.buttonText !== null
                ? String(component.buttonText)
                : "Botão";

            /*
             * Mantém a tabela do botão.
             */

            cloned.table =
              component.table !== undefined && component.table !== null
                ? String(component.table)
                : "";

            /*
             * Mantém os Inputs selecionados.
             */

            cloned.inputs = Array.isArray(component.inputs)
              ? [...new Set(component.inputs)]
              : [];
          }

          /*
           * ==================================================
           * FILHOS
           * ==================================================
           */

          if (Array.isArray(component.children)) {
            cloned.children = component.children.map((child) =>
              this.cloneComponent(child),
            );
          }

          return cloned;
        },

        /*
         * ==================================================
         * PARSE INPUTS
         * ==================================================
         */

        parseInputs(value) {
          if (!value) {
            return [];
          }

          try {
            const inputs = JSON.parse(value);

            return Array.isArray(inputs) ? [...new Set(inputs)] : [];
          } catch {
            return [];
          }
        },

        /*
         * ==================================================
         * NORMALIZA PROJETO
         * ==================================================
         */

        normalizeProject(project) {
          if (!project) {
            return null;
          }

          /*
           * ==================================================
           * PROJETO COM TELAS
           * ==================================================
           */

          if (Array.isArray(project.screens) && project.screens.length) {
            const screens = project.screens.map((screen) =>
              this.sanitizeScreen({
                ...screen,

                components: Array.isArray(screen.components)
                  ? screen.components
                  : [],
              }),
            );

            /*
             * ==================================================
             * VALIDAR LAST SCREEN
             * ==================================================
             */

            let lastScreenId = project.lastScreenId || null;

            const lastScreenExists = screens.some(
              (screen) => screen.id === lastScreenId,
            );

            if (!lastScreenExists) {
              lastScreenId = screens[0]?.id || null;
            }

            return {
              ...project,

              version: Math.max(Number(project.version) || 2, 5),

              screens,

              lastScreenId,
            };
          }

          /*
           * ==================================================
           * PROJETO ANTIGO
           * ==================================================
           */

          const components = Array.isArray(project.components)
            ? project.components
            : [];

          const firstScreen = {
            id: this.createScreenId(),

            name: "Home",

            components,
          };

          return {
            ...project,

            version: 5,

            screens: [this.sanitizeScreen(firstScreen)],

            lastScreenId: firstScreen.id,
          };
        },

        /*
         * ==================================================
         * CARREGA PROJETO
         * ==================================================
         */

        loadProject(project) {
          project = this.normalizeProject(project);

          if (!project) {
            throw new Error("Projeto não encontrado.");
          }

          if (!DOM.grid) {
            throw new Error(
              "Não é possível carregar o projeto: grid do editor não existe.",
            );
          }

          EditorState.currentProject = project;

          /*
           * ==================================================
           * PRIMEIRO TENTA LAST SCREEN
           * ==================================================
           */

          let screenId = project.lastScreenId || EditorState.currentScreenId;

          const exists = project.screens.some(
            (screen) => screen.id === screenId,
          );

          if (!exists) {
            screenId = project.screens[0]?.id || null;
          }

          EditorState.currentScreenId = screenId;

          EditorState.currentScreen =
            project.screens.find((screen) => screen.id === screenId) || null;

          renderScreenList();

          this.loadCurrentScreen();

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }
        },

        /*
         * ==================================================
         * CRIA COMPONENTE A PARTIR DOS DADOS
         * ==================================================
         */

        createComponentFromData(data) {
          if (!data || !data.type) {
            return null;
          }

          const component = createComponent(data.type, data);

          if (!component) {
            return null;
          }

          component.dataset.row = Number(data.row) || 1;

          component.dataset.column = Number(data.column) || 1;

          component.dataset.columns = Number(data.columns) || 1;

          if (data.id) {
            component.dataset.id = data.id;
          }

          /*
           * ==================================================
           * INPUT / DROPDOWN
           * ==================================================
           */

          if (data.type === "input" || data.type === "dropdown") {
            component.dataset.label = data.label || "";

            component.dataset.placeholder =
              data.placeholder !== undefined && data.placeholder !== null
                ? String(data.placeholder)
                : "";
          }

          /*
           * ==================================================
           * BUTTON
           * ==================================================
           */

          if (data.type === "button") {
            component.dataset.buttonText =
              data.buttonText !== undefined && data.buttonText !== null
                ? String(data.buttonText)
                : "Botão";

            component.dataset.inputs = JSON.stringify(
              Array.isArray(data.inputs) ? [...new Set(data.inputs)] : [],
            );

            component.dataset.table =
              data.table !== undefined && data.table !== null
                ? String(data.table)
                : "";

            component.dataset.action = data.action || "none";

            component.dataset.actionScreen = data.actionScreen || "";
          }

          /*
           * ==================================================
           * PANEL
           * ==================================================
           */

          if (data.type === "panel") {
            component.dataset.label = data.label || "Painel";
          }

          applyComponentPosition(component);

          /*
           * ==================================================
           * FILHOS DO PANEL
           * ==================================================
           */

          if (data.type === "panel" && Array.isArray(data.children)) {
            const content = component.querySelector(":scope > .panel-content");

            if (content) {
              data.children.forEach((childData) => {
                const child = this.createComponentFromData(childData);

                if (!child) {
                  return;
                }

                content.appendChild(child);
              });
            }
          }

          return component;
        },

        /*
         * ==================================================
         * CARREGA TELA ATUAL
         * ==================================================
         */

        loadCurrentScreen() {
          if (!DOM.grid) {
            return;
          }

          const project = EditorState.currentProject;

          if (!project || !Array.isArray(project.screens)) {
            return;
          }

          const screen = project.screens.find(
            (item) => item.id === EditorState.currentScreenId,
          );

          if (!screen) {
            return;
          }

          EditorState.currentScreen = screen;

          /*
           * Remove componentes do grid.
           */

          DOM.grid
            .querySelectorAll(":scope > .canvas-component")
            .forEach((element) => element.remove());

          if (DOM.propertyForm) {
            DOM.propertyForm.style.display = "none";
          }

          if (DOM.noSelection) {
            DOM.noSelection.style.display = "block";
          }

          EditorState.selected = null;

          /*
           * Reconstrói componentes.
           */

          screen.components.forEach((data) => {
            const component = this.createComponentFromData(data);

            if (!component) {
              return;
            }

            DOM.grid.appendChild(component);
          });

          renderScreenList();

          if (typeof updateEmptyMessage === "function") {
            updateEmptyMessage();
          }
        },

        /*
         * ==================================================
         * ID DE TELA
         * ==================================================
         */

        createScreenId() {
          return "screen-" + crypto.randomUUID();
        },
      };

      /*
       * ==================================================
       * DATA STORAGE
       * ==================================================
       *
       * Responsável exclusivamente pelos
       * registros criados pelos botões.
       *
       * ==================================================
       */

      const DataStorage = {
        /*
         * ==================================================
         * VALIDAR NOME DA TABELA
         * ==================================================
         */

        normalizeTableName(tableName) {
          tableName = String(tableName || "").trim();

          if (!tableName) {
            throw new Error("O nome da tabela é obrigatório.");
          }

          if (!/^[a-zA-Z0-9_-]+$/.test(tableName)) {
            throw new Error(
              "O nome da tabela pode conter somente letras, números, _ e -.",
            );
          }

          return tableName;
        },

        /*
         * ==================================================
         * SALVAR REGISTRO
         * ==================================================
         */

        async insert(tableName, values) {
          console.log("OneFileBox: iniciando salvamento no IndexedDB...");

          tableName = this.normalizeTableName(tableName);

          if (!values || typeof values !== "object" || Array.isArray(values)) {
            throw new Error("Os dados do registro são inválidos.");
          }

          const project = EditorState.currentProject;

          const projectName = project?.name || "";

          if (!projectName) {
            throw new Error("Nenhum projeto está carregado.");
          }

          console.log("OneFileBox: projeto:", projectName);

          console.log("OneFileBox: tabela:", tableName);

          console.log("OneFileBox: valores:", values);

          const database = await ProjectStorage.open();

          console.log("OneFileBox: IndexedDB aberto.");

          return new Promise((resolve, reject) => {
            let transaction;

            try {
              transaction = database.transaction(
                ProjectStorage.dataStoreName,
                "readwrite",
              );
            } catch (error) {
              database.close();

              reject(error);

              return;
            }

            const store = transaction.objectStore(ProjectStorage.dataStoreName);

            const record = {
              projectName,

              tableName,

              values: {
                ...values,
              },

              createdAt: new Date().toISOString(),
            };

            console.log(
              "OneFileBox: enviando registro para o IndexedDB:",
              record,
            );

            const request = store.add(record);

            request.onsuccess = () => {
              record.id = request.result;

              console.log(
                "OneFileBox: registro aceito pelo IndexedDB. ID:",
                record.id,
              );
            };

            request.onerror = () => {
              console.error(
                "OneFileBox: erro no request do IndexedDB:",
                request.error,
              );

              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();

              console.log(
                "OneFileBox: registro SALVO COM SUCESSO no IndexedDB:",
                record,
              );

              resolve(record);
            };

            transaction.onerror = () => {
              database.close();

              console.error(
                "OneFileBox: erro na transação do IndexedDB:",
                transaction.error,
              );

              reject(transaction.error);
            };

            transaction.onabort = () => {
              database.close();

              const error =
                transaction.error || new Error("Transação abortada.");

              console.error("OneFileBox: transação abortada:", error);

              reject(error);
            };
          });
        },

        /*
         * ==================================================
         * LISTAR REGISTROS DA TABELA
         * ==================================================
         */

        async list(tableName) {
          tableName = this.normalizeTableName(tableName);

          const project = EditorState.currentProject;

          const projectName = project?.name || "";

          if (!projectName) {
            return [];
          }

          const database = await ProjectStorage.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              ProjectStorage.dataStoreName,
              "readonly",
            );

            const store = transaction.objectStore(ProjectStorage.dataStoreName);

            const index = store.index("projectTable");

            const request = index.getAll([projectName, tableName]);

            request.onsuccess = () => {
              resolve(request.result || []);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },

        /*
         * ==================================================
         * LISTAR TODAS AS TABELAS DO PROJETO
         * ==================================================
         */

        async listTables() {
          const project = EditorState.currentProject;

          const projectName = project?.name || "";

          if (!projectName) {
            return [];
          }

          const database = await ProjectStorage.open();

          return new Promise((resolve, reject) => {
            const transaction = database.transaction(
              ProjectStorage.dataStoreName,
              "readonly",
            );

            const store = transaction.objectStore(ProjectStorage.dataStoreName);

            const index = store.index("projectName");

            const request = index.getAll(projectName);

            request.onsuccess = () => {
              const records = request.result || [];

              const tables = [
                ...new Set(records.map((record) => record.tableName)),
              ];

              resolve(tables);
            };

            request.onerror = () => {
              reject(request.error);
            };

            transaction.oncomplete = () => {
              database.close();
            };

            transaction.onerror = () => {
              database.close();
            };

            transaction.onabort = () => {
              database.close();
            };
          });
        },
      };
    </script>

    <script>
      /*
       * ==================================================
       * UI - BOTÕES
       * ==================================================
       *
       * Responsável pelos botões e interações
       * gerais da interface do editor.
       *
       * NÃO contém:
       * - renderização do runtime
       * - navegação de produção
       * - armazenamento de projetos
       * - criação de telas
       */

      /*
       * ==================================================
       * BOTÃO TESTAR
       * ==================================================
       */

      function updateTestButton() {
        const button = document.getElementById("testProjectButton");

        if (!button) {
          return;
        }

        button.textContent = ENV.isProd() ? "Voltar ao editor" : "Testar";
      }

      /*
       * ==================================================
       * ALTERNAR MODO
       * ==================================================
       */

      async function toggleProjectMode() {
        const button = document.getElementById("testProjectButton");

        if (button) {
          button.disabled = true;
        }

        try {
          if (ENV.isDev()) {
            await enterProductionMode();
          } else {
            exitProductionMode();
          }

          updateTestButton();
        } catch (error) {
          console.error("Erro ao alternar modo do projeto:", error);
        } finally {
          if (button) {
            button.disabled = false;
          }
        }
      }

      /*
       * ==================================================
       * EVENTO DO BOTÃO TESTAR
       * ==================================================
       */

      const testProjectButton = document.getElementById("testProjectButton");

      if (testProjectButton) {
        testProjectButton.addEventListener("click", toggleProjectMode);
      }

      updateTestButton();

      /*
       * ==================================================
       * SALVAR DADOS DO BOTÃO
       * ==================================================
       *
       * Pega:
       *
       * - a tabela configurada no Properties
       * - os Inputs associados ao botão
       * - os valores digitados nesses Inputs
       *
       * E salva tudo no IndexedDB através de:
       *
       * DataStorage.insert()
       *
       * ==================================================
       */

      async function saveButtonData(component) {
        if (!component) {
          return;
        }

        /*
         * ==================================================
         * TABELA
         * ==================================================
         *
         * A tabela é definida no Properties
         * e armazenada no:
         *
         * component.dataset.table
         */

        const tableName = String(component.dataset.table || "").trim();

        if (!tableName) {
          alert("Informe o nome da tabela nas propriedades do botão.");

          return;
        }

        /*
         * ==================================================
         * INPUTS ASSOCIADOS
         * ==================================================
         */

        let inputIds = [];

        try {
          inputIds = JSON.parse(component.dataset.inputs || "[]");
        } catch {
          inputIds = [];
        }

        /*
         * ==================================================
         * COLETAR VALORES
         * ==================================================
         */

        const values = {};

        inputIds.forEach((id) => {
          const inputComponent = DOM.grid.querySelector(
            `.canvas-component[data-id="${CSS.escape(id)}"]`,
          );

          if (!inputComponent) {
            return;
          }

          const input = inputComponent.querySelector("input");

          if (!input) {
            return;
          }

          const label = inputComponent.dataset.label || id;

          values[label] = input.value;
        });

        /*
         * ==================================================
         * DEBUG
         * ==================================================
         */

        console.log("OneFileBox: tabela:", tableName);

        console.log("OneFileBox: valores:", values);

        /*
         * ==================================================
         * SALVAR NO INDEXEDDB
         * ==================================================
         */

        if (
          typeof DataStorage === "undefined" ||
          typeof DataStorage.insert !== "function"
        ) {
          console.error(
            "OneFileBox: DataStorage.insert() não está disponível.",
          );

          alert("O armazenamento de dados não está disponível.");

          return;
        }

        try {
          const record = await DataStorage.insert(tableName, values);

          console.log("OneFileBox: dados do botão salvos com sucesso:", record);
        } catch (error) {
          console.error("OneFileBox: erro ao salvar dados do botão:", error);

          alert(
            `Não foi possível salvar os dados na tabela "${tableName}".\n\n${error.message || error}`,
          );
        }
      }

      /*
       * ==================================================
       * CLIQUE NOS BOTÕES DO EDITOR
       * ==================================================
       *
       * Aqui tratamos somente o comportamento
       * do botão enquanto estamos no editor.
       *
       * O comportamento de produção pertence
       * ao RUNTIME:EVENTS:JS.
       */

      if (DOM.grid) {
        DOM.grid.addEventListener("click", async (event) => {
          if (ENV.isProd()) {
            return;
          }

          const button = event.target.closest(
            '.canvas-component[data-component="button"] button',
          );

          if (!button) {
            return;
          }

          const component = button.closest(".canvas-component");

          if (!component) {
            return;
          }

          /*
           * Botões configurados para navegação
           * não são processados aqui.
           */

          const action =
            component.dataset.action || component.dataset.actionType || "none";

          if (action === "navigate") {
            return;
          }

          /*
           * ==================================================
           * SALVAR DADOS
           * ==================================================
           */

          await saveButtonData(component);
        });
      }
    </script>
